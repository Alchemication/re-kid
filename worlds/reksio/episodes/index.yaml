notes:
- text: 'How many episodes there are depends on who is counting. pl-wikipedia lists 65: 52 in the main series (1967–1987) and 13 in the Reksio i ptaki cycle (1987–1990). FilmPolski splits the same material into nine standalone films (the six of 1967–1971, plus Reksio i bocian, Reksio i sroka and Reksio i mrówki), the 1972–1982 TV serial of 44 episodes, and Reksio i ptaki with 11 episodes: 64 titles in all. The one title FilmPolski lacks is Reksio i papuga.'
  status: verified
  sources:
  - pl-wikipedia-reksio
  - filmpolski-reksio
  - filmpolski-reksio-i-ptaki
- text: Numbering follows pl-wikipedia's table, the only list found that covers all 65. FilmPolski numbers the 1972–1982 serial 1–44 and the bird cycle 1–11, in an order that differs within some years (e.g. Reksio swat is its no. 21 but pl-wikipedia's no. 30).
  status: sourced
  sources:
  - pl-wikipedia-reksio
  - filmpolski-reksio
- text: pl-wikipedia's infobox gives the episode count as "65 (+3 specjalne)" — 65 plus three specials — but the article does not say what the specials are.
  status: unknown
  sources: []
- text: 'Where FilmPolski and pl-wikipedia disagree, the year and director fields follow FilmPolski: it is a film-school database with full crew credits, while pl-wikipedia''s episode table cites nothing. In the two disagreements checked against on-screen credits (Reksio kompan and Reksio czyścioch), the credits matched FilmPolski. Five disagreements remain: the years of Reksio i bocian and Reksio i kruk, the directors of Reksio i kruk and Reksio i dzięcioł, and whether Reksio i papuga exists as a separate film.'
  status: interpretation
  sources: []
- text: 'Synopses are English renderings of FilmPolski''s Polish descriptions, written for this catalogue. Runtimes are FilmPolski''s nominal lengths, rounded to whole minutes; the studio''s uploads run a little shorter or longer (e.g. Reksio remontuje: 12 min per FilmPolski, 11 min 49 s as uploaded).'
  status: sourced
  sources:
  - filmpolski-reksio
  - sfr-youtube
- text: 'On 2026-09-29 the studio''s YouTube channel had 31 Reksio episodes public: Reksio poliglota (1967) and 30 episodes from 1972–1980. None of the 1969–1971 films or of the episodes from 1981 on were public. Its REKSIO playlist also holds two private videos. Episodes with a watch_url are those uploads.'
  status: verified
  sources:
  - sfr-youtube
