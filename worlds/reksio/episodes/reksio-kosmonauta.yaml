overview:
  text: A first pass from frames only, not yet a full breakdown. The episode runs 9:57. Frames were read every 4 s, more densely where it was unclear, so the times are approximate, good to a few seconds. Reksio sees a jet, flies a leashed rocket into space, lands on a planet of painted caves, befriends a mermaid princess and a three-headed dragon, rescues both from robot dogs, and wakes on the doghouse roof to his supper. The space adventure is framed by the doghouse at both ends.
  status: observed
  sources:
  - sfr-youtube
  observed_by: claude-frames
