open_questions:
- Where do the theme's phrases and accents fall against these beats? The game would loop one phrase per gag, so the phrase boundaries matter more than anything else here. Needs Adam's ears; the GAD Records album has the theme with and without effects.
- Is the theme the same recording in 1972 and 1980?
- What is the red object Reksio brings down on the film strip in the studio-card beat? A sharper frame or a better copy might tell.
- Is the intro the same in Reksio strażak (1972), the first episode to have it? That episode is not uploaded.
