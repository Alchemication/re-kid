    observed_by: claude-frames
  on_screen_text:
    text: '"scenariusz, opracowanie plastyczne — Lechosław Marszałek" (screenplay and visual design) and "muzyka — Zenon Kowalowski" (music).'
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  sound:
    text: There is the main music heard and dog howling when reksio sings.
    status: observed
    sources: []
    observed_by: adam
  notes:
