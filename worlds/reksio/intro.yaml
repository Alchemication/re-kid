id: intro
title: Title sequence (czołówka)
reference_episode: reksio-kosmonauta
overview:
  text: About 43 seconds of credit cards, from the fade-in to the fade to black. White hand-lettered credits sit on a mustard-ochre card scribbled with pink, blue and green pastel. On almost every card Reksio does one short silent gag next to the names, then the card crossfades to the next. It ends on the studio card and a fade to black; the episode itself starts after that. Times below refer to the studio's upload of Reksio kosmonauta and are read from frames every 0.5 s, so they are good to about half a second.
  status: observed
  sources:
  - sfr-youtube
  observed_by: claude-frames
variation:
  text: |-
    Checked in four uploads: Reksio kosmonauta (1972), Reksio czyścioch (1974), Reksio kompan (1976) and Reksio remontuje (1980). In all four the gags are the same, come in the same order and land within about a second of the same times; at every sampled point Reksio's poses match. What changes from episode to episode is the lettering:
    - the episode title;
    - the credited names, and some extra credit lines (e.g. "współpraca reżyserska" in 1974, "dekoracje" and "kierownictwo grupy produkcyjnej" in 1980);
    - the distributor line, "Centrala Wynajmu Filmów i Telewizja Polska" in 1972 and 1974, "Zjednoczenie Rozpowszechniania Filmów i Telewizja Polska" in 1976 and 1980;
    - the animation card, which spells ANIMACJA vertically in 1972 and as a heading "ANIMACJA:" in 1974, 1976 and 1980.
    What follows the fade to black also differs: Kosmonauta, Czyścioch and Kompan open on the doghouse; Remontuje opens on a street by a brick wall. Popping out of the doghouse belongs to the episode, not to the intro. Earlier films (1967–1971) have no title sequence at all, per pl-wikipedia; the 1967 upload was not checked for this.
  status: observed
  sources:
  - sfr-youtube
  observed_by: claude-frames
