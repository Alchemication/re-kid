    observed_by: claude-frames
aesthetics:
  overview:
    text: Flat, cleanly outlined characters in front of painted, textured backgrounds. The contrast is the signature — simple graphic figures, rich handmade settings. Observed in 3 episodes from 1972, 1977 and 1980 (one still every 15 s, plus the full title sequence at 2 s).
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  palette:
    text: Earthy and warm — mustard-ochre, sand, sienna, sage and dusty teal dominate. Saturated red and orange appear as small accents (rocket stripes, the UFO, the SFR logo, a red jacket). Night and space scenes use deep navy with scattered stars. Reksio's white body stands out against all of it. Colours are from YouTube transfers and may have shifted from the original prints.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
