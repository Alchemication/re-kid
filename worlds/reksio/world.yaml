id: reksio
title: Reksio
title_en: Reksio
country: PL
summary: 'Reksio is a small white terrier with brown patches, the hero of 65 short Polish cartoons made between 1967 and 1990 at the Studio Filmów Rysunkowych in Bielsko-Biała, the studio that also made Bolek and Lolek. His creator, Lechosław Marszałek, based him on his own clever fox terrier, Trola. Each episode is about nine minutes long. Reksio lives in a doghouse beside his family''s home with a curly-haired blond boy, and his days are full of neighbourhood animals: hens, a rooster, a gander, other dogs, and birds. The stories are told almost entirely through pictures and Zenon Kowalowski''s music rather than words, so small children can follow them without reading or speaking Polish. Many episode titles name a role Reksio takes on for the day (fireman, astronaut, teacher, peacemaker), and he is usually the one who helps, rescues or calms things down. Generations of Polish children knew him from TV bedtime cartoons; a bronze Reksio stands in the middle of Bielsko-Biała.'
production:
  studio:
    text: Studio Filmów Rysunkowych in Bielsko-Biała, a state animation studio founded in 1947 and independent from 1 January 1956. The same studio made Bolek i Lolek.
    status: verified
    sources:
    - sfr-about
    - bielsko-biala-tu-narodzil-sie-reksio
    - filmpolski-reksio
  credits:
  - name: Lechosław Marszałek
    role: creator, director, screenwriter, visual design
    claim:
      text: Lechosław Marszałek (1922–1991) created Reksio's "literary and visual form" (the studio's words), wrote most of the screenplays, directed all episodes up to 1971 and many later ones. By pl-wikipedia's count he directed 19 and co-directed 1, but that count includes Reksio kompan and Reksio i kruk, which FilmPolski credits to other directors (for Kompan the on-screen credits agree with FilmPolski). Before Reksio he made Koziołeczek (1953), which the studio calls the first international award in Polish animation history.
      status: verified
      sources:
      - sfr-about
      - filmpolski-reksio
      - pl-wikipedia-reksio
  - name: Halina Filek-Marszałek
    role: director, screenwriter, background designer (scenografia)
    claim:
      text: Directed episodes including Reksio i nośna kura, Reksio i wrona and Reksio i świerszcz (1981–1982), co-wrote, and designed backgrounds — credited "Dekoracje" on Reksio remontuje (1980). Marszałek's wife; after his death she kept the work alive (mural design, foundation, 2022 memoir).
      status: verified
      sources:
      - filmpolski-reksio
      - pl-wikipedia-reksio
      - sfr-youtube
  - name: Józef Ćwiertnia
    role: director
    claim:
      text: Directed more of the 1972–1982 serial than anyone else per FilmPolski (17 of its 44 episodes, one with Romuald Kłys as co-director), including Reksio strażak, Reksio ratownik and Reksio rozjemca. The studio calls him one of the best Reksio directors.
      status: verified
      sources:
      - filmpolski-reksio
      - sfr-about
  - name: Edward Wątor, Marian Cholerek, Romuald Kłys
    role: directors
    claim:
      text: Directed further episodes of the main series. Romuald Kłys also directed Reksio i sroka, Reksio i mrówki and Reksio i bocian (1985–1987).
      status: verified
      sources:
      - filmpolski-reksio
      - pl-wikipedia-reksio
  - name: Ryszard Lepióra, Andrzej Flettner
    role: directors (Reksio i ptaki)
    claim:
      text: Directed the late bird cycle (1987–1990). Marszałek wrote its screenplays.
      status: verified
      sources:
      - filmpolski-reksio-i-ptaki
      - pl-wikipedia-reksio
  first_year: 1967
  last_year: 1990
  years:
    text: The first film, Reksio poliglota, came out in 1967 as a cinema short, shown at children's matinées per en-wikipedia. Six films followed by 1971, all directed by Marszałek. A regular TV serial with a proper title sequence ran from 1972 to 1982. Occasional episodes followed in 1985–1987, then the Reksio i ptaki cycle in 1987–1990. The studio sums it up as 23 years.
    status: verified
    sources:
    - sfr-about
    - pl-wikipedia-reksio
    - en-wikipedia-reksio
    - filmpolski-reksio
  episode_count:
    text: 65 episodes in all — pl-wikipedia counts 52 in the main series plus 13 in Reksio i ptaki, and also mentions 3 special episodes without listing them. Sources split the episodes differently. FilmPolski's serial entry covers 1972–1982 with 44 episodes, and its Reksio i ptaki entry lists 11 because it leaves out Reksio i bocian and Reksio i papuga (1987). The total of 65 agrees across sources.
    status: verified
    sources:
    - pl-wikipedia-reksio
    - en-wikipedia-reksio
    - bielsko-biala-tu-narodzil-sie-reksio
    - filmpolski-reksio
    - filmpolski-reksio-i-ptaki
  episode_runtime:
    text: About 9 minutes; the range is roughly 8–10 minutes. The longest is Reksio remontuje (1980) at about 11:50. The official uploads we sampled run 8:46 (Reksio wybawca), 9:57 (Reksio kosmonauta) and 11:49 (Reksio remontuje).
    status: verified
    sources:
    - filmpolski-reksio
    - pl-wikipedia-reksio
    - sfr-youtube
  technique:
    text: Hand-drawn 2D animation, the studio's "rysunkowy" tradition. Flat-coloured, black-outlined characters move over separately painted backgrounds, consistent with cel animation. Shot on film in 4:3; the sound was mono in the early years and stereo in some later ones. The cel method is inferred from frames and has not been confirmed from a source.
    status: interpretation
    sources:
    - sfr-youtube
    - pl-wikipedia-reksio
  origins:
    text: In 1967 Marszałek stopped working on Bolek i Lolek when his co-creators planned a Wild West series in which children play with guns; he opposed that. Instead he drew on his own dog, Trola, a female wire-haired fox terrier he described as the most intelligent and faithful creature. Reksio poliglota won a prize in Tehran (named in sources as Złoty Słowik / Grand Prix), and its success turned a single film into a series. Reksio is male, though Trola was female.
    status: verified
    sources:
    - pl-wikipedia-reksio
    - dzieje-pl-sfr
    - bielsko-biala-tu-narodzil-sie-reksio
    - filek-marszalek-kolska-2022
    - zycieumyslowe-2016
viewing_context:
  text: Poles who grew up from the late 1960s to the 1980s met Reksio mostly as a bedtime cartoon on TVP — part of the Dobranocka tradition, the short children's programme on TVP1 just before the 19:30 evening news. It went on to repeat for decades on TVP and children's channels (MiniMax, MiniMini+, Polsat JimJam, Kino Polska). It also aired abroad, e.g. in East Germany, France, Greece and the USSR, where he is known as Reks. For many Polish parents it belongs to a ritual — cartoon, then bed — as much as to a story. We have not found broadcast schedules showing when and how often Reksio was actually in the Dobranocka slot.
  status: sourced
  sources:
  - encyklopedia-dziecinstwa-dobranocki
  - pl-wikipedia-reksio
premise:
  text: Reksio, a small, piebald terrier, lives in a doghouse outside his owners' home — a Polish family with a young blond boy — and shares a yard and neighbourhood with hens, a rooster, a gander, cats and other dogs. In each episode he gets caught up in something connected to a role he takes on, an animal he meets (mostly birds later on), a season, or an object. Sources disagree on the setting. FilmPolski calls it a village farmyard ("wiejskie podwórko"); en-wikipedia calls it a middle-class family's courtyard; the 1980 frames show a leafy suburban street with houses. It is probably best described as a small-town edge of the country.
  status: verified
  sources:
  - pl-wikipedia-reksio
  - en-wikipedia-reksio
  - filmpolski-reksio
  - sfr-youtube
episode_formula:
  text: |-
    Titles follow a pattern: "Reksio + role" in the main series (strażak, kosmonauta, nauczyciel, rozjemca, wybawca…) and "Reksio i + bird" in the late cycle (bocian, sowa, kruk…).
    In the three episodes sampled, each opens with Reksio at his doghouse and returns home at the end. A problem or temptation sets things going (a rocket, a leaky pipe, danger to the boy), Reksio acts, and a calm resolution follows before a "KONIEC" card on black.
    en-wikipedia reads him mostly as saviour, helper, rescuer and peacemaker. Everything beyond the title pattern and the KONIEC card is based on 3 of 65 episodes and needs checking against more.
  status: interpretation
  sources:
  - pl-wikipedia-reksio
  - en-wikipedia-reksio
  - sfr-youtube
opening_sequence:
  text: |-
    No title sequence until 1972. Before that, credits were inserted into the start of each film. From Reksio strażak (1972) onward: hand-lettered white credits on a mustard-ochre card textured with pastel/crayon scribbles in pink, blue and green. Between credits Reksio performs small silent gags — stretching into a long sausage under the animators' names, eating from a bowl beside the director's credit, getting tangled in film. It closes on a red SFR logo and a red film strip of tiny Reksio frames.
    The distributor line varies ("Centrala Wynajmu Filmów i Telewizja Polska" in 1972 and 1974, "Zjednoczenie Rozpowszechniania Filmów" in 1976, 1977 and 1980). Zenon Kowalowski's opening theme is called one of the best-known pieces of Polish film music. Its sound is not described here; that needs a listener.
    The intro runs about 43 seconds, with the same gags at the same times in the four uploads checked (1972–1980). Beat by beat in intro.yaml.
  status: observed
  sources:
  - sfr-youtube
  - pl-wikipedia-reksio
  - babulewicz-2018
  observed_by: claude-frames
tone_and_mood:
  text: Warm, gentle, domestic. There is peril (gas in the kitchen, being lost, fantasy monsters in Reksio kosmonauta), but it resolves kindly and nobody is humiliated for long. Pace and mood are unhurried compared with American cartoons of the same era. Babulewicz's title — conjuring a "backyard atmosphere" — puts the feeling well. This summary is based on 3 sampled episodes plus secondary descriptions; watch more before relying on it.
  status: interpretation
  sources:
  - babulewicz-2018
  - en-wikipedia-reksio
  - sfr-youtube
humour:
  text: Visual and gestural — pantomime, exaggerated poses, stretch-and-squash gags in the title sequence, silly misunderstandings between animals, and pictogram thought bubbles (bones, a hammer) instead of speech. Babulewicz singles out the music's "masterful creation of humorous situations", so a lot of the comedy lives in the score and its timing, which frames cannot show.
  status: interpretation
  sources:
  - sfr-youtube
  - babulewicz-2018
themes_and_values:
- text: Helping and rescuing others is Reksio's defining trait — en-wikipedia calls him saviour, helper, rescuer and peacemaker. Titles such as Reksio ratownik (rescuer), wybawca (saviour), rozjemca (peacemaker), pocieszyciel (comforter), pielęgniarz (nurse) and terapeuta point the same way.
  status: verified
  sources:
  - en-wikipedia-reksio
  - pl-wikipedia-reksio
- text: Non-violence was there from the start. The series grew out of Marszałek's refusal to show children playing with guns in Bolek i Lolek's Wild West episodes.
  status: verified
  sources:
  - pl-wikipedia-reksio
  - dzieje-pl-sfr
- text: Loyalty and home. In the episodes sampled, stories begin and end at the doghouse, with the boy. In the final episode, Reksio i sowa, the owl persuades Reksio not to leave the yard.
  status: sourced
  sources:
  - en-wikipedia-reksio
- text: Curiosity about the world beyond home — seasons (Reksiowa jesień, wiosna, zima), jobs, sport, travel, space. Many episodes read as gentle "what would it be like to be…" explorations. This reading rests mostly on episode titles.
  status: interpretation
  sources:
  - pl-wikipedia-reksio
characters:
- id: reksio
  name: Reksio
  kind: dog (terrier)
  role: protagonist
  description:
    text: A small, friendly and brave piebald terrier. Modelled on Marszałek's female wire-haired fox terrier Trola, but male on screen. Never speaks in words.
    status: verified
    sources:
    - en-wikipedia-reksio
    - pl-wikipedia-reksio
    - dzieje-pl-sfr
  personality:
    text: Responsible, dutiful, loving and caring — and occasionally a little mischievous or short-tempered. Mostly he acts as helper, rescuer and peacemaker. en-wikipedia's profile is based on editors' viewing of episodes.
    status: sourced
    sources:
    - en-wikipedia-reksio
  visual_signature:
    text: White body with a clean black outline, round head, black nose, and warm brown-orange patches on one ear, around one eye and on his back. One ear flops over. He often stands and gestures on his hind legs like a small person, and his face is very expressive (wide grin, frown, eyes squeezed shut). Early films show him with a collar, dropped from Reksio marzyciel (1969) onward.
    status: observed
    sources:
    - sfr-youtube
    - pl-wikipedia-reksio
    observed_by: claude-frames
  sound_signature:
    text: Barks and yelps. The 2023 score release keeps the series' "characteristic barks" among its sound effects. What his bark actually sounds like — pitch, who performed it, whether it was a real dog — is unknown.
    status: sourced
    sources:
    - gad-records-reksio-2023
  relationships:
  - to: boy
    claim:
      text: The boy is his young owner and closest human. Reksio is devoted to him and, in Reksio wybawca (1977), saves him from gas poisoning in the kitchen.
      status: verified
      sources:
      - en-wikipedia-reksio
      - sfr-youtube
  - to: rooster
    claim:
      text: Occasional quarrels with the rooster in the main series.
      status: sourced
      sources:
