places:
- id: doghouse
  name: Buda (Reksio's doghouse)
  description:
    text: A small wooden doghouse with a round door and pitched roof, set against a stone or plastered wall of the family home. In the three episodes first sampled (Kosmonauta, Wybawca, Remontuje) the story comes home to it. Kosmonauta (1972), Czyścioch (1974) and Kompan (1976) open on it straight after the credits, with Reksio popping out; Remontuje (1980) opens on a street by a brick wall instead. The pop-out is part of each episode, not of the title sequence.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
- id: yard
  name: Podwórko (the yard)
  description:
    text: The shared space outside the house where Reksio, the hens, the rooster, the gander and neighbouring dogs meet. Described as a village farmyard (FilmPolski) or a courtyard (en-wikipedia).
    status: verified
    sources:
    - filmpolski-reksio
    - en-wikipedia-reksio
- id: family-home
  name: The family home
  description:
    text: Plain 1970s Polish domestic interiors in Reksio wybawca — terracotta and salmon walls, a hallway with coat hooks, a round table, a green-tiled kitchen with a gas cooker.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
- id: neighbourhood
  name: The neighbourhood street
  description:
    text: In Reksio remontuje (1980), a leafy street of detached houses with red roofs, fences and trees, painted in soft watercolour.
    status: observed
    sources:
