  - '#ffffff'
  line_and_shape:
    text: A uniform black outline of even weight on characters and props. Rounded, simplified forms; big heads and small bodies on humans; large flat colour areas with little or no shading on characters. Props (rocket, UFO, doghouse) are drawn with the same flat graphic clarity as the characters.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  backgrounds:
    text: |-
      Painted separately and much more textured than the characters, but the style varies by episode and era:
      - 1972 (Kosmonauta): expressive crayon/pastel and gouache textures — streaky skies, craggy fantasy caves in blue and ochre.
      - 1977 (Wybawca): interiors in flat fields of colour with minimal detail; exteriors with stippled stone walls.
      - 1980 (Remontuje): detailed, naturalistic watercolour street scenes; Halina Filek-Marszałek is credited for "Dekoracje".
      A recurring motif is the stone or plastered wall behind the doghouse.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  character_animation:
    text: 'Only poses can be judged from stills, not motion: strong readable silhouettes, very expressive faces, Reksio often upright and gesturing like a small person, and elastic squash-and-stretch in the title gags (Reksio stretched along a whole credit). How smoothly and how often things move (animating on ones or twos, holds, cycles) is unknown until someone watches for it.'
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  pacing:
    text: 'Automatic scene-cut detection (ffmpeg, threshold 0.3) gives average shot lengths of about 5.4 s (Kosmonauta, 1972), 2.4 s (Wybawca, 1977) and 4.9 s (Remontuje, 1980). Treat these as rough: gas-smoke and flash effects can register as cuts, which may inflate the 1977 count. The feeling of pace depends on music and holds as much as on cuts; that needs watching.'
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
  composition:
    text: Mostly eye-level, side-on, stage-like staging. Characters line up along a wall or ground line, like actors on a stage, with wide establishing shots and cut-in close-ups for emotion (Reksio worried in a rocket porthole, grinning in a UFO dome). Communication is pictorial — thought bubbles with pictograms (bones, a hammer) instead of words. The only readable text on screen in the samples is a calendar and the KONIEC card.
    status: observed
    sources:
    - sfr-youtube
    observed_by: claude-frames
sound:
  overview:
    text: Music and sound effects carry the storytelling, with little or no speech. Kowalowski's scores are described as melodically rich, brilliantly orchestrated and closely fitted to what happens on screen, "tailored to each episode's content".
    status: sourced
    sources:
    - babulewicz-2018
  credits:
  - name: Zenon Kowalowski
    role: composer (theme and nearly all episodes)
    claim:
      text: Born 1939; composer and teacher tied to Cieszyn, with music for over 150 films. He scored almost every episode — sources say "sixty-four", pl-wikipedia lists a handful of exceptions — and wrote the theme.
      status: verified
      sources:
      - babulewicz-2018
      - filmpolski-reksio
      - filmpolski-reksio-i-ptaki
      - pl-wikipedia-reksio
  - name: Tadeusz Kański, Adam Markiewicz, Bogumił Pasternak, Waldemar Kazanecki, Janusz Mentel
    role: composers (individual early episodes)
    claim:
      text: pl-wikipedia credits Kański (episodes 1–2 and 30), Markiewicz (5–6), Pasternak (3), Kazanecki (4) and Mentel (30). FilmPolski credits Kański and Mentel on one episode of the 1972–1982 serial (its no. 21). Episode numbers depend on which numbering is used.
      status: sourced
      sources:
      - pl-wikipedia-reksio
      - filmpolski-reksio
  - name: Otokar Balcy
    role: sound (dźwięk)
    claim:
      text: Credited for sound on Reksio kosmonauta (1972) and Reksio wybawca (1977).
      status: observed
      sources:
      - sfr-youtube
      observed_by: claude-frames
  theme:
    text: The opening theme is "one of the best-known fragments of Polish film music". In at least one episode it returns as a leitmotif for a mountain trek, perhaps Reksio taternik. What it sounds like — instruments, tempo, key, mood — has not yet been recorded here and needs listening. The 2023 album includes it with and without sound effects.
    status: sourced
    sources:
    - babulewicz-2018
    - gad-records-reksio-2023
  music_role:
    text: Music does the work that dialogue would. It sets the "backyard atmosphere", builds tension and times the gags. Style shifts with the story — a Baroque-concerto pastiche for museum scenes, electronic music for Reksio i UFO (1979). The final episode quotes a pop song, Sośnicka's "Uspokój się".
    status: verified
    sources:
    - babulewicz-2018
    - gad-records-reksio-2023
    - pl-wikipedia-reksio
  sound_effects:
    text: Characteristic barks and "stamping" sounds are part of the series' sound identity — prominent enough that the 2023 album keeps them. The full vocabulary of effects has not been recorded.
    status: sourced
    sources:
    - gad-records-reksio-2023
  dialogue:
    text: Essentially wordless. Characters communicate by barks, gesture, expression and pictogram bubbles; one language-learning blog says the show has "very little dialogue" with a few simple words. Whether any episode has spoken words or narration has not been checked by a listener. Frames show pictorial rather than written speech.
    status: sourced
    sources:
    - lingopie-polish-cartoons
    - sfr-youtube
legacy:
- text: Aidem Media (Gdańsk, later BoomBit) made a line of Reksio PC games from 2001 into the 2010s — educational titles (ABC z Reksiem, Liczę z Reksiem) and point-and-click adventures (Reksio i Skarb Piratów, Reksio i UFO, Reksio i Wehikuł Czasu, Reksio i Kapitan Nemo, Reksio i Czarodzieje, Reksio i Miasto Sekretów). They were exported to Central and Eastern Europe. These are prior art for a Reksio game, and evidence that game rights have been licensed before.
  status: verified
  sources:
  - en-wikipedia-reksio
  - pl-wikipedia-reksio
- text: Bronze statue by Marek Barteczko (2009) on a square between ul. 11 Listopada and ul. Stojałowskiego in Bielsko-Biała; Reksio points in surprise at the neighbouring fountain. Another bronze Reksio stands in Radomsko (2020), and a mural designed by Halina Filek-Marszałek went up in Suwałki, Marszałek's home town (2017).
  status: verified
  sources:
  - pl-wikipedia-reksio
  - en-wikipedia-reksio
  - bielsko-biala-tu-narodzil-sie-reksio
- text: Poczta Polska stamps (2016); Bielsko-Biała's local token currency "białki" (2009); "Reksio symfonicznie" in Katowice (2016), with an orchestra playing live to the films; the Puchar Reksia children's ski race in Szczyrk (from 2010); and the Fundacja im. Heleny i Lechosława Marszałków Reksio (2014), set up to look after Marszałek's and the studio's work.
  status: sourced
  sources:
  - pl-wikipedia-reksio
- text: Six episodes were digitally restored for the 2013 DVD "Klasyka Polskiej Bajki — Reksio". In 2023 GAD Records released Kowalowski's score from the studio's original tapes.
  status: sourced
  sources:
  - pl-wikipedia-reksio
  - gad-records-reksio-2023
- text: Reksio has cult status in Poland alongside Bolek and Lolek. Cross-references between the two series exist, for example Reksio watching Bolek and Lolek on TV.
  status: sourced
  sources:
  - en-wikipedia-reksio
availability:
- text: The studio's official YouTube channel hosts many episodes for free. A search on 2026-09-29 found 31, mostly 1967–1980; Reksio i ptaki episodes were not among the results.
  status: verified
  sources:
  - sfr-youtube
- text: TVP VOD has a Reksio series page. Episode count and whether it is free are unconfirmed.
  status: sourced
  sources:
  - tvp-vod-reksio
rights:
  text: Unknown. Likely candidates are Studio Filmów Rysunkowych (producer and archive holder, still operating and publishing the episodes) and possibly Marszałek's heirs or the Fundacja Reksio for the character. The Aidem Media games show the character has been licensed for games before. Must be resolved before any public release; parked for the private MVP.
  status: unknown
  sources: []
design_notes:
- text: Because the series is wordless, a game can be wordless too — reachable by a 3-year-old and by non-Polish families — and still be true to the original. Written words should be as rare as they are in the cartoon (a title, "KONIEC").
  status: interpretation
  sources: []
- text: Pictogram thought bubbles are a native way to show what a character wants or needs without text. They could carry all in-game "dialogue" and hints.
  status: interpretation
  sources: []
- text: The doghouse works as a home base, since every sampled episode starts and ends there. A finite game session could do the same — begin by calling Reksio out of the buda and end with him back home, followed by a KONIEC card.
  status: interpretation
  sources: []
- text: Helping is the verb. The series' titles and character profile point to mechanics built around noticing a problem and helping or calming someone, not winning, collecting or scoring.
  status: interpretation
  sources: []
- text: Keep the visual contrast — flat, outlined characters (feasible as SVG/vector) over textured, painted backgrounds (feasible as a few static painted plates). Restraint in motion and palette is more faithful than busy effects.
  status: interpretation
  sources: []
- text: The title sequence is a ready-made model for a gentle game intro. Reksio's small gags around each credit show the character's playfulness in about 40 seconds with no words.
  status: interpretation
  sources: []
open_questions:
- What does the opening theme sound like — instruments, tempo, mood? Needs Adam's ears; the GAD Records album is a clean reference.
- Is any episode genuinely spoken or narrated, or is it barks and music throughout? Needs a listener across several episodes.
- Does the boy have a name? Is the family ever named?
- Which recurring animals appear most (hens, rooster, cats, the red-eared dog)? Needs a pass over more episodes.
- How much of the humour is timed to music, and how? Read Babulewicz 2018 in full.
- When exactly did Reksio run in the Dobranocka slot, and how often was it repeated?
- Where does the "Złoty Słowik"/Grand Prix Tehran prize for Reksio poliglota come from, and what year was it?
- Who holds the rights to the character and the films today (SFR, Marszałek's heirs, Fundacja Reksio)?
- Get the Filek-Marszałek/Kolska memoir (2022) — the closest thing to a primary account of how Reksio was made.
