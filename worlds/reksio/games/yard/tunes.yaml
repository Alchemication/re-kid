    prompt: 'A short morning tune, rising and waking up: a flute melody climbing over slow harp chords, sunny and calm, ending on a bright glockenspiel note. Instrumental only. A small chamber ensemble from a 1970s Eastern European children''s animated film: pizzicato strings, clarinet, bassoon, flute, harp, xylophone and glockenspiel. Warm vintage tape sound, gentle and light. No drums, no synthesizers, no modern pop production.'
