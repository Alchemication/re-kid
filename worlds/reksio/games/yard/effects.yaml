# Recorded sound effects for the yard (schema.effects.EffectSet), packed into
# game/effects.js by `main.py effects`. Each sound plays one of its takes at
# random (a steady one, its one take always as it is), in place of the synthesised
# sound of the same name in sound.js.
# The takes are in effects/, as they were made.
source: 'Made with ElevenLabs sound effects (text to sound, Starter plan, which allows commercial use) and picked by ear by Adam on the sound board (experiments/sound), 2026-10-12.'
effects:
- id: boing
  takes:
  - file: boing/19.mp3
    prompt: 'a cartoon boing, a springy twang of a stretched rubber band snapping back, in the style of the Polish cartoon Reksio (1970s)'
  - file: boing/30.mp3
    prompt: 'a short wobbly jaw harp twang, cartoon slapstick'
  - file: boing/31.mp3
    prompt: 'a short wobbly jaw harp twang, cartoon slapstick'
  - file: boing/32.mp3
    prompt: 'comic spring boing sound effect, bouncy and playful, children''s cartoon'
