id: yard
title: Reksio's yard (working title)
status: draft
audience: Eliot, about 3, playing with a parent who remembers Reksio.
length: As long as he likes, usually a few minutes; it ends with evening.

pitch:
  text: The child is Reksio in his own yard, which is wider than the screen; the view follows him from the house wall at one end to the fence and gate at the other. Tap anywhere and Reksio trots there; tap a thing and he goes over and does something with it — naps and snores in his doghouse, laps from his bowl, drinks from the tap, sniffs the flowers and sneezes, barks at the bird, digs up a bone, stamps a film strip. Once he has done this play's four main things, evening comes and he goes to sleep in his doghouse.
  origin: inspired
  refs: ['world:places[yard].description', 'world:places[doghouse].description', world:premise]

principles:
- text: No text anywhere. Everything is shown, never written, so a child who can't read misses nothing.
  origin: inspired
  refs: [world:sound.dialogue]
- text: The child is Reksio, and every tap gets an answer. Nothing to get wrong, no score, no timer.
  origin: invented
- text: Inspired, not copied. Drawings, sounds and music are new and made for the game; original sounds only now and then, as easter eggs. One exception, for now — the bark.
  origin: invented
- text: Finite, and you can see the end coming. The sun sinks and the sky warms as the main things are done; after the last, evening falls and the game ends with him asleep. No counter, no text.
  origin: inspired
  refs: ['world:places[doghouse].description']
- text: The yard is built to grow. Later it becomes the game's home screen, and new things in it lead into episode games — say, a toy rocket by the doghouse that starts Kosmonauta.
  origin: invented

- text: When left alone, Reksio shows what he still wants in a thought bubble — a picture of his bowl, a drop of water, a bone, the bird, his doghouse, the film strip, the mouse, the tree or the blackberries, the nearest one he hasn't done — and that thing twinkles. Only this play's main things ever appear, so it's clear which ones count; the flowers, window and gate are extras.
  origin: inspired
  refs: [world:humour]
- text: Tapping a creature sends Reksio after it in his own way — he stalks and pounces on the fly, sniffs the bee and jumps back, looks up at the web and gets a fright when the spider drops onto his nose.
  origin: invented
- text: He moves like a dog. Short trips are a walk, long ones a bounding run, easing in and out of speed; he hops for joy after each main thing. Left alone, he keeps busy every few seconds with something picked at random and a little different each time — sniffing, wandering with his nose down, glancing around, looking up at the sky or the bird, scratching, hopping, a play-bow, chasing or biting his tail, sitting, howling, yawning, watching the fly and pouncing on it — with a thought bubble now and then.
  origin: invented
- text: It is always clear what can be tapped and what is left. Every usable thing has an action spot — a wide, faint oval on the ground — that glows when Reksio stands in it; tapping the spot works like tapping the thing, and it is a big, low target for small fingers (the bird's spot is on the ground under its perch). A main thing's spot is bright until it is done, then faint like the extras'; nothing floats over the things themselves, to keep the picture clean. A row of pictures in the corner fills in as each main thing is done, and tapping a picture sends Reksio there.
  origin: invented
- text: Not everything at once. Each play counts the doghouse and three of the other eight main things, brings two of the creatures, and only sometimes the flowers; the bowl, mound, film strip, mouse trap, tree and bramble appear only when they count. The doghouse stays by the house and the gate at the far end, so the child always knows where home and the way out are; everything between comes in a new order each play, with wide, uneven gaps and nothing overlapping, so each play is a small new walk to explore. Puddles and the bird's perches fall in the open stretches. The last play is remembered so the next one prefers what wasn't seen.
  origin: invented
- text: The yard is quietly alive. Small creatures go about their own business and meet each other — a fly wanders, lands on the bowl and dodges Reksio's snaps; a bumblebee works the flowers and huffs off if he comes close; a spider builds a web in the corner by the house, dangles on its swinging thread, catches the fly and wraps it, and hides when Reksio barks. Cartoon physics (momentum, pendulums, startled darts), small and mostly quiet, never in the way.
  origin: invented
- text: Most plays bring a shower, and each step of it is something a toddler can watch cause the next. Clouds roll in and the yard dims; rain falls, Reksio snaps at drops and shakes himself off, puddles form and ring where drops land, and he splashes through them. Then the clouds drift off, a rainbow shows for a while, the flowers grow a little taller, a snail comes out and leaves a shiny trail (and pulls into its shell if he sniffs it), worms come up by the puddles, and the bird may hop down and catch one. The puddles dry, and the music goes quieter while it rains.
  origin: invented
- text: Doing a thing again does the same thing again — small children love exact repetition — and the second time, then about every other time after, something small is added on top. Asleep in the doghouse he dreams of a bone, paws twitching; the empty bowl gets licked clean and nosed along; the tap sprays sideways and soaks him; a second, bigger sneeze blows him back from the flowers; the mound needs digging twice before the bone turns up; the film reel rolls off and he chases it back; the mouse brings him a crumb, or a baby mouse comes out too.
  origin: invented
controls:
  text: 'Tap or click: on the ground, Reksio walks there; on a thing, he walks over and uses it; on Reksio himself, a quick tap barks and pressing and holding stretches him. Keyboard for the grown-up or an older child: arrows walk, space uses whatever is nearest, any other key barks (hold it to stretch).'
  origin: invented

look:
- text: Reksio is small in the yard, about a fifth of the screen high, seen from the side — a big rounded head flowing into a long, deep muzzle, a small eye high up, an ochre ear folded forward, a deep chest, a short body with an ochre patch near the rear, a stub tail and column legs. Drawn in code, never traced.
  origin: inspired
  refs: ['world:characters[reksio].visual_signature']
- text: Sponge-painted, mottled backgrounds like the series' — an orange sky, a grey-green stone wall, a speckled sandy ground — with flat, outlined things in front of them.
  origin: inspired
  refs: [world:aesthetics.backgrounds, world:aesthetics.overview]
- text: Solid things stay still. Only what would really move does — flowers and grass in a light breeze, the bird, the curtain, the gate when it is touched.
  origin: invented

sound:
- text: "Every action has its own new, gentle sound, made in the browser: a bark, pattering steps, lapping, snoring, a running tap, a sneeze, a bird's chirp, digging."
  origin: invented
- text: A light pizzicato "oom-pah" in B-flat runs under the yard, in the spirit of the Reksio theme — its key, its bouncing bass, and a clarinet hook echoing the main melody Adam marked (B-flat, B-flat, B-flat C B-flat C, D F, F, from a machine transcription he has not yet confirmed by ear). Played note by note from real instrument samples (CC0), so it can follow the game.
  origin: inspired
  refs: [mark:main-melody-part-1, world:sound.theme]
- text: The music follows Reksio. It is fuller when the child is playing and thins to a bare bass line when left alone; actions play along in key and on the beat — a xylophone flourish for each main thing, glockenspiel for a thought bubble, a flute trill for the bird, timpani under each stamp, a rising bassoon as he stretches and a falling run (the shape of the marked stretching melody) as he snaps back.
  origin: inspired
  refs: [mark:stretching-melody, world:sound.music_role]
- text: Three tunes take turns over the oom-pah so it doesn't wear thin — the hook twice, a skipping flute tune twice, the hook again, then a tiptoeing tune in G minor that climbs back home to B-flat. The two new tunes are written for the game in the same bouncy spirit, not taken from the original.
  origin: invented
- text: A quiet wind is always there, changing like real wind — mostly a light breeze that comes and goes, now and then a gust, stronger when the clouds come, dropping at evening. The grass and flowers lean further in a gust, so the child can see what they hear. Rain is a soft hush under everything.
  origin: invented
- text: Reksio barks with the original barks from the intro, played a little higher and quicker by a random amount each time, so he sounds like himself but never twice the same. (A private-play choice, to be replaced before any public release.)
  origin: original
  refs: [mark:bark]
- text: Reksio stands in a puddle with his paws in the water, and walking through one leaves his legs muddy for a while. Rain, a jump into a puddle, or splashing through plenty of water soaks him — fur a touch darker, drops dripping — and as soon as he stops out of the rain he gives a proper wet-dog shake from nose to tail, spraying drops everywhere. One step through a small puddle doesn't soak him, so he doesn't shake for it.
  origin: invented
- text: The fly and the bumblebee are visitors, not residents. Each turns up a while into the play, stays a while, flies off, and may come back later; both stay away while it rains.
  origin: invented
- text: Creatures sound like what they are, quietly, and fade with distance from Reksio — flies whine now and then and bees hum, the bird chirps, the mouse squeaks. Spiders, snails and worms are silent, except for small cartoon noises when they do something (a plink as the spider drops, a schlup as the snail hides, a pop as a worm comes up).
  origin: invented
- text: Each sunset step slows the music a little and makes it softer; at evening it gives way to a harp lullaby built on the same hook, slowed right down.
  origin: invented

scenes:
- id: doghouse
  action: {text: Tap the doghouse., origin: invented}
  result:
    text: Reksio trots in through the round door and falls asleep in the doorway, head resting on his front paws, eyes shut, little Zs rising; after a few snores he yawns and comes back out.
    origin: inspired
    refs: ['world:places[doghouse].description']
  sound: {text: 'A soft wooden knock, slow snoring, a yawn.', origin: invented}
- id: bowl
  moment: bowl
  action: {text: Tap the bowl., origin: invented}
  result:
    text: Reksio laps from his bowl like a real dog — quick little dips with his tongue, bits flying — then licks his lips.
    origin: inspired
    refs: [intro:bowl]
  sound:
    text: A rhythm of wet laps and a big slurp.
    origin: inspired
    refs: [intro:bowl]
- id: tap
  action: {text: Tap the water tap., origin: invented}
  result:
    text: Water runs from the tap on the wall; Reksio drinks, gets splashed, and shakes himself dry in a spray of drops.
    origin: inspired
    refs: ['world:places[yard].description']
  sound: {text: 'A squeaky tap, running water, a shake.', origin: invented}
- id: stretch
  moment: stretch
  action: {text: Press and hold on Reksio., origin: invented}
  result:
    text: Reksio stretches longer and longer like a dachshund, his front half walking forward while his back stays put, for as long as the press lasts; let go and he snaps back with a springy wobble.
    origin: inspired
    refs: [intro:stretch, mark:stretching-melody]
  sound:
    text: A rising, rubbery stretching sound while held, and a cartoon boing on release.
    origin: inspired
    refs: [intro:stretch]
- id: film
  moment: studio-card
  action: {text: Tap the red film strip lying in the yard., origin: invented}
  result:
    text: Reksio rears up and stamps each of the five empty frames with his front paws, and a little Reksio appears in each one; the full strip rolls up into a film reel that stays in the yard — later, the door into episodes.
    origin: inspired
    refs: [intro:studio-card, mark:stamping-sound-1-longer]
  sound:
    text: 'Thump, thump … double squeak: a thud with a wooden tok for each stamp, alternating dull and bright, then two rubbery squeaks as the little Reksios squash and stretch, then the rattle of the reel winding up.'
    origin: inspired
    refs: [mark:stamping-sound-1-longer, mark:stamping-sound-2-short]
- id: flowers
  action: {text: Tap the flowers., origin: invented}
  result:
    text: Reksio sniffs the flowers, then sneezes, and petals fly.
    origin: invented
  sound: {text: 'Sniffs, then a sneeze.', origin: invented}
- id: house
  action: {text: Tap the house window., origin: invented}
  result:
    text: At the left end of the yard, Reksio barks up at the window and the curtain stirs.
    origin: inspired
    refs: ['world:places[family-home].description']
  sound: {text: 'A bark, a rustle of curtain.', origin: invented}
- id: gate
  action: {text: Tap the gate., origin: invented}
  result:
    text: At the right end of the yard, Reksio pokes his nose at the gate and barks; the gate rattles. Later, the gate is where episodes open from.
    origin: invented
  sound: {text: 'A rattle and a bark.', origin: invented}
- id: bird
  action: {text: Tap the bird on the wall., origin: invented}
  result:
    text: Reksio barks at the bird; it flutters up, circles, and lands somewhere else in the yard.
    origin: invented
  sound: {text: 'A bark, a chirp and a flutter.', origin: invented}
- id: dig
  action: {text: Tap the mound of earth., origin: invented}
  result:
    text: Reksio digs, earth flying, and finds a bone, which he proudly holds up.
    origin: invented
  sound: {text: Scratchy digging and a bright "found it" ding., origin: invented}
  easter_egg:
    text: When he finds the bone he gives his original quick barks.
    origin: original
    refs: [mark:bark]
- id: trap
  action: {text: 'Once the mouse has come out, tap the mouse trap (or the mouse).', origin: invented}
  result:
    text: In some plays a mouse trap baited with cheese stands by a mouse hole at the foot of the wall. After a while a mouse comes out, creeps up to the cheese, flinches back from the trap, and squeaks at Reksio. He stamps the ground beside the trap; it snaps shut on nothing and flings the cheese to her. She eats it, cheeks bulging, sends him a heart, and goes home, and he noses the sprung trap away. Later, sniffing at her hole brings her out to touch noses. Nobody gets hurt and nothing is caught; the trap is the problem, not the mouse.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Tiny squeaks, a stamp, the crack and twang of the trap, nibbling.', origin: invented}
- id: tree
  action: {text: 'Once someone hungry is waiting under it, tap the fruit tree.', origin: invented}
  result:
    text: In some plays a tree by the wall hangs with apples, plums or hazelnuts. A while in, someone hungry turns up at its foot and looks up at fruit it can't reach — a snail for apples or plums, a squirrel for nuts. Reksio rears up against the trunk and shakes it three times; leaves fly and fruit drops. The snail creeps to it and slowly eats it, and over the next minute more snails come to share. The squirrel eats one nut, buries another, and runs off up the trunk. Shaking again drops more, and once an apple lands on Reksio's head and he sits down, dazed.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Rustling leaves, a plop or a tock as fruit lands, quiet nibbling, a squirrel''s chitter, a bonk.', origin: invented}
- id: berries
  action: {text: Tap the blackberry bramble., origin: invented}
  result:
    text: Reksio sniffs the bramble, nips off a blackberry, flicks it high into the air with his head, jumps, catches it in his mouth, chews, and licks his lips. Doing it again, he sometimes misses — it sails over his head, and he spins round and gobbles it off the ground.
    origin: invented
  sound: {text: 'A snap, a rising whoosh, a snap as he catches it, munching.', origin: invented}

ending:
  text: Once Reksio has done this play's main things, the sky turns to evening, he trots into his doghouse, and the picture closes in a circle on the doghouse, like the end of an episode.
  origin: inspired
  refs: ['world:places[doghouse].description', intro:fade-out]

parent_card:
  text: 'Not in this proof of concept. Later: a few sentences on who Reksio is and a link to the studio''s official episodes.'
  origin: inspired
  refs: ['world:availability[0]']

open_questions:
- Do the things need a gentle wiggle now and then to invite a tap, or does Eliot find them on his own?
- Should the boy, the hens or the rooster appear in the yard? The dossier's notes on them come only from en-wikipedia so far.
- How does a door into an episode look and feel, once there is an episode to enter?
