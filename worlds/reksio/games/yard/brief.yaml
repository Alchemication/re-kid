id: yard
title: Reksio's yard (working title)
status: draft
audience: Eliot, about 3, playing with a parent who remembers Reksio.
length: One day, 08:00 to 20:00 on the yard's clock, in five minutes of play; it ends when he goes to bed.

pitch:
  text: The child is Reksio in his own yard, which is wider than the screen; the view follows him from the house wall at one end to the fence and gate at the other. Tap anywhere and Reksio trots there; tap a thing and he goes over and does something with it — naps and snores in his doghouse, laps from his bowl, drinks from the tap, sniffs the flowers and sneezes, barks at the bird, digs up a bone, stamps a film strip. The day passes on its own — the sun crosses the sky whatever he does. When it has set, the moon comes up, and then he goes to sleep in his doghouse.
  origin: inspired
  refs: ['world:places[yard].description', 'world:places[doghouse].description', world:premise]

principles:
- text: No text anywhere. Everything is shown, never written, so a child who can't read misses nothing.
  origin: inspired
  refs: [world:sound.dialogue]
- text: The child is Reksio, and every tap gets an answer. Nothing to get wrong, no score, no timer.
  origin: invented
- text: Inspired, not copied. Drawings, sounds and music are new and made for the game; original sounds only now and then, as easter eggs. One exception, for now — the bark.
  origin: invented
- text: Nothing is a goal, and the end never comes as a surprise. The day is the same length whatever the child does — a child who watches the snail all day gets as long as one who tries everything. The sun comes up over the wall in the morning, climbs, and goes down through the afternoon as the sky warms, setting at 19:00 on the day's clock (five minutes of play from 08:00 to 20:00). From 18:00 he yawns more; at sunset the fly and the bee go home, but nothing is taken away — the yard stays open while the moon comes up through the last hour. At 20:00 the cuckoo calls eight slow times and supper is set out, steaming (in his own bowl if it is out this play, else in a dish by the doghouse); he eats it up and licks his chops, as Reksio kosmonauta ends. Then the doghouse twinkles and he wishes for it. A tap sends him in, or he goes by himself a little later, and the picture closes. After that a tap does nothing. No goals, no counter, no text.
  origin: inspired
  refs: ['world:places[doghouse].description']
- text: The yard is the game, and it grows deeper rather than leading anywhere — more to see and do in the same place, not doors into episode games.
  origin: invented

- text: When left alone, Reksio shows what he still wants in a thought bubble — a picture of his bowl, a drop of water, a bone, the bird, his doghouse, the film strip, the mouse, the tree or the blackberries, the nearest one out this play that he hasn't done — and that thing twinkles. It is a suggestion, never a task. At dusk he wishes only for his doghouse.
  origin: inspired
  refs: [world:humour]
- text: Tapping a creature sends Reksio after it in his own way — he stalks and pounces on the fly, sniffs the bee and jumps back, looks up at the web and gets a fright when the spider drops onto his nose.
  origin: invented
- text: He moves like a dog. Short trips are a walk, long ones a bounding run, easing in and out of speed; he hops for joy after each new thing, and yawns a lot at dusk. Left alone, he keeps busy every few seconds with something picked at random and a little different each time — sniffing, wandering with his nose down, glancing around, looking up at the sky or the bird, scratching, hopping, a play-bow, chasing or biting his tail, sitting, howling, yawning, watching the fly and pouncing on it — with a thought bubble now and then.
  origin: invented
- text: The longer he is left alone, the more he rests, like a dog. After a little while he may sit and quietly watch the yard, looking about; later lie down, head up; later still take a nap — head on his paws, curled up, or sprawled out — with soft snores and drifting Zs. He wakes with a proper dog stretch, front legs reaching forward and rump up, then the back legs, then a shake. Any tap and he's up at once.
  origin: invented
- text: It is always clear what can be tapped. Every usable thing has an action spot — a wide, faint oval on the ground — that glows when Reksio stands in it; tapping the spot works like tapping the thing, and it is a big, low target for small fingers (the bird's spot is on the ground under its perch). Every spot looks the same, done or not; nothing floats over the things themselves or sits in a corner, to keep the picture clean.
  origin: invented
- text: Not everything at once. Each play has the doghouse, the house with its cuckoo clock, the tap, the bird and the gate, puts out three of seven props (the bowl, mound, film strip, mouse trap, tree, bramble and the hen's nest), always with someone he can help (the trap, tree or hen) and a chance for someone to help him (the bowl or the bramble), brings two of the creatures, and only sometimes the flowers. That is eight or nine things, more than one day takes, so the child never runs out. The sun stands somewhere new each play. The doghouse stays by the house and the gate at the far end, so the child always knows where home and the way out are; everything between comes in a new order each play, with wide, uneven gaps and nothing overlapping, so each play is a small new walk to explore. Puddles and the bird's perches fall in the open stretches. The last play is remembered so the next one prefers what wasn't seen.
  origin: invented
- text: The yard is quietly alive. Small creatures go about their own business and meet each other — a fly wanders, lands on the bowl and dodges Reksio's snaps; a bumblebee works the flowers and huffs off if he comes close; a spider builds a web in the corner by the house, dangles on its swinging thread, catches the fly and wraps it, and hides when Reksio barks. Cartoon physics (momentum, pendulums, startled darts), small and mostly quiet, never in the way.
  origin: invented
- text: Most plays bring a shower, and each step of it is something a toddler can watch cause the next. Clouds roll in and the yard dims; rain falls, Reksio snaps at drops and shakes himself off, puddles form and ring where drops land, and he splashes through them. Then the clouds drift off, a rainbow shows for a while, the flowers grow a little taller, a snail comes out and leaves a shiny trail (and pulls into its shell if he sniffs it), worms come up by the puddles, and the bird may hop down and catch one. The puddles dry, and the music goes quieter while it rains.
  origin: invented
- text: Some plays the yard wakes in fog (Adam's pick, 2026-10-26). A pale wash lies over the yard's things, the house, the doghouse, the flowers, the tap, with mist lying low over the ground, while Reksio stays clear in front of it; left alone he sniffs his way along, nose down, and stops to look about. The light is dimmer, and the fly and the bee keep closer. It starts to lift mid-morning and is gone before half past ten. Painted after the pale washes of mist round the crags in Reksio taternik (4:00-4:40); fog itself is not from the films.
  origin: invented
- text: One play in four is winter (Adam's pick, 2026-10-26). The yard lies under snow, the wall and the doghouse roof capped with it, the sun pale, the grass tufts dry; there are no flowers, no fly, bee or spider, no fruit tree or bramble. The shower falls as snow, big soft flakes drifting and blown by the wind; the puddles are ice, with nothing to splash in, and he stays white and dry; what he snaps at and shakes off is snow. No rainbow after it, no mushrooms, no snail. After the sourced synopses of Reksiowa zima and Reksio łyżwiarz (1981), which are not public to watch; the snow painted after Reksio taternik's snowfields.
  origin: inspired
  refs: ['episode:reksiowa-zima', 'episode:reksio-lyzwiarz', 'world:aesthetics.backgrounds']
- text: In a winter play a little flock of sparrows comes now and then to peck at Reksio's bowl, the ground being under snow. A bark or a snap near them, or his nose close, and up they burst, and back once it's quiet; a tap on one sends them all up, and he looks up after them. Left alone, now and then he notices them and goes to guard his bowl. Up they flutter; he looks about and turns to go, and the moment his back is turned they are down at it again. Round he turns, and up they go. After two or three times he gives in, with an aww, steps back, sits and watches them eat. He never chases them. After Reksiowa zima, where birds try to feed from his bowl; the sparrows and his guarding are ours.
  origin: inspired
  refs: ['episode:reksiowa-zima', world:premise]
- text: 'In a winter play the boy comes out to make a snowman, some way into the morning, from behind the house, on its own ground first out from the house. He pushes a big ball along until it is as big as it gets, rolls a middle one and lifts it on, pats a head together in his hands and heaves it up on top; left alone, Reksio runs over to him and sits to watch. Then the boy calls Reksio, leaning to him and patting his knees, and stands by it at a loss, scratching his curls and shaking his head. Each tap on the snowman, or on him, and Reksio runs for the next piece: stones dug out of the snow for its eyes, a stick that the boy snaps over his knee for two arms, in an order of the play''s own. Left alone a while, Reksio goes for the next one himself. Then the boy touches his own nose: a nose! At the next tap Reksio brings his bone from his doghouse; the boy puts it in, steps back, looks, and laughs, tosses the bone back by the doghouse, goes in and comes out with a carrot. Last he takes off his own cap and puts it on the snowman, his curls springing up, and cheers, and stays out with it until dusk. A tap on the finished snowman brings something around it, a different thing each time. Snowballs. the boy pats one up in his hands and lobs it over the snowman, and Reksio snaps it out of the air and it bursts on his nose, so he goes cross-eyed, shakes, and bows for another. Once or twice, and then a throw goes flat, straight into the snowman''s head, which flies off and breaks in the snow. Both freeze and look at each other; the boy laughs, gathers it up, pats a new head together and puts back its eyes, its carrot and his cap, while Reksio sits and watches. An accident in a game they play together, never Reksio wrecking it (Adam, 2026-10-27). The boy is drawn after the films (Kompan); his winter clothes, a knitted red cap, a scarf, a blue coat and mittens, are ours, as no winter frames of him are public. The snowman, the bone for a nose, the cap and the snowballs are ours.'
  origin: invented
  refs: ['episode:reksiowa-zima', 'world:characters[boy].visual_signature', 'world:characters[boy].description']
- text: Doing a thing again does the same thing again — small children love exact repetition — and something small is added on top. For every thing but the bowl and the cuckoo clock, a different one every time after the first, all of them before any comes again; theirs the second time and then about every other time after. The bramble's first is always his tail caught, when it can be. Asleep in the doghouse, every nap after the first has something on top, a different one each time until all have come. He dreams of a bone, paws twitching; a fly whines past and his ears twitch up one after the other; he dreams of supper, smiling and licking his chops; or he woofs in his sleep, ears up, paws paddling. The empty bowl gets licked clean and nosed along, or stuck on his head (below); the tap sprays sideways and soaks him, or only drips (he waits under it, head back, mouth open, and the drop lands on his nose), or gives him the hiccups; a second, bigger sneeze blows him back from the flowers, or a petal lands on his nose, he goes cross-eyed and blows it off onto his head; at the gate a bigger dog barks back from the other side (he jumps back, then puffs himself up and barks bigger), or he digs at the ground under it, tugs a picket in his teeth, or leaps up to peek over it; the bird he barks at, he tries to fly after, ears flapping, and lands on his bottom, or it lands on his head instead and pecks it; the mound needs digging twice before the bone turns up, or an old boot comes up first and is flung over his shoulder, or a molehill pops up beside him and then behind him and he pounces too late; the bone gets buried after a sly look round, or with the bird watching from the wall, and he pats the earth down extra hard; the film reel rolls off and he chases it back, or he unrolls it and the little Reksios hop up one after another, or one frame has come out blank and he stamps it again, harder, and two appear in it; one fruit won't fall until he gives up and turns away, then drops behind him, or an apple or plum lands on his head, or the squirrel runs up and drops him a nut to catch, which he puts down for her, or leaves land on his head; a tossed blackberry sails over his head, or he catches two, or flicks one up to the bird, or his tongue comes out purple, or his tail gets caught in the bramble (below); the mouse brings him a crumb, or a baby mouse comes out too, or she plays hide and seek from her other hole, or rides on his head.
  origin: invented
controls:
  text: 'Tap or click: on the ground, Reksio walks there; on a thing, he walks over and uses it, and if there is nothing to do there yet he sniffs round and looks about; on a puddle, he runs over and jumps in; on a creature, he goes to see it. Small creatures answer to a tap a finger''s width off; on Reksio himself, a quick tap barks and pressing and holding stretches him. With a mouse, a thing under the pointer glows softly round its outline and Reksio turns to it, an ear up, so the child sees what can be clicked; the hand cursor shows only over what answers a click. Keyboard for the grown-up or an older child: arrows walk, space uses whatever is nearest, any other key barks (hold it to stretch).'
  origin: invented

look:
- text: Reksio is small in the yard, about a fifth of the screen high, seen from the side — a big rounded head flowing into a long, deep muzzle, a small eye high up, an ochre ear folded forward, a deep chest, a short body with an ochre patch near the rear, a stub tail and column legs. Drawn in code, never traced.
  origin: inspired
  refs: ['world:characters[reksio].visual_signature']
- text: Sponge-painted, mottled backgrounds like the series' — an orange sky, a grey-green stone wall, a speckled sandy ground — with flat, outlined things in front of them.
  origin: inspired
  refs: [world:aesthetics.backgrounds, world:aesthetics.overview]
- text: Solid things stay still. Only what would really move does — flowers and grass in a light breeze, the bird, the curtain, the gate when it is touched.
  origin: invented

sound:
- text: "Every action has its own new, gentle sound, made in the browser: a bark, pattering steps, lapping, snoring, a running tap, a sneeze, a bird's chirp, digging."
  origin: invented
- text: The music is short tunes made for the game in the spirit of 1970s Eastern European children's cartoons — catchy, very simple, humorous, played by a small acoustic band — generated (ElevenLabs Music) and picked by ear, then given the same old-film sound as the effects. Our own tunes; nothing is taken from the original.
  origin: inspired
  refs: [world:sound.music_role]
- text: The music follows the child, with quiet in between. A morning tune as he wakes; through the day, a short tune after something is done (at most every 25 seconds, counting the morning tune, never in the rain), and one anyway after 50 seconds of quiet as he potters about alone, so the yard's own sounds come between tunes instead of a loop; a lullaby once supper is eaten and the cuckoo has called eight. Between tunes, actions play along on real instruments (CC0 samples) — a xylophone flourish for each new thing, glockenspiel for a thought bubble, a flute trill for the bird, timpani under each stamp, a rising bassoon as he stretches and a falling run (the shape of the marked stretching melody) as he snaps back.
  origin: inspired
  refs: [mark:stretching-melody, world:sound.music_role]
- text: Under everything, a quiet music bed made from the same instruments, a few notes at a time with no tune to hum, different for each moment of the day (a music box in the morning, a tiptoe walk while the child plays, a xylophone patter in the afternoon, a bassoon and flute chatting at dusk, drips in the rain, almost nothing for a nap). It steps back under a tune and stops for the lullaby. What the yard's music should be, and what Adam has said of it, is in worlds/reksio/MUSIC_DIRECTION.md.
  origin: invented
  refs: [world:sound.music_role]
- text: Each day looks a little different. It may be clear, fair with a few small clouds drifting across, cloudy with a softer sun and a grey haze, or golden with warmer light all day; and the sun comes up and goes down a little further left or right. The shape of the day stays the same.
  origin: invented
- text: A quiet wind is always there, changing like real wind — mostly a light breeze that comes and goes, now and then a gust, stronger when the clouds come, dropping at evening. The grass and flowers lean further in a gust, so the child can see what they hear. Rain is a soft hush under everything.
  origin: invented
- text: Reksio barks with the original barks from the intro, played a little higher and quicker by a random amount each time, so he sounds like himself but never twice the same. (A private-play choice, to be replaced before any public release.)
  origin: original
  refs: [mark:bark]
- text: Reksio stands in a puddle with his paws in the water, and walking through one leaves his legs muddy for a while. Rain, a jump into a puddle, or splashing through plenty of water soaks him — fur a touch darker, drops dripping — and as soon as he stops out of the rain he gives a proper wet-dog shake from nose to tail, spraying drops everywhere. One step through a small puddle doesn't soak him, so he doesn't shake for it.
  origin: invented
- text: The fly and the bumblebee are visitors, not residents. Each turns up a while into the play, stays a while, flies off, and may come back later; both stay away while it rains.
  origin: invented
- text: Creatures sound like what they are, quietly, and fade with distance from Reksio — flies whine now and then and bees hum, the bird chirps, the mouse squeaks. Spiders, snails and worms are silent, except for small cartoon noises when they do something (a plink as the spider drops, a schlup as the snail hides, a pop as a worm comes up).
  origin: invented
- text: Through the afternoon, as the sun goes down, the music gets softer.
  origin: invented

scenes:
- id: doghouse
  action: {text: Tap the doghouse., origin: invented}
  result:
    text: Reksio trots in through the round door and falls asleep in the doorway, head over his front paws on the sill, eyes shut, little Zs rising; after a few snores he yawns and comes back out. The same sleeping Reksio is there each morning before he wakes, and at bedtime, smiling, as the picture closes.
    origin: inspired
    refs: ['world:places[doghouse].description']
  sound: {text: 'A soft wooden knock, slow snoring, a yawn.', origin: invented}
- id: bowl
  moment: bowl
  action: {text: Tap the bowl., origin: invented}
  result:
    text: Reksio laps from his bowl like a real dog — quick little dips with his tongue, bits flying — then licks his lips. The first time he licks it empty, he pushes his nose right in and the bowl sticks on his head, over his eyes. If the child never taps the bowl twice, he does it on his own. The first time he is left alone a while (eight seconds, at least half a minute into the play), he goes back for the last bits, licks the bottom, and gets stuck. He freezes, shakes his head (the bowl clangs), takes a few blind steps the wrong way, and sits down glum, his frown showing under the rim. After a few seconds the bird comes by itself; a tap makes him bark inside the bowl, a muffled boom, and brings the bird at once. It lands on the bowl, pecks it, tugs twice and fails, and on the third tug the bowl pops off and spins back to its place while the bird tumbles backwards onto the ground. Reksio is delighted, play-bows to the bird, and gives the bowl a suspicious look. Every other empty bowl after that sticks again; the ones between are nosed along.
    origin: inspired
    refs: [intro:bowl]
  sound:
    text: A rhythm of wet laps and a big slurp.
    origin: inspired
    refs: [intro:bowl]
- id: tap
  action: {text: Tap the water tap., origin: invented}
  result:
    text: Water runs from the tap on the wall; Reksio drinks, gets splashed, and shakes himself dry in a spray of drops.
    origin: inspired
    refs: ['world:places[yard].description']
  sound: {text: 'A squeaky tap, running water, a shake.', origin: invented}
- id: stretch
  moment: stretch
  action: {text: Press and hold on Reksio., origin: invented}
  result:
    text: Reksio stretches longer and longer like a dachshund, his front half walking forward while his back stays put, for as long as the press lasts; let go and he snaps back with a springy wobble.
    origin: inspired
    refs: [intro:stretch, mark:stretching-melody]
  sound:
    text: A rising, rubbery stretching sound while held, and a cartoon boing on release.
    origin: inspired
    refs: [intro:stretch]
- id: film
  moment: studio-card
  action: {text: Tap the red film strip lying in the yard., origin: invented}
  result:
    text: Reksio rears up and stamps each of the five empty frames with his front paws, and a little Reksio appears in each one; the full strip rolls up into a film reel that stays in the yard.
    origin: inspired
    refs: [intro:studio-card, mark:stamping-sound-1-longer]
  sound:
    text: 'Thump, thump … double squeak: a thud with a wooden tok for each stamp, alternating dull and bright, then two rubbery squeaks as the little Reksios squash and stretch, then the rattle of the reel winding up.'
    origin: inspired
    refs: [mark:stamping-sound-1-longer, mark:stamping-sound-2-short]
- id: flowers
  action: {text: Tap the flowers., origin: invented}
  result:
    text: Reksio sniffs the flowers, then sneezes, and petals fly.
    origin: invented
  sound: {text: 'Sniffs, then a sneeze.', origin: invented}
- id: house
  action: {text: Tap the house., origin: invented}
  result:
    text: The house's window is open, and through it a cuckoo clock hangs on the room's wall — an indoor clock, so it lives indoors. Reksio trots to the house and looks up at it. The cuckoo pops out and calls, and he barks back up at it after each call, very pleased with himself; it goes in, and he turns his back on it, nose in the air. Then it pops out once more and calls behind him. He spins round and barks too late, and the little door snaps shut on him and the curtain flutters; he gives it a cross look. The second time he goes first with a little howl, and the cuckoo answers. The clock is always there. Its hands show the day's time, its pendulum swings without a sound, and on each hour the cuckoo comes out and calls once (eight slow times at 20:00, as he goes to bed); near the house, Reksio looks up at it. For Eliot, whose grandfather keeps wall clocks.
    origin: invented
  sound: {text: 'Ku-ku, two soft falling notes, a wooden tok as the door snaps shut and a rustle of curtain. No ticking.', origin: invented}
- id: gate
  action: {text: Tap the gate., origin: invented}
  result:
    text: At the right end of the yard, Reksio pokes his nose at the gate and barks; the gate rattles.
    origin: invented
  sound: {text: 'A rattle and a bark.', origin: invented}
- id: bird
  action: {text: Tap the bird on the wall., origin: invented}
  result:
    text: Reksio barks at the bird; it flutters up, circles, and lands somewhere else in the yard. Once it has pulled the bowl off his head they are friends, though he barked it away before. A tap brings it down beside him for a hop and a chirp, he play-bows, and it flies back up. No more chasing.
    origin: invented
  sound: {text: 'A bark, a chirp and a flutter.', origin: invented}
- id: dig
  action: {text: Tap the mound of earth., origin: invented}
  result:
    text: Reksio digs, earth flying, finds a bone, and carries it off in his teeth. Next time he buries it — digs a hole, drops it in, noses the earth back and pats it down (sometimes after a sly look round to check nobody's watching) — and the time after he digs it up again, round and round.
    origin: invented
  sound: {text: Scratchy digging and a bright "found it" ding., origin: invented}
  easter_egg:
    text: When he finds the bone he gives his original quick barks.
    origin: original
    refs: [mark:bark]
- id: trap
  action: {text: 'Once the mouse has come out, tap the mouse trap (or the mouse).', origin: invented}
  result:
    text: In some plays a mouse trap baited with cheese stands by a mouse hole at the foot of the wall. After a while a mouse comes out, creeps up to the cheese, flinches back from the trap, and squeaks at Reksio. He stamps the ground beside the trap; it snaps shut on nothing and flings the cheese to her. She eats it, cheeks bulging, sends him a heart, and goes home, and he noses the sprung trap away. Later, sniffing at her hole brings her out to touch noses. Nobody gets hurt and nothing is caught; the trap is the problem, not the mouse.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Tiny squeaks, a stamp, the crack and twang of the trap, nibbling.', origin: invented}
- id: hen
  action: {text: 'Once the hen has laid an egg up on the wall, tap her nest or the ladder.', origin: invented}
  result:
    text: After Reksio i nośna kura (1981), where a hen lays all over the yard and Reksio collects her eggs. In some plays a hen has her nest by the wall, the garden ladder leaning beside it. A while in she flutters up onto the top of the wall, lays an egg there with a loud cluck, flutters down, and can't get it back, so she clucks up at it. Reksio picks up the ladder and carries it level to under the egg, leans it on the wall, climbs paw over paw, takes the egg gently in his mouth, climbs down carefully and puts it in her nest. She settles on it, happy, and a heart rises. Each time after, she lays again somewhere else along the wall, and something is added on top, a different thing each time. The ladder wobbles on his way down and he clings on, worried; the egg hatches in the nest and a chick hops out to him; or he and the hen hop about together for joy.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Clucks, a loud ko-dak after laying, wingbeats, a wooden knock as the ladder leans, his steps on the rungs, an eggshell''s crack and a chick''s cheep.', origin: invented}
- id: mushrooms
  action: {text: 'After a shower, tap a mushroom: the fly agaric or a porcino.', origin: invented}
  result:
    text: After Reksio kompan (1976), where Reksio and the boy go mushroom picking and in the end he finds a huge porcino. A few seconds after a shower clears, three mushrooms come up beside a puddle, a red fly agaric and two porcinos, and the boy's basket stands a little way off. The child chooses which to tap. The fly agaric he sniffs from a distance, backs away from with a frown and shakes his head; later he wags a paw at it, or walks off with a wary look back. He never takes it in his mouth, and nothing is ever eaten by him. A porcino he sniffs, picks gently in his mouth and carries to the basket, sometimes showing it off to the child first or sniffing it blissfully. Once the basket holds three, he shares the next with the snail. He puts it down in front of her and steps back, she hides in her shell, peeks out, and eats it bite by bite. Picked porcinos slowly grow back, up to six a play. Plays without rain have no mushrooms.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Soft pops as they come up, sniffs, a plop into the basket, the snail nibbling.', origin: invented}
- id: tree
  action: {text: 'Once someone hungry is waiting under it, tap the fruit tree.', origin: invented}
  result:
    text: In some plays a tree by the wall hangs with apples, plums or hazelnuts. A while in, someone hungry turns up at its foot and looks up at fruit it can't reach — a snail for apples or plums, a squirrel for nuts. Reksio rears up against the trunk and shakes it three times; leaves fly and fruit drops. The snail creeps to it and eats it chunk by chunk until only the core (or a plum's stone) is left, and over the next minute more snails come to share. The squirrel eats one nut, buries another, and runs off up the trunk. Shaking again drops more, and once an apple lands on Reksio's head and he sits down, dazed.
    origin: inspired
    refs: ['world:themes_and_values[0]']
  sound: {text: 'Rustling leaves, a plop or a tock as fruit lands, quiet nibbling, a squirrel''s chitter, a bonk.', origin: invented}
- id: berries
  action: {text: Tap the blackberry bramble., origin: invented}
  result:
    text: Reksio sniffs the bramble, nips off a blackberry, flicks it high into the air with his head, jumps, catches it in his mouth, chews, and licks his lips. Doing it again, he sometimes misses — it sails over his head, and he spins round and gobbles it off the ground. The first time he does it again, and every other time after (never in the rain), his tail gets caught. Pleased with his berry, he turns his back to the bush and wags, and a thorny cane with a white flower on it catches his tail. He sets off and is yanked back with a boing, looks round twice in disbelief, pulls for all he's worth on all fours, and is snapped back onto his bottom. He sits glum, looking back at his tail; each tap is another try. After a few seconds a bumblebee comes for the flower by his tail. He hears it hum, freezes, slowly looks round, and when it bumbles right up to his bottom he leaps straight up in fright, and the leap tears his tail free. The bee never noticed and goes back to its flower; Reksio checks that his tail is all there, and wags. If the child never taps the bramble twice, it happens on its own, once a play, the first time he is left alone a while (as the bowl does; only one of the two each play).
    origin: invented
  sound: {text: 'A snap, a rising whoosh, a snap as he catches it, munching. Caught, a snap and a rustle, a twangy boing each time the tail pulls him back, the bee''s hum, and a pop as it comes free.', origin: invented}

ending:
  text: When the sun has set, the rain stops and the light goes, but everything still works. The moon comes up from behind the wall, slowly (about forty seconds), and it is a different moon each evening, in a new place, from a thin crescent to full. Reksio yawns and wishes for his doghouse. Once the moon is up, or as soon as the child taps the doghouse, night falls deep blue, he trots into his doghouse, and the picture closes in a circle on the doghouse, like the end of an episode.
  origin: inspired
  refs: ['world:places[doghouse].description', intro:fade-out]

