<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- added to a phone's home screen, it opens full screen, without the browser's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#17140f">
  <title>Reksio</title>
  <link rel="icon" href="data:,"><!-- no icon: keeps the browser from asking for one -->
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="stage" class="stage starting">
    <canvas id="paint" aria-hidden="true"></canvas>

    <!-- The view is 900 scene units high and 1600 to 2100 wide (16:9 to
         21:9), or on a phone a little less high, the top of the sky cut
         (painting.js fits it to the screen); the yard is 4000 wide and the
         camera (#cam) follows Reksio. Solid things never move; only things
         that would really move do (flowers and grass in the breeze, the bird,
         the curtain, the gate). -->
    <svg id="world" class="view" viewBox="0 0 1600 900" role="img" aria-label="Reksio in his yard">
      <defs>
        <path id="zee" d="M0 0 H16 L0 18 H16" />
        <!-- the little Reksio printed into each film frame -->
        <g id="mini-reksio">
          <path class="mini-head" d="M-12 2 C-13 -8 -4 -13 4 -10 C10 -8 16 -4 18 0 C19 4 16 6 12 6 L-2 6 C-8 6 -11 5 -12 2 Z" />
          <path class="mini-ear" d="M-10 -6 Q-11 -16 -3 -16 Q4 -16 5 -10 Q0 -9 -3 -6 Z" />
          <circle class="eye" cx="-1" cy="-4" r="1.6" />
          <circle class="eye" cx="17" cy="1" r="2.2" />
        </g>
        <!-- pictures of the things he can wish for in a thought bubble -->
        <g id="icon-bowl">
                <path class="food" d="M30 -258 Q36 -270 46 -263 Q52 -274 60 -264 Q68 -274 76 -263 Q82 -268 84 -258 Z" />
                <path class="bowl" d="M22 -258 H90 L80 -236 H32 Z" />
        </g>
        <g id="icon-tap">
                <path class="drop-icon" d="M56 -288 Q36 -258 40 -246 Q44 -230 56 -230 Q68 -230 72 -246 Q76 -258 56 -288 Z" />
        </g>
        <g id="icon-dig">
                <path class="bone" d="M36 -252 H76 M32 -258 a6 6 0 1 0 0 12 M80 -258 a6 6 0 1 1 0 12" />
                <path class="bone-white" d="M36 -252 H76 M32 -258 a6 6 0 1 0 0 12 M80 -258 a6 6 0 1 1 0 12" />
        </g>
        <g id="icon-bird">
                <ellipse class="bird" cx="50" cy="-248" rx="18" ry="13" />
                <circle class="bird" cx="66" cy="-262" r="9" />
                <path class="beak" d="M74 -264 L86 -260 L74 -257 Z" />
                <circle class="bird-eye" cx="68" cy="-264" r="2.2" />
                <path class="bird" d="M34 -246 L20 -254 L24 -242 Z" />
        </g>
        <g id="icon-film">
                <rect class="strip" x="20" y="-268" width="72" height="34" rx="3" />
                <rect class="frame" x="27" y="-261" width="17" height="20" />
                <rect class="frame" x="48" y="-261" width="17" height="20" />
                <rect class="frame" x="69" y="-261" width="17" height="20" />
        </g>
        <g id="icon-doghouse">
                <rect class="plank" x="34" y="-262" width="44" height="28" />
                <ellipse class="door" cx="56" cy="-246" rx="9" ry="11" />
                <path class="roof-icon" d="M28 -260 L56 -284 L84 -260" />
        </g>
        <g id="icon-trap">
                <path class="cheese" d="M62 -236 H94 V-262 Z" />
                <circle class="cheese-hole" cx="86" cy="-245" r="3.2" />
                <circle class="cheese-hole" cx="78" cy="-240" r="2.2" />
                <ellipse class="mouse-fur" cx="30" cy="-246" rx="15" ry="10" />
                <path class="mouse-fur" d="M38 -256 Q50 -258 58 -246 Q50 -240 38 -240 Z" />
                <circle class="mouse-ear" cx="40" cy="-258" r="7" />
                <circle class="mouse-ear-in" cx="40" cy="-258" r="3.5" />
                <circle class="eye" cx="48" cy="-250" r="2" />
                <circle class="mouse-nose" cx="58" cy="-246" r="2.6" />
        </g>
        <g id="icon-hen">
                <rect class="icon-wall" x="20" y="-244" width="72" height="20" />
                <ellipse class="egg" cx="56" cy="-258" rx="11" ry="14" />
        </g>
        <g id="icon-tree">
                <rect class="trunk" x="51" y="-250" width="10" height="24" />
                <circle class="leaves-ink" cx="56" cy="-262" r="22" />
                <circle class="leaves" cx="56" cy="-262" r="22" />
                <use class="icon-fruit" href="#fruit-apple" transform="translate(46 -262) scale(0.5)" />
                <use class="icon-fruit" href="#fruit-apple" transform="translate(64 -270) scale(0.5)" />
                <use class="icon-fruit" href="#fruit-apple" transform="translate(63 -254) scale(0.5)" />
        </g>
        <g id="icon-berries">
                <circle class="bramble-leaves" cx="56" cy="-254" r="20" />
                <use href="#berry" transform="translate(44 -260) scale(1.4)" />
                <use href="#berry" transform="translate(64 -264) scale(1.4)" />
                <use href="#berry" transform="translate(58 -246) scale(1.4)" />
        </g>
        <!-- a bramble flower: five white petals, round (0, 0) -->
        <g id="blossom">
          <circle class="blossom" cx="0" cy="-6" r="5.5" />
          <circle class="blossom" cx="5.7" cy="-1.9" r="5.5" />
          <circle class="blossom" cx="3.5" cy="4.9" r="5.5" />
          <circle class="blossom" cx="-3.5" cy="4.9" r="5.5" />
          <circle class="blossom" cx="-5.7" cy="-1.9" r="5.5" />
          <circle class="blossom-eye" cx="0" cy="0" r="3.2" />
        </g>
        <!-- the thorny tip of the bramble's cane (#snag), round its tip at (0, 0):
             drawn over his caught tail (bramble.js) -->
        <g id="snag-tip">
          <path class="cane" d="M12 14 Q-2 4 -6 -8" />
          <path class="thorns" d="M1 5 l-7 2 M-5 -3 l-6 -3" />
        </g>
        <!-- a blackberry: a cluster of little drupelets, round (0, 0) -->
        <g id="berry">
          <circle class="berry" cx="-3" cy="-1" r="3.4" />
          <circle class="berry" cx="3" cy="-1" r="3.4" />
          <circle class="berry" cx="0" cy="-5" r="3.4" />
          <circle class="berry" cx="-2" cy="4" r="3.4" />
          <circle class="berry" cx="3" cy="4" r="3.4" />
          <circle class="berry-shine" cx="-2" cy="-5" r="1.4" />
          <circle class="berry-shine" cx="3.5" cy="-1.5" r="1" />
          <path class="berry-calyx" d="M-4 -8 L0 -11 L4 -8" />
        </g>
        <!-- fruit, drawn round (0, 0) -->
        <g id="fruit-apple">
          <circle class="apple" r="11" />
          <path class="fruit-stem" d="M0 -10 q1 -5 3 -7" />
          <path class="fruit-leaf" d="M2 -14 q7 -5 11 0 q-6 4 -11 0 z" />
          <circle class="fruit-shine" cx="-4" cy="-4" r="2.5" />
        </g>
        <g id="fruit-plum">
          <ellipse class="plum" rx="9" ry="11" />
          <path class="fruit-stem" d="M0 -10 q1 -5 3 -7" />
          <path class="plum-line" d="M1 -9 q-4 9 0 18" />
        </g>
        <g id="fruit-nut">
          <circle class="nut" cy="2" r="8" />
          <path class="nut-cap" d="M-9 -2 Q-9 -10 0 -11 Q9 -10 9 -2 Q4 -4 0 -3 Q-4 -4 -9 -2 Z" />
        </g>
        <path id="heart-shape" d="M0 10 C-16 -2 -14 -16 -5 -16 C-2 -16 0 -13 0 -11 C0 -13 2 -16 5 -16 C14 -16 16 -2 0 10 Z" />
        <g id="twinkle-shape">
          <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" />
        </g>
      </defs>

      <!-- The sky's things, fixed to the screen (smaller on a phone, where
           less sky shows: painting.js). -->
      <g class="far-sky">
        <!-- The sun, far away: it crosses the sky with the hour and sets behind
             the wall (clipped at the wall's top). sky.js places it. -->
        <clipPath id="sky-clip"><rect class="view-wide" x="0" y="0" width="1600" height="334" /></clipPath>
        <g clip-path="url(#sky-clip)">
          <g id="sun">
            <circle class="sun-glow" cx="1240" cy="120" r="74" />
            <circle class="sun" cx="1240" cy="120" r="46" />
          </g>
        </g>

        <!-- weather in the sky: a rainbow, clouds -->
        <g id="rainbow" opacity="0"></g>
        <g id="clouds"></g>
      </g>

      <g id="cam">
        <!-- puddles after rain, on the ground under everything (weather.js) -->
        <g id="puddles"></g>
        <!-- action spots on the ground: stand in one (or tap it) to use the thing -->
        <g id="spots"></g>

        <g id="things">

          <!-- grass tufts, behind everything (they sway in the breeze; taps go through them) -->
          <path class="grass sway" style="transform-origin: 772px 812px" d="M760 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />
          <path class="grass sway" style="transform-origin: 1462px 818px" d="M1450 818 l6 -20 l4 16 l6 -24 l4 24 l6 -16 l4 20" />
          <path class="grass sway" style="transform-origin: 1912px 812px" d="M1900 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />
          <path class="grass sway" style="transform-origin: 2412px 816px" d="M2400 816 l6 -20 l4 16 l6 -24 l4 24 l6 -16 l4 20" />
          <path class="grass sway" style="transform-origin: 2212px 812px" d="M2200 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />

          <!-- ============ the family house: the left end of the yard ============ -->
          <!-- its window open, and through it the room, the cuckoo clock on its wall (cuckoo.js):
               a tap on the house is a tap on the clock -->
          <g id="house" class="thing" data-thing="house" data-hint-y="320">
            <rect class="hit" x="0" y="300" width="320" height="510" />
            <rect class="plaster" x="-20" y="250" width="330" height="560" />
            <path class="plaster-edge" d="M310 250 V810" />
            <rect class="room" x="60" y="330" width="190" height="210" />
            <path class="room-stripes" d="M82 330 V540 M112 330 V540 M142 330 V540 M172 330 V540 M202 330 V540 M232 330 V540" />
            <!-- the clock as drawn about (160, 331), hung on the room's wall -->
            <g id="clock" transform="translate(-5 90)">
            <path class="clock-chain" d="M138 362 V381 M182 362 V377" />
            <ellipse class="clock-cone" cx="138" cy="391" rx="7" ry="11" />
            <ellipse class="clock-cone" cx="182" cy="387" rx="7" ry="11" />
            <g id="cuckoo-pendulum" style="transform-origin: 160px 362px">
              <path class="clock-rod" d="M160 362 V386" />
              <circle class="clock-bob" cx="160" cy="391" r="8" />
            </g>
            <rect class="clock-wood" x="114" y="284" width="92" height="80" rx="4" />
            <path class="clock-roof" d="M104 293 L160 255 L216 293" />
            <path class="clock-roof-edge" d="M104 293 L160 255 L216 293" />
            <rect class="clock-hole" x="148" y="289" width="24" height="18" />
            <g id="cuckoo-bird" style="transform-origin: 160px 300px" opacity="0">
              <path class="cuckoo-tail" d="M152 298 L141 293 L143 303 Z" />
              <ellipse class="cuckoo-body" cx="158" cy="300" rx="9" ry="7" />
              <path class="cuckoo-wing" d="M152 299 Q158 295 163 300 Q157 304 152 299 Z" />
              <circle class="cuckoo-body" cx="166" cy="294" r="5.5" />
              <circle class="eye" cx="168" cy="293" r="1.3" />
              <path class="cuckoo-beak" d="M171 292 L178 293.5 L171 295 Z" />
              <path id="cuckoo-beak-low" class="cuckoo-beak" d="M171 295 L177 296 L171 296.5 Z" style="transform-origin: 171px 295px" />
            </g>
            <rect id="cuckoo-door" class="clock-door" x="148" y="289" width="24" height="18" style="transform-origin: 148px 298px" />
            <circle class="clock-face" cx="160" cy="331" r="25" />
            <g id="clock-ticks">
              <path class="clock-tick big" d="M160 309 V314" transform="rotate(0 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(30 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(60 160 331)" />
              <path class="clock-tick big" d="M160 309 V314" transform="rotate(90 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(120 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(150 160 331)" />
              <path class="clock-tick big" d="M160 309 V314" transform="rotate(180 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(210 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(240 160 331)" />
              <path class="clock-tick big" d="M160 309 V314" transform="rotate(270 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(300 160 331)" />
              <path class="clock-tick" d="M160 309 V312" transform="rotate(330 160 331)" />
            </g>
            <path id="clock-hour" class="clock-hand" d="M160 331 V318" style="transform-origin: 160px 331px" />
            <path id="clock-minute" class="clock-hand thin" d="M160 331 V311" style="transform-origin: 160px 331px" />
            <circle class="clock-pin" cx="160" cy="331" r="3" />
            </g>
            <g id="curtain" style="transform-origin: 64px 336px">
              <path class="curtain" d="M62 334 Q90 430 72 534 H62 Z" />
            </g>
            <path class="curtain" d="M248 334 Q220 430 238 534 H248 Z" />
            <rect class="window-frame" x="60" y="330" width="190" height="210" />
            <path class="pane" d="M60 334 L30 350 V520 L60 536 Z" />
            <path class="pane" d="M250 334 L280 350 V520 L250 536 Z" />
            <rect class="sill" x="46" y="540" width="218" height="14" />
            <rect class="step" x="70" y="790" width="180" height="20" />
          </g>

          <!-- ============ doghouse ============ -->
          <g id="doghouse" class="thing" data-thing="doghouse" data-hint-y="540">
            <rect class="hit" x="395" y="540" width="330" height="270" />
            <rect class="plank" x="433" y="640" width="254" height="150" />
            <path class="plank-line" d="M435 670 H685 M435 700 H685 M435 730 H685 M435 760 H685" />
            <ellipse class="door" cx="560" cy="726" rx="44" ry="50" />
            <path class="roof" d="M403 668 L560 560 L717 668" />
            <path class="roof-edge" d="M403 668 L560 560 L717 668" />
            <!-- his nap's dream of a bone, in a bubble (nap.js) -->
            <g id="dream" style="opacity: 0">
              <circle class="bubble" cx="522" cy="700" r="6" />
              <circle class="bubble" cx="504" cy="674" r="9" />
              <ellipse class="bubble" cx="470" cy="620" rx="50" ry="36" />
              <use href="#icon-dig" transform="translate(436.4 771.2) scale(0.6)" />
            </g>
          </g>

          <!-- ============ supper by the doghouse door, served at bedtime when his bowl isn't out (things.js) ============ -->
          <g id="supper" aria-hidden="true">
            <path class="steam" d="M626 774 q-6 -10 0 -20 q6 -10 0 -20" />
            <path class="steam" d="M645 770 q-6 -10 0 -20 q6 -10 0 -20" style="animation-delay: -0.8s" />
            <path class="steam" d="M664 774 q-6 -10 0 -20 q6 -10 0 -20" style="animation-delay: -1.6s" />
            <g id="supper-food" style="transform-origin: 645px 792px">
              <path class="food" d="M612 792 Q620 778 630 786 Q638 774 648 784 Q658 774 666 786 Q676 780 680 792 Z" />
            </g>
            <path class="supper-dish" d="M605 790 H685 L674 816 H616 Z" />
            <path class="bowl-rim" d="M605 790 H685" />
          </g>

          <!-- ============ food bowl ============ -->
          <g id="bowl" class="thing" data-thing="bowl" data-hint-y="720">
            <rect class="hit" x="790" y="620" width="180" height="210" />
            <g id="bowl-body">
              <!-- steam: supper in his bowl at bedtime (bowl.js) -->
              <path class="steam" d="M861 762 q-6 -10 0 -20 q6 -10 0 -20" />
              <path class="steam" d="M880 758 q-6 -10 0 -20 q6 -10 0 -20" style="animation-delay: -0.8s" />
              <path class="steam" d="M899 762 q-6 -10 0 -20 q6 -10 0 -20" style="animation-delay: -1.6s" />
              <g id="food" style="transform-origin: 880px 770px">
                <path class="food" d="M842 770 Q850 752 862 762 Q870 748 882 760 Q894 748 904 762 Q914 754 918 770 Z" />
              </g>
              <path class="bowl" d="M830 768 H930 L916 800 H844 Z" />
              <path class="bowl-rim" d="M830 768 H930" />
            </g>
          </g>

          <!-- ============ water tap on the wall, red hose below ============ -->
          <g id="tap" class="thing" data-thing="tap" data-hint-y="440">
            <rect class="hit" x="1200" y="450" width="150" height="360" />
            <rect class="plate" x="1252" y="460" width="36" height="22" rx="4" />
            <path class="pipe" d="M1270 470 V540 H1300" />
            <path class="pipe-inner" d="M1270 470 V540 H1300" />
            <path class="spout" d="M1300 540 Q1320 540 1320 562" />
            <g id="tap-handle" style="transform-origin: 1270px 528px">
              <path class="handle" d="M1250 528 H1290" />
              <circle class="handle-knob" cx="1270" cy="528" r="7" />
            </g>
            <path id="water" class="water" d="M1320 566 Q1316 640 1324 712 Q1320 760 1322 790" opacity="0" />
            <path class="hose" d="M1282 790 C1240 795 1230 772 1262 768 C1302 763 1312 788 1276 786 C1252 785 1252 776 1270 776 M1282 790 C1310 796 1360 794 1380 788" />
            <path class="hose hose-red" d="M1282 790 C1240 795 1230 772 1262 768 C1302 763 1312 788 1276 786 C1252 785 1252 776 1270 776 M1282 790 C1310 796 1360 794 1380 788" />
          </g>

          <!-- ============ flowers (they sway in the breeze) ============ -->
          <g id="flowers" class="thing" data-thing="flowers" data-hint-y="630">
            <rect class="hit" x="1545" y="620" width="220" height="210" />
            <g class="sway" style="transform-origin: 1600px 800px">
              <path class="stem" d="M1600 800 Q1596 740 1604 690" />
              <path class="leaf" d="M1602 760 Q1580 748 1572 730 Q1594 734 1602 752 Z" />
              <g class="bloom"><circle class="petal-red" cx="1604" cy="690" r="17" /><circle class="flower-eye" cx="1604" cy="690" r="6" /></g>
            </g>
            <g class="sway" style="transform-origin: 1650px 800px">
              <path class="stem" d="M1650 800 Q1656 730 1648 664" />
              <path class="leaf" d="M1652 740 Q1676 728 1684 708 Q1660 714 1652 732 Z" />
              <g class="bloom"><circle class="petal-yellow" cx="1648" cy="664" r="19" /><circle class="flower-eye" cx="1648" cy="664" r="7" /></g>
            </g>
            <g class="sway" style="transform-origin: 1700px 800px">
              <path class="stem" d="M1700 800 Q1696 750 1706 700" />
              <path class="leaf" d="M1700 770 Q1722 762 1730 744 Q1708 748 1700 764 Z" />
              <g class="bloom"><circle class="petal-red" cx="1706" cy="700" r="15" /><circle class="flower-eye" cx="1706" cy="700" r="5" /></g>
            </g>
          </g>

          <!-- ============ mound of earth, with a bone inside ============ -->
          <g id="mound" class="thing" data-thing="dig" data-hint-y="720">
            <rect class="hit" x="1990" y="640" width="220" height="190" />
            <path class="earth" d="M2020 805 Q2040 760 2100 752 Q2160 760 2180 805 Z" />
            <path class="earth-dots" d="M2060 785 h2 M2090 772 h2 M2120 790 h2 M2150 782 h2 M2082 795 h2" />
            <g id="found-bone" opacity="0" style="transform-origin: 2100px 760px">
              <path class="bone" d="M2076 760 H2124 M2072 754 a6 6 0 1 0 0 12 M2128 754 a6 6 0 1 1 0 12" />
              <path class="bone-white" d="M2076 760 H2124 M2072 754 a6 6 0 1 0 0 12 M2128 754 a6 6 0 1 1 0 12" />
            </g>
            <!-- an old boot that comes up instead, and a molehill (mound.js) -->
            <g id="found-boot" opacity="0" style="transform-origin: 2100px 760px; opacity: 0">
              <path class="boot" d="M2078 742 H2102 V766 Q2124 766 2126 778 H2078 Z" />
              <path class="boot-sole" d="M2076 778 H2128" />
            </g>
            <path id="molehill" class="earth" d="M-38 812 Q-30 778 0 775 Q30 778 38 812 Z" style="opacity: 0; transform-box: fill-box; transform-origin: bottom" />
          </g>

          <!-- ============ a red film strip on the ground, five empty frames ============ -->
          <g id="film" class="thing" data-thing="film" data-hint-y="730">
            <rect class="hit" x="2235" y="720" width="450" height="110" />
            <g id="strip" style="transform-origin: 2612px 790px">
              <rect class="strip" x="2248" y="756" width="364" height="66" rx="4" />
              <path class="sprockets" d="M2258 763 h8 M2278 763 h8 M2298 763 h8 M2318 763 h8 M2338 763 h8 M2358 763 h8 M2378 763 h8 M2398 763 h8 M2418 763 h8 M2438 763 h8 M2458 763 h8 M2478 763 h8 M2498 763 h8 M2518 763 h8 M2538 763 h8 M2558 763 h8 M2578 763 h8 M2598 763 h4 M2258 815 h8 M2278 815 h8 M2298 815 h8 M2318 815 h8 M2338 815 h8 M2358 815 h8 M2378 815 h8 M2398 815 h8 M2418 815 h8 M2438 815 h8 M2458 815 h8 M2478 815 h8 M2498 815 h8 M2518 815 h8 M2538 815 h8 M2558 815 h8 M2578 815 h8 M2598 815 h4" />
              <rect class="frame" x="2260" y="771" width="60" height="36" />
              <rect class="frame" x="2330" y="771" width="60" height="36" />
              <rect class="frame" x="2400" y="771" width="60" height="36" />
              <rect class="frame" x="2470" y="771" width="60" height="36" />
              <rect class="frame" x="2540" y="771" width="60" height="36" />
              <use class="print" href="#mini-reksio" x="2290" y="791" opacity="0" />
              <use class="print" href="#mini-reksio" x="2360" y="791" opacity="0" />
              <use class="print" href="#mini-reksio" x="2430" y="791" opacity="0" />
