<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reksio</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="stage" class="stage">
    <canvas id="paint" aria-hidden="true"></canvas>

    <!-- The view is 1600 x 900 scene units; the yard is 3000 wide and the
         camera (#cam) follows Reksio. Solid things never move; only things
         that would really move do (flowers and grass in the breeze, the bird,
         the curtain, the gate). -->
    <svg id="world" viewBox="0 0 1600 900" role="img" aria-label="Reksio in his yard">
      <defs>
        <path id="zee" d="M0 0 H16 L0 18 H16" />
        <g id="twinkle-shape">
          <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" />
        </g>
      </defs>

      <!-- The sun, far away: it sinks a step with each main thing done and sets
           behind the wall (clipped at the wall's top). -->
      <clipPath id="sky-clip"><rect x="0" y="0" width="1600" height="334" /></clipPath>
      <g clip-path="url(#sky-clip)">
        <g id="sun" style="transform: translateY(0)">
          <circle class="sun-glow" cx="1240" cy="120" r="74" />
          <circle class="sun" cx="1240" cy="120" r="46" />
        </g>
      </g>

      <g id="cam">
        <g id="things">

          <!-- ============ the family house: the left end of the yard ============ -->
          <g id="house" class="thing" data-thing="house" data-hint-y="380">
            <rect class="hit" x="0" y="300" width="320" height="510" />
            <rect class="plaster" x="-20" y="250" width="330" height="560" />
            <path class="plaster-edge" d="M310 250 V810" />
            <rect class="window" x="90" y="400" width="140" height="130" />
            <path class="window-bars" d="M160 400 V530 M90 465 H230" />
            <g id="curtain" style="transform-origin: 104px 406px">
              <path class="curtain" d="M96 406 Q118 470 104 524 H96 Z" />
            </g>
            <path class="curtain" d="M224 406 Q202 470 216 524 H224 Z" />
            <rect class="step" x="70" y="790" width="180" height="20" />
          </g>

          <!-- ============ doghouse ============ -->
          <g id="doghouse" class="thing" data-thing="doghouse" data-hint-y="540">
            <rect class="hit" x="395" y="540" width="330" height="270" />
            <rect class="plank" x="433" y="640" width="254" height="150" />
            <path class="plank-line" d="M435 670 H685 M435 700 H685 M435 730 H685 M435 760 H685" />
            <ellipse class="door" cx="560" cy="726" rx="44" ry="50" />
            <path class="roof" d="M403 668 L560 560 L717 668" />
            <path class="roof-edge" d="M403 668 L560 560 L717 668" />
            <!-- asleep in the doorway: head on his front paws, front view -->
            <g id="nap" opacity="0">
              <g id="nap-head" style="transform-origin: 560px 776px">
                <path class="ear-white" d="M532 724 Q510 726 508 748 Q522 746 530 738 Z" />
                <ellipse class="ink" cx="560" cy="744" rx="36" ry="29" />
                <ellipse class="white" cx="560" cy="744" rx="36" ry="29" />
                <ellipse class="ochre" cx="576" cy="736" rx="14" ry="11" />
                <path class="lid" d="M540 737 Q547 743 554 737" />
                <path class="lid" d="M568 737 Q575 743 582 737" />
                <ellipse class="eye" cx="561" cy="754" rx="8" ry="5.5" />
                <path class="ear-ochre" d="M588 724 Q610 726 612 748 Q598 746 590 738 Z" />
              </g>
              <ellipse class="paw" cx="540" cy="779" rx="15" ry="9" />
              <ellipse class="paw" cx="581" cy="779" rx="15" ry="9" />
              <g id="zzz" class="zzz">
                <use id="z1" href="#zee" x="604" y="690" />
                <use id="z2" href="#zee" x="628" y="660" />
                <use id="z3" href="#zee" x="650" y="628" />
              </g>
            </g>
          </g>

          <!-- ============ food bowl ============ -->
          <g id="bowl" class="thing" data-thing="bowl" data-hint-y="720">
            <rect class="hit" x="810" y="700" width="140" height="110" />
            <g id="food" style="transform-origin: 880px 770px">
              <path class="food" d="M842 770 Q850 752 862 762 Q870 748 882 760 Q894 748 904 762 Q914 754 918 770 Z" />
            </g>
            <path class="bowl" d="M830 768 H930 L916 800 H844 Z" />
            <path class="bowl-rim" d="M830 768 H930" />
          </g>

          <!-- ============ water tap on the wall, red hose below ============ -->
          <g id="tap" class="thing" data-thing="tap" data-hint-y="440">
            <rect class="hit" x="1200" y="450" width="150" height="360" />
            <rect class="plate" x="1252" y="460" width="36" height="22" rx="4" />
            <path class="pipe" d="M1270 470 V540 H1300" />
            <path class="pipe-inner" d="M1270 470 V540 H1300" />
            <path class="spout" d="M1300 540 Q1320 540 1320 562" />
            <g id="tap-handle" style="transform-origin: 1270px 528px">
              <path class="handle" d="M1250 528 H1290" />
              <circle class="handle-knob" cx="1270" cy="528" r="7" />
            </g>
            <path id="water" class="water" d="M1320 566 Q1316 640 1324 712 Q1320 760 1322 790" opacity="0" />
            <path class="hose" d="M1282 790 C1240 795 1230 772 1262 768 C1302 763 1312 788 1276 786 C1252 785 1252 776 1270 776 M1282 790 C1310 796 1360 794 1380 788" />
            <path class="hose hose-red" d="M1282 790 C1240 795 1230 772 1262 768 C1302 763 1312 788 1276 786 C1252 785 1252 776 1270 776 M1282 790 C1310 796 1360 794 1380 788" />
          </g>

          <!-- ============ flowers (they sway in the breeze) ============ -->
          <g id="flowers" class="thing" data-thing="flowers" data-hint-y="630">
            <rect class="hit" x="1560" y="640" width="190" height="170" />
            <g class="sway" style="transform-origin: 1600px 800px">
              <path class="stem" d="M1600 800 Q1596 740 1604 690" />
              <path class="leaf" d="M1602 760 Q1580 748 1572 730 Q1594 734 1602 752 Z" />
              <g class="bloom"><circle class="petal-red" cx="1604" cy="690" r="17" /><circle class="flower-eye" cx="1604" cy="690" r="6" /></g>
            </g>
            <g class="sway" style="transform-origin: 1650px 800px">
              <path class="stem" d="M1650 800 Q1656 730 1648 664" />
              <path class="leaf" d="M1652 740 Q1676 728 1684 708 Q1660 714 1652 732 Z" />
              <g class="bloom"><circle class="petal-yellow" cx="1648" cy="664" r="19" /><circle class="flower-eye" cx="1648" cy="664" r="7" /></g>
            </g>
            <g class="sway" style="transform-origin: 1700px 800px">
              <path class="stem" d="M1700 800 Q1696 750 1706 700" />
              <path class="leaf" d="M1700 770 Q1722 762 1730 744 Q1708 748 1700 764 Z" />
              <g class="bloom"><circle class="petal-red" cx="1706" cy="700" r="15" /><circle class="flower-eye" cx="1706" cy="700" r="5" /></g>
            </g>
          </g>

          <!-- ============ mound of earth, with a bone inside ============ -->
          <g id="mound" class="thing" data-thing="dig" data-hint-y="720">
            <rect class="hit" x="2010" y="700" width="180" height="110" />
            <path class="earth" d="M2020 805 Q2040 760 2100 752 Q2160 760 2180 805 Z" />
            <path class="earth-dots" d="M2060 785 h2 M2090 772 h2 M2120 790 h2 M2150 782 h2 M2082 795 h2" />
            <g id="found-bone" opacity="0" style="transform-origin: 2100px 760px">
              <path class="bone" d="M2076 760 H2124 M2072 754 a6 6 0 1 0 0 12 M2128 754 a6 6 0 1 1 0 12" />
              <path class="bone-white" d="M2076 760 H2124 M2072 754 a6 6 0 1 0 0 12 M2128 754 a6 6 0 1 1 0 12" />
            </g>
          </g>

          <!-- ============ the fence and gate: the right end of the yard ============ -->
          <g id="fence" class="thing" data-thing="gate" data-hint-y="520">
            <rect class="hit" x="2740" y="520" width="280" height="290" />
            <path class="rail" d="M2730 610 H3020 M2730 720 H3020" />
            <path class="picket" d="M2745 800 V560 l8 -12 l8 12 V800 Z M2995 800 V560 l8 -12 l8 12 V800 Z" />
            <g id="gate" style="transform-origin: 2786px 680px">
              <path class="picket" d="M2790 800 V570 l8 -12 l8 12 V800 Z M2830 800 V570 l8 -12 l8 12 V800 Z M2870 800 V570 l8 -12 l8 12 V800 Z M2910 800 V570 l8 -12 l8 12 V800 Z M2950 800 V570 l8 -12 l8 12 V800 Z" />
              <path class="gate-brace" d="M2792 780 L2962 610" />
              <circle class="latch" cx="2966" cy="680" r="7" />
            </g>
          </g>

          <!-- ============ the bird ============ -->
          <g id="bird" class="thing" data-thing="bird" style="transform: translate(1480px, 330px)">
            <rect class="hit" x="-55" y="-70" width="110" height="90" />
            <g id="bird-body">
              <ellipse class="bird" cx="0" cy="-16" rx="22" ry="16" />
              <circle class="bird" cx="18" cy="-32" r="11" />
              <path class="beak" d="M27 -34 L42 -30 L27 -26 Z" />
              <circle class="bird-eye" cx="21" cy="-34" r="2.6" />
              <path class="bird" d="M-20 -14 L-40 -24 L-36 -10 Z" />
              <g id="bird-wing" style="transform-origin: 0px -20px">
                <path class="wing" d="M-6 -22 Q-2 -40 14 -20 Z" />
              </g>
              <path class="legs-thin" d="M-4 -2 V6 M6 -2 V6" />
            </g>
          </g>

          <!-- grass tufts (they sway in the breeze) -->
          <path class="grass sway" style="transform-origin: 772px 812px" d="M760 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />
          <path class="grass sway" style="transform-origin: 1462px 818px" d="M1450 818 l6 -20 l4 16 l6 -24 l4 24 l6 -16 l4 20" />
          <path class="grass sway" style="transform-origin: 1912px 812px" d="M1900 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />
          <path class="grass sway" style="transform-origin: 2412px 816px" d="M2400 816 l6 -20 l4 16 l6 -24 l4 24 l6 -16 l4 20" />
          <path class="grass sway" style="transform-origin: 2632px 812px" d="M2620 812 l6 -22 l4 18 l6 -26 l4 26 l6 -18 l4 22" />
        </g>

        <!-- ============ Reksio, side view, facing right; feet at y=0 ============ -->
        <g id="reksio" style="transform: translate(1000px, 812px)">
          <g id="rk-scale" style="transform: scale(1.3)">
            <g id="rk-flip">
              <g id="rk-bob" style="transform-origin: 0px -40px">
                <!-- far legs, behind the body -->
                <g class="leg" id="leg-1" style="transform-origin: -30px -40px">
                  <path class="leg-ink" d="M-30 -40 L-34 -3" /><path class="leg-white" d="M-30 -40 L-34 -3" />
                </g>
                <g class="front-part"><g class="leg" id="leg-2" style="transform-origin: 12px -42px">
                  <path class="leg-ink" d="M12 -42 L14 -3" /><path class="leg-white" d="M12 -42 L14 -3" />
                </g></g>
                <!-- tail stub -->
                <g id="tail" style="transform-origin: -46px -60px">
                  <path class="leg-ink" d="M-46 -60 L-58 -84" /><path class="leg-white" d="M-46 -60 L-58 -84" />
                </g>
                <!-- body: low at the rear, rising to a deep chest and thick neck -->
                <path id="rk-body-ink" class="ink" d="M-50 -58 Q-24 -66 2 -76 L18 -94 L30 -90 L28 -52 Q24 -34 4 -34 L-40 -34 Q-56 -36 -54 -50 Z" />
                <path id="rk-body-white" class="white" d="M-50 -58 Q-24 -66 2 -76 L18 -94 L30 -90 L28 -52 Q24 -34 4 -34 L-40 -34 Q-56 -36 -54 -50 Z" />
                <ellipse class="ochre" cx="-26" cy="-50" rx="16" ry="11" />
                <!-- near legs, in front of the body -->
                <g class="leg" id="leg-3" style="transform-origin: -22px -40px">
                  <path class="leg-ink" d="M-22 -40 L-25 -3" /><path class="leg-white" d="M-22 -40 L-25 -3" />
                </g>
                <g class="front-part"><g class="leg" id="leg-4" style="transform-origin: 22px -42px">
                  <path class="leg-ink" d="M22 -42 L24 -3" /><path class="leg-white" d="M22 -42 L24 -3" />
                </g></g>
                <!-- head: a big rounded skull flowing into a long, drooping muzzle -->
                <g class="front-part"><g id="rk-head" style="transform-origin: 20px -92px">
                  <path id="rk-mouth" class="mouth" d="M44 -78 L88 -78 Q82 -60 62 -62 Q48 -64 44 -78 Z" opacity="0" />
                  <path id="rk-tongue" class="tongue" d="M80 -78 Q92 -76 94 -58 Q86 -56 80 -68 Z" opacity="0" />
                  <path class="ink" d="M2 -104 C0 -128 20 -138 40 -132 C58 -126 80 -114 92 -100 C100 -90 96 -78 86 -76 L44 -76 C26 -76 10 -84 2 -104 Z" />
                  <path class="white" d="M2 -104 C0 -128 20 -138 40 -132 C58 -126 80 -114 92 -100 C100 -90 96 -78 86 -76 L44 -76 C26 -76 10 -84 2 -104 Z" />
                  <ellipse class="eye" cx="93" cy="-89" rx="5.5" ry="6" />
                  <path class="lid" d="M34 -124 Q42 -129 50 -123" />
                  <circle id="rk-eye" class="eye" cx="42" cy="-116" r="3.4" />
                  <path id="rk-smile" class="lid" d="M62 -79 Q72 -77 82 -80" />
                  <!-- the ear: one flap, folded forward over the top of the head -->
                  <path class="ear-ochre" d="M10 -124 Q8 -146 28 -150 Q46 -152 52 -136 Q44 -130 36 -130 Q26 -128 22 -122 Z" />
                  <g id="rk-bone" opacity="0">
                    <path class="bone" d="M66 -76 H106 M62 -81 a5 5 0 1 0 0 10 M110 -81 a5 5 0 1 1 0 10" />
                    <path class="bone-white" d="M66 -76 H106 M62 -81 a5 5 0 1 0 0 10 M110 -81 a5 5 0 1 1 0 10" />
                  </g>
                </g></g>
              </g>
            </g>
          </g>
          <!-- A thought bubble (the series' own device): a picture of something
               he still wants to do. Outside rk-flip, so pictures never mirror. -->
          <g id="wish" opacity="0">
            <g id="wish-pop" style="transform-origin: 30px -168px">
              <circle class="bubble" cx="18" cy="-176" r="6" />
              <circle class="bubble" cx="30" cy="-196" r="10" />
              <ellipse class="bubble" cx="56" cy="-252" rx="62" ry="48" />
              <!-- the bowl -->
              <g class="wish-icon" data-wish="bowl" opacity="0">
                <path class="food" d="M30 -258 Q36 -270 46 -263 Q52 -274 60 -264 Q68 -274 76 -263 Q82 -268 84 -258 Z" />
                <path class="bowl" d="M22 -258 H90 L80 -236 H32 Z" />
              </g>
              <!-- water: a drop -->
              <g class="wish-icon" data-wish="tap" opacity="0">
                <path class="drop-icon" d="M56 -288 Q36 -258 40 -246 Q44 -230 56 -230 Q68 -230 72 -246 Q76 -258 56 -288 Z" />
              </g>
              <!-- the bone -->
              <g class="wish-icon" data-wish="dig" opacity="0">
                <path class="bone" d="M36 -252 H76 M32 -258 a6 6 0 1 0 0 12 M80 -258 a6 6 0 1 1 0 12" />
                <path class="bone-white" d="M36 -252 H76 M32 -258 a6 6 0 1 0 0 12 M80 -258 a6 6 0 1 1 0 12" />
              </g>
              <!-- the bird -->
              <g class="wish-icon" data-wish="bird" opacity="0">
                <ellipse class="bird" cx="50" cy="-248" rx="18" ry="13" />
                <circle class="bird" cx="66" cy="-262" r="9" />
                <path class="beak" d="M74 -264 L86 -260 L74 -257 Z" />
                <circle class="bird-eye" cx="68" cy="-264" r="2.2" />
                <path class="bird" d="M34 -246 L20 -254 L24 -242 Z" />
              </g>
              <!-- sleep in the doghouse -->
              <g class="wish-icon" data-wish="doghouse" opacity="0">
                <rect class="plank" x="34" y="-262" width="44" height="28" />
                <ellipse class="door" cx="56" cy="-246" rx="9" ry="11" />
                <path class="roof-icon" d="M28 -260 L56 -284 L84 -260" />
              </g>
            </g>
          </g>
        </g>

        <!-- particles and hint twinkles are added here by the script -->
        <g id="fx"></g>
      </g>
    </svg>

    <div id="sunset" class="sunset" aria-hidden="true"></div>
    <div id="evening" class="evening" aria-hidden="true"></div>
    <div id="iris" class="iris" aria-hidden="true"></div>
    <button id="fullscreen" class="corner" type="button" title="Full screen (for the grown-up)" aria-label="Full screen">⤢</button>
  </div>

  <script src="painting.js"></script>
  <script src="sound.js"></script>
  <script src="reksio.js"></script>
  <script src="yard.js"></script>
</body>
</html>
