  synopsis:
    text: 'The mole finds lots of interesting things but has nowhere to carry them. He sees trousers with pockets on a washing line and wants a pair. A flax plant tells him how: he harvests flax, and with the animals'' help turns it into thread (the stork breaks it, it is combed on the hedgehog), cloth (woven by ants), cut pieces (the crayfish) and finally trousers, sewn by a reed warbler.'
