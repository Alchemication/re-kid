notes:
- text: '49 films, made one at a time between 1957 and 2002, all directed by Zdeněk Miler. They were not made as a TV serial: some premiered in cinemas, and Česká televize later showed the shorter ones in its Večerníček bedtime slot (from 1975), in no fixed order. Lengths run from about 5 minutes to about 28; the six long films (1982–1994) were never shown in Večerníček.'
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
  - cs-wikipedia-o-krtkovi
- text: 'Numbering follows cs-wikipedia''s list, by year of production and then alphabetically within a year: the only complete list found. en-wikipedia''s table numbers 43 films in a slightly different order and leaves out the six long ones. They disagree on one year (Krtek a sněhulák: 1997 on cs-wikipedia, 1998 on en-wikipedia) and on most lengths by up to a minute.'
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
  - en-wikipedia-little-mole
- text: Year, director and length follow cs-wikipedia, which cites nothing. The NFA's own records were checked for the first two films and agree on years and director. The other 47 records exist in the NFA's database but could not be read from here.
  status: interpretation
  sources: []
- text: Synopses are English renderings of cs-wikipedia's Czech ones, written for this catalogue. Films without a synopsis there have none here yet.
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
- text: watch_url points at the Krtek / The Mole YouTube channel, which had 31 of the films on 2026-10-15 (all of 1957–1994, none of 1995–2002). The channel is verified by YouTube but does not say who runs it, so whether it is an official upload in this project's sense is unknown. All 49 films are on Stream.cz, but only for viewers in the Czech Republic.
  status: sourced
  sources:
  - krtek-youtube
  - stream-cz-krtek
- text: Besides the 49 films there are 13 one-minute sketches with the mole and the mouse, dated 1998 by cs-wikipedia, published on Stream.cz in 2024 and on the YouTube channel. Who made them is not stated; they are not catalogued here.
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
  - stream-cz-krtek
  - krtek-youtube
