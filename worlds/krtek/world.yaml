id: krtek
title: Krtek
title_en: The Little Mole
country: CZ
summary: Krtek, the Little Mole, is the hero of 49 short Czech cartoons that Zdeněk Miler wrote, designed and directed between 1957 and 2002 at Krátký film Praha's studio Bratři v triku. The films run from about 5 to 28 minutes. Only the first one has speech; after it the mole talks in little exclamations and laughs, which Miler recorded with his young daughters, so the films can be followed by small children anywhere without words. Krtek is a small black mole with a red nose and a few hairs on his head. He lives under a molehill in a meadow, comes up to find things people have left (a toy car, an umbrella, paint tins, a cuckoo clock) and works out what to do with them, often helping a friend or an animal in trouble. His friends include a mouse, a hare and a hedgehog. Czech children knew him from Česká televize's Večerníček bedtime slot from 1975.
production:
  studio:
    text: Krátký film Praha, in its studio for drawn and puppet film, Bratři v triku, with Barrandov laboratories processing the film. The 1975 films carry a line saying they were made for the West German broadcasters Saarländischer Rundfunk and Westdeutscher Rundfunk; cs-wikipedia lists West Germany, then Germany, as co-producing country for films 14–49.
    status: verified
    sources:
    - nfa-krtek-a-auticko
    - nfa-jak-krtek-ke-kalhotkam-prisel
    - krtek-youtube
    - cs-wikipedia-o-krtkovi
  credits:
  - name: Zdeněk Miler
    role: creator, director, screenwriter, visual design
    claim:
      text: Zdeněk Miler (1921–2011, born Zdeněk Müller in Kladno) created the mole, and wrote, designed and directed all 49 films. The NFA credits him as director, writer and art director of the first two films; the end credits of Krtek malířem, Krtek hodinářem and Krtek a buldozer read "Scénář · výtvarník · režie Zdeněk Miler".
      status: verified
      sources:
      - nfa-zdenek-miler
      - nfa-jak-krtek-ke-kalhotkam-prisel
      - nfa-krtek-a-auticko
      - cs-wikipedia-seznam-dilu
      - krtek-youtube
  - name: Ivan Klíma, Eduard Petiška, J. A. Novotný
    role: story (námět), dialogue
    claim:
      text: cs-wikipedia's infobox lists Eduard Petiška, Ivan Klíma and J. A. Novotný for stories. The NFA credits Petiška with the dialogue of the first film; Ivan Klíma is credited for the story (Námět) of Krtek malířem (1972), Krtek hodinářem (1974) and Krtek a buldozer (1975) on their credits.
      status: verified
      sources:
      - cs-wikipedia-o-krtkovi
      - nfa-jak-krtek-ke-kalhotkam-prisel
      - krtek-youtube
  - name: Josef Hekrdla, Jindřich Bárta, Adolf Hamrlík, Ota Kudrnáč and others
    role: animators
    claim:
      text: Teams of six to ten animators per film. Hekrdla and Bárta are credited on the first two films and on films of the 1970s; Hamrlík on Autíčko (1963) and the 1970s films checked; Kudrnáč on the first film and the 1972–1975 films checked.
      status: verified
      sources:
      - nfa-jak-krtek-ke-kalhotkam-prisel
      - nfa-krtek-a-auticko
      - krtek-youtube
  first_year: 1957
  last_year: 2002
  years:
    text: The first film, Jak krtek ke kalhotkám přišel, premiered in Prague cinemas in May 1957. The second, Krtek a autíčko, followed in 1963; then films came one or a few a year until 1975, six long films between 1982 and 1994, and short ones again from 1995 to the last, Krtek a žabka, in 2002.
    status: verified
    sources:
    - nfa-jak-krtek-ke-kalhotkam-prisel
    - nfa-krtek-a-auticko
    - cs-wikipedia-seznam-dilu
  episode_count:
    text: 49 films by cs-wikipedia's list; en-wikipedia says around fifty and tables 43 short ones. Stream.cz carries 49 (43 short, 6 long). There are also 13 one-minute sketches dated 1998, not counted here.
    status: verified
    sources:
    - cs-wikipedia-seznam-dilu
    - en-wikipedia-little-mole
    - stream-cz-krtek
  episode_runtime:
    text: From about 5 to about 28 minutes. The first two run 13 and 15 minutes per the NFA; 1965–1975 films 5–10 minutes; the six films of 1982–1994 about 28 minutes; from 1995 on about 5 minutes. The uploads sampled run 5:48 (Hodinářem), 5:50 (Vejce), 6:15 (Buldozer), 10:04 (Malířem) and 15:12 (Autíčko).
    status: verified
    sources:
    - nfa-jak-krtek-ke-kalhotkam-prisel
    - nfa-krtek-a-auticko
    - cs-wikipedia-seznam-dilu
    - krtek-youtube
  technique:
    text: Drawn (cel) animation in colour, 1.37:1, mono sound, per the NFA. In the films sampled, flat characters with dark outlines move over painted backgrounds, some with visible brush and sponge texture (the forest in Malířem, the meadows in Buldozer).
    status: verified
    sources:
    - nfa-krtek-a-auticko
    - nfa-jak-krtek-ke-kalhotkam-prisel
    - krtek-youtube
  origins:
    text: Miler was asked for a children's film about how flax becomes cloth, wanted an animal hero, and chose a mole, by his account after tripping over a molehill on a walk (cs-wikipedia gives 1954 and says "allegedly"). The first film's working title was Krtek a len (The Mole and the Flax), and the NFA files it as educational as well as a fairy tale.
    status: sourced
    sources:
    - cs-wikipedia-o-krtkovi
    - en-wikipedia-little-mole
    - nfa-jak-krtek-ke-kalhotkam-prisel
viewing_context:
  text: Czech Television shows the shorter films in Večerníček, its evening bedtime cartoon slot, where they first appeared in 1975, in no fixed order; the six long films were never shown there. Earlier, the films were shown in cinemas. How and when they reached Polish television, where Eliot's generation's parents may have seen Krecik, is not yet known.
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
  - cs-wikipedia-o-krtkovi
premise:
  text: A little mole lives under a molehill in a meadow. He comes up into a world full of things he doesn't know (a toy car, an egg, paint tins, a cuckoo clock, a survey pole) and finds out what they are for, often by trying them out wrongly first. Along the way someone needs help (a chick without its mother, the flowers in a bulldozer's path, birds whose nest a fox raids), and he and his animal friends find a way.
  status: sourced
  sources:
  - cs-wikipedia-seznam-dilu
  - krtek-youtube
episode_formula:
  text: 'In the five films sampled (Autíčko 1963, Malířem 1972, Hodinářem 1974, Vejce and Buldozer 1975): the mole comes up from his molehill or wakes in his den; he finds something; the middle is a chain of short attempts or visits, each a few seconds to half a minute (Vejce: he shows the egg to a mouse family, a hare family and a basset hound with puppies, 0:52–1:24, each one shaking its head; Hodinářem: he puts the clock together, tries a feather, then a screwdriver, 2:40–4:36); the problem is solved by cleverness rather than force; and the film ends back home, three of the five closing on an iris shrinking to a circle around him (Vejce 5:28, Hodinářem 5:24, Buldozer 5:48). Autíčko ends with him asleep in his den, as it began (0:44, 15:00).'
  status: observed
  sources:
  - krtek-youtube
  observed_by: claude-frames
opening_sequence:
  text: 'There is no shared title sequence. Each film has its own title and credits, drawn over its own scenery: Autíčko''s over a city park (0:00–0:40), Malířem''s over a forest (0:00–0:32, all credits at the start), Hodinářem''s over the cuckoo clock with the mole popping up behind it (0:08), Buldozer''s a plain red card. The 1970s films open with the distributor''s card "Ústřední půjčovna filmů uvádí".'
  status: observed
  sources:
  - krtek-youtube
  observed_by: claude-frames
tone_and_mood:
  text: Gentle and bright. Peril is real but short (a bulldozer, a fox, a wrecked toy, a trip through a biscuit factory) and always undone by the end. The mole is never cruel; even the people who threaten the meadow are got round, not hurt. Read from the five films sampled and cs-wikipedia's synopses; cs-wikipedia also notes that some films carry an ecological message (Krtek ve městě, Krtek a buldozer).
  status: interpretation
  sources:
  - krtek-youtube
  - cs-wikipedia-o-krtkovi
humour:
  text: 'Mostly from things misused or misunderstood and from transformation. He tries objects in the wrong role (cs-wikipedia: the lollipop as racket, spade and road sign); falls into red paint and becomes a red blob that scares the fox (Malířem 1:44–1:56) and makes him a scary totem with the mouse (3:20–3:28); a feather pushed into the clock comes back as fluff all over him (Hodinářem 3:32–3:52) and a screwdriver comes back as a spring (4:32); he rides inside the egg-tray machinery as eggs become dough and biscuits (Vejce 2:00–4:00). Big reactions on a small body: hands to cheeks, arms flung up, falling flat (Buldozer 5:20–5:24, Autíčko 11:40–11:56).'
  status: observed
  sources:
  - krtek-youtube
  observed_by: claude-frames
themes_and_values:
- text: 'Helping and making things right: he returns the chick to its mother (Vejce), saves his flower bed by rerouting a road rather than fighting it (Buldozer), mends a smashed toy car (Autíčko), and with the animals frightens off a fox that raids nests (Malířem).'
  status: interpretation
  sources:
  - krtek-youtube
  - cs-wikipedia-seznam-dilu
- text: Curiosity about the human world, met with an animal's ingenuity. People and machines mostly appear as large, careless forces (a boy who smashes a toy, a bulldozer, a gardener with poison in Krtek a televizor).
  status: interpretation
  sources:
  - krtek-youtube
  - cs-wikipedia-seznam-dilu
- text: 'Home and friendship: films begin and end at his molehill, and many involve the mouse or other friends.'
  status: interpretation
  sources:
  - krtek-youtube
  - cs-wikipedia-seznam-dilu
characters:
- id: krtek
  name: Krtek (Krteček)
  name_en: The Little Mole
  kind: mole
  role: protagonist
  description:
    text: A small mole who lives under a molehill. In the films sampled he digs up into a meadow, a park or a forest edge, and in Autíčko sleeps in an oval den underground, curled on a white pillow (0:44, 15:00). He makes and fixes things, tends a flower bed by his molehill in Buldozer (0:40–1:04).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  personality:
    text: 'Curious, cheerful, easily delighted and easily upset, quick to help. Clever rather than strong: he wins by digging, rerouting and making, never by fighting.'
    status: interpretation
    sources:
    - krtek-youtube
    - cs-wikipedia-seznam-dilu
  visual_signature:
    text: Head and body are one soft black teardrop that runs into a long snout, pointing forward and a little up, grey with a small red nose at its tip and whiskers; a big white oval eye with a black pupil sits high, near the base of the snout; three or four long thin hairs arch back from the crown; a long dark teal (in some transfers blue-grey) belly patch runs from his throat down his front; big pink hands with four fingers and pink feet. Mostly drawn in three-quarter view or profile; facing us, his two big eyes sit close together at the top, with the small nose below them and a wide smile (Krtek a autíčko 11:36-11:40, 7:12-7:15).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  sound_signature:
    text: 'Short exclamations, squeals and laughs instead of words, recorded by Miler''s young daughters (cs-wikipedia names "hele", "jé", "ach jo"). In the first film he speaks: the NFA credits Petr Kysela as the mole and Viola Zinková as the flax plant, while cs-wikipedia says Zinková voiced the mole. What the voice sounds like, and whether it is the same takes from film to film, needs a listener.'
    status: sourced
    sources:
    - cs-wikipedia-o-krtkovi
    - en-wikipedia-little-mole
    - nfa-jak-krtek-ke-kalhotkam-prisel
  relationships:
