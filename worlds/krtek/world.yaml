rights:
  text: 'Split. The films: the NFA (Národní filmový archiv) is recorded as copyright holder of the first two, and sells their rights through its sales department; the other 47 records were not read. The character: Miler''s heirs. After eight years in court, the estate was settled in 2020: daughter Barbora 40% of the property rights, his widow Emílie and children Kateřina and Michael 20% each. In 2019 the courts had ruled that the licence Miler gave his granddaughter Karolína in 2011, under which her Little Mole company licensed the character, was invalid. Who grants licences for the character today is not known.'
  status: verified
  sources:
  - nfa-jak-krtek-ke-kalhotkam-prisel
  - nfa-krtek-a-auticko
  - ct24-dedictvi-2020
  - radio-prague-rights-2017
  - cs-wikipedia-karolina-milerova
design_notes:
- text: 'The home is the molehill, with the den under it and a flower bed and spring in front (Buldozer''s opening). A day can run as the films do: he wakes in the den, comes up, the day passes, the cricket fiddles at dusk, and he goes down to sleep, closing on an iris to a circle around him: the native ending, as the doghouse is Reksio''s.'
  status: interpretation
  sources:
  - krtek-youtube
- text: 'The verb is find and figure out: a found object he tries in the wrong roles before the right one, then uses to help someone. That suits a toddler''s taps (each tap, the next try) and Eliot''s wish for longer encounters: a chain of three or four tries or visits, as in Vejce and Hodinářem.'
  status: interpretation
  sources:
  - krtek-youtube
  - cs-wikipedia-seznam-dilu
- text: The scene can have two levels, the meadow above and the tunnels below, since the mole travels by digging and pops up anywhere.
  status: interpretation
  sources:
  - krtek-youtube
- text: 'Wordless, like Reksio: the mole''s exclamations carry everything. Whether to use the original voice (as Reksio''s barks) is Adam''s call; it is the character''s signature.'
  status: interpretation
  sources:
  - cs-wikipedia-o-krtkovi
- text: Keep the flat outlined characters over painted textured plates; the cooler geometric drawing belongs to the human world, which can stay at the edges.
  status: interpretation
  sources:
  - krtek-youtube
open_questions:
- Who grants licences for the character since the 2020 settlement, and who runs the Krtek / The Mole YouTube channel?
- Do the NFA's records of the other 47 films also name the NFA as copyright holder? (The site blocks automated reading; Adam can open it.)
- 'Who voiced the mole in the first film: Petr Kysela (NFA) or Viola Zinková (cs-wikipedia)?'
- What does the mole's voice sound like, how often does he use it, and is it the same few takes across films? Needs Adam's ears.
- Is there a recurring musical theme across the composers (Křička, Bukový, Vacek, Petrov and others)? Needs a listener.
- When and how did Krtek reach Polish television, where Eliot knows him as Krecik?
- Who made the 13 one-minute sketches dated 1998?
- Which friends recur most across all 49 films (mouse, hare, hedgehog, frog)? Needs a pass over more films.
