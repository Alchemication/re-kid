places:
- id: molehill
  name: The molehill and the den under it
  description:
    text: 'His home: a heap of earth in a meadow or a park lawn, with a den beneath it (Autíčko 0:44, 15:00). In Buldozer the molehill stands behind a dense bed of tulips and other flowers he tends, near a little spring with a pool where two bullfinches bathe (0:12–1:04); in Autíčko it is among tulips in a city park (1:12–1:24). A car can be parked beside it at night (Autíčko 14:40).'
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
- id: meadow-and-forest
  name: The meadow and the forest
  description:
    text: Painted meadows with tall flowers (bluebells, tulips, daisies), ferns and big old trees; a hollow oak holds the cuckoo clock in Hodinářem (1:08). Night is deep blue with a crescent moon, morning a round orange sun (Buldozer 1:32–1:48).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
- id: human-world
  name: The human world
  description:
    text: 'Where people''s things come from and where peril lives: a city of tower blocks and cars (Autíčko), an egg and biscuit factory (Vejce 1:36–4:20), a building site with survey poles and a bulldozer (Buldozer 2:00–5:12), a cottage yard with paint tins (Malířem 0:28).'
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
aesthetics:
  overview:
    text: Flat, outlined characters with simple solid fills over painted, textured backgrounds. Bright, saturated, natural colours in the meadow; cooler, patterned, geometric drawing for the human world (the tiled factory in Vejce, the checked tower blocks in Autíčko).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  palette:
    text: Meadow greens, sky blue, flower reds and pinks, earth browns; the mole a true black with a red nose, standing out against everything. Night scenes are deep blue with a pale crescent (Buldozer 1:32).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  palette_hex:
  - '#0a0d03'
  - '#9cc0f3'
  - '#4d6d1f'
  - '#80b068'
  - '#38250a'
  - '#c16226'
  - '#f0b976'
  line_and_shape:
    text: Round, soft shapes for animals; the mole is a pear with stubby limbs. Machines and buildings are drawn with straight lines and repeated patterns.
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  backgrounds:
    text: 'Painted plates with texture: dabbed foliage, stippled grass, misty layers of trees behind (Hodinářem, Buldozer). The 1963 Autíčko has flatter, more graphic backgrounds than the 1970s films. In Malířem''s night the forest itself is repainted in pattern (6:40–7:56).'
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  character_animation:
    text: 'Pose to pose: he holds a pose for a few frames, then snaps to the next in about a tenth of a second (from pondering to both arms up in one beat, Krtek a autíčko 11:37.8), with small changes of head angle at each pose. Big gestures on a small body: arms flung wide, hands to the face, the whole body leaning into a look. Animals move as simply as they are drawn.'
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  pacing:
    text: Unhurried. Shots of 3–10 seconds, room to watch him think. Short films stay on one problem; the chain of attempts sets the rhythm.
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
  composition:
    text: Mostly side-on, at the mole's height, with him small in the frame and the world big around him; close-ups for reactions (Autíčko 11:40–11:56).
    status: observed
    sources:
    - krtek-youtube
    observed_by: claude-frames
