# The mole's voice and the far church bell (schema.effects.EffectSet), packed into game/effects.js by
# `main.py effects krtek meadow`. Each sound plays one of its takes at random,
# a little higher or lower each time (sound.js); the bell's two in turn, ding
# then dong, each over the last. The takes are in effects/, as made.
source: 'Made with ElevenLabs sound effects (text to sound) and picked by ear by Adam on the sound board (experiments/sound), 2026-10-15; the bell 2026-10-31.'
effects:
- id: achJo
  takes:
  - file: achJo/01.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "ach jo!".'
