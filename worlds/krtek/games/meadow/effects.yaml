# The mole's voice and the far church bell (schema.effects.EffectSet), packed into game/effects.js by
# `main.py effects krtek meadow`. Each sound plays one of its takes at random,
# a little higher or lower each time (sound.js); the bell's two in turn, ding
# then dong, each over the last. The takes are in effects/, as made.
source: 'Made with ElevenLabs sound effects (text to sound) and picked by ear by Adam on the sound board (experiments/sound), 2026-10-15; the bell 2026-10-31.'
effects:
- id: achJo
  takes:
  - file: achJo/01.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "ach jo!".'
- id: ahoj
  takes:
  - file: ahoj/01.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "ahoj!".'
  - file: ahoj/02.mp3
    prompt: 'Imagine a 1970s Eastern European cartoon animal character who almost never speaks, only makes short excited noises and the odd simple Czech word. We imitate him with a little girl''s voice: delighted, short, rising, breathy, a dry studio recording. The sound is the word "ahoj!", a cheerful hello.'
- id: fright
  takes:
  - file: fright/05.mp3
    prompt: 'Imagine a 1970s Eastern European cartoon animal character who almost never speaks, only makes short excited noises and the odd simple Czech word. We imitate him with a little girl''s voice: delighted, short, rising, breathy, a dry studio recording. The sound is a tiny squeak of fright.'
- id: giggle
  takes:
  - file: giggle/01.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "hihihi!".'
  - file: giggle/02.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "hihihi!".'
  - file: giggle/03.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "hihihi!".'
- id: ooh
  takes:
  - file: ooh/04.mp3
    prompt: 'Imagine a 1970s Eastern European cartoon animal character who almost never speaks, only makes short excited noises and the odd simple Czech word. We imitate him with a little girl''s voice: delighted, short, rising, breathy, a dry studio recording. The sound is an excited little "ooh!" of discovery.'
- id: bell
  gain: 0.35
  overlaps: true
  in_turn: true
  takes:
  - file: bell/24.mp3
    prompt: 'a light friendly ding of a small bell heard faintly across a sunny meadow, soft and short'
  - file: bell/23.mp3
    prompt: 'a light friendly ding of a small bell heard faintly across a sunny meadow, soft and short'
- id: tam
  takes:
  - file: tam/08.mp3
    prompt: 'A little girl says "tam!" as a cartoon animal would: short, breathy, dry studio recording, no reverb.'
- id: gasp
  takes:
  - file: gasp/07.mp3
    prompt: 'A little girl gasps once, a short surprised intake of breath, as a cartoon animal would: breathy, dry studio recording, no reverb.'
  - file: gasp/08.mp3
    prompt: 'A little girl gasps once, a short surprised intake of breath, as a cartoon animal would: breathy, dry studio recording, no reverb.'
  - file: gasp/09.mp3
    prompt: 'A little girl gasps once, a short surprised intake of breath, as a cartoon animal would: breathy, dry studio recording, no reverb.'
- id: hm
