    prompt: 'Imagine a 1970s Eastern European cartoon animal character who almost never speaks, only makes short excited noises and the odd simple Czech word. We imitate him with a little girl''s voice: delighted, short, rising, breathy, a dry studio recording. The sound is a short curious questioning "hm?", rising at the end.'
  - file: hm/05.mp3
    prompt: 'Imagine a 70''s eastern european cartoon animal character. He speaks only simple short words in czechoslovakian language. We try to imitate it by a little girl''s delighted, short, rising, breathy, dry studio recording. The word is "co?", asked, curious and puzzled.'
  - file: hm/08.mp3
