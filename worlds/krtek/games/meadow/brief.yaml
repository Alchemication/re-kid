id: meadow
title: Krtek's meadow (working title)
status: draft
audience: Eliot, about 3, playing with a parent; Adam first, for a rough feel of the day.
length: One day, 08:00 to 20:00 on the meadow's sun, in five minutes of play, as long as a day in Reksio's yard; it ends when the mole goes down to sleep.

pitch:
  text: The child is the little mole in his meadow. He wakes in his den under the molehill and comes up into the morning. Tap the meadow and he waddles there, the view following him along a meadow about two and a half screens wide; tap him and he giggles or says hello. Behind his molehill is his flower bed; further along, a spring pours over a little rock cliff into a pool, with its own life (a frog, dragonflies, a fish, birds coming to drink). Now and then a little rain cloud comes, and he gets it to water a patch of wild flowers. The day passes on its own, the sun crossing the sky whatever he does. At dusk the tulips close, the cricket comes out and fiddles, and the mole settles in his molehill to listen; then he goes down into his molehill, the picture closes in a circle around it, and we see him asleep in his den.
  origin: inspired
  refs: ['world:places[molehill].description', 'world:characters[krtek].moves[pops-up-from-molehill].claim', 'world:characters[krtek].moves[asleep-in-den].claim', 'world:design_notes[0]']

principles:
- text: No text anywhere. The mole talks in little exclamations, never words to read.
  origin: inspired
  refs: [world:sound.dialogue]
- text: The child is the mole, and every tap gets an answer. Nothing to get wrong, no score, no timer.
  origin: invented
- text: Nothing is a goal, and the end never comes as a surprise. The day is the same length whatever the child does. It runs on things that are always in the meadow, never on a thing that may not be out this play (a prop such as the cuckoo clock), so no encounter is ever needed to reach the ending.
  origin: invented
- text: The meadow is wider than the screen, and the view follows him, so going somewhere is part of the fun and there is something to come across on the way. He waddles on the grass; tunnelling is a gag of its own, not his way of getting about (Adam, 2026-10-16) - a tap on a molehill will send him down it and up another, far along.
  origin: inspired
  refs: ['world:characters[krtek].moves[pops-up-from-molehill].claim', 'world:design_notes[2]']
- text: Encounters are chains of tries, longer than the yard's (Eliot found those too short), as in the films. He finds a thing, tries it wrong once or twice, then uses it right to help someone; each tap moves the chain on a step, and any tap still cuts it short cleanly. Built one at a time with new-gag, after the day feels right.
  origin: inspired
  refs: [world:episode_formula, 'world:design_notes[1]']

- text: The meadow is one screen, so its encounters don't stand about from the start. Each arrives at its own hour (about 09:00, 11:00, 13:00 and 15:00), or once the one before is done if that is later, one at a time, and waits; a tap on it sets him going, and left alone a while he goes by himself. Each play brings first one where he helps someone, one where someone helps him and one to discover, as in the yard, then the rest, so every encounter comes in a day (the yard's lesson. children wanted more to happen in five minutes). Left alone, a chain plays on like a little cartoon; a tap on the thing hurries it to its next step, and a tap anywhere else waits for the step he is in (he glances that way), then cuts it short, to be picked up later where it stopped.
  origin: invented

controls:
  text: 'Tap or click: on the meadow, he waddles there; on the mole, an answer with a word (a jump of joy, a wave, peekaboo, a think, a laugh behind his hands); on a butterfly, it flutters off and he looks up after it; on the flower bed, he goes and sniffs a flower; on the spring, he paddles in its pool; on the frog, it plops into the water; on a thing that has come, he goes to it. Keyboard for the grown-up: arrows walk a little way left or right, space does whatever is nearest, any other key gets a word from him.'
  origin: invented

look:
- text: The mole is small in the meadow, drawn in code and never traced, as the 1970s films draw him - slim, about twice as tall as wide, black, a short snout with a round red nose, big white eyes, a grey-green oval on his front, pink human hands with a thumb, pink feet, three hairs on his head. His face acts with his words. an "o" for ooh and a fright, a frown and heavy lids for ach jo, and his hairs spring up when he notices something.
  origin: inspired
  refs: ['world:characters[krtek].visual_signature']
- text: Flat outlined characters over a meadow painted in code in the manner of the films' backgrounds (Krtek a buldozer, a vejce) - a pale blue sky with a wash of cloud; far off, a misty band of pines and sponged round trees; nearer, bushes and trees made of little stars of leaves, fans of long leaves, fern fronds by the spring, bluebells and a tall yellow flower spike behind his molehill; grass in fine strokes with daisies along the front; the flower bed a dense mass of daisies and cornflowers round the tulips. The sky goes from morning blue to dusk orange and night blue, and the night darkens the whole meadow. A round orange sun and a pale crescent moon.
  origin: inspired
  refs: [world:aesthetics.backgrounds, world:aesthetics.palette]
- text: His home is the molehill, with the den under it, his flower bed in front of it and a little spring with a pool beside.
  origin: inspired
  refs: ['world:places[molehill].description']

sound:
- text: The mole's voice is generated, picked by Adam's ear - a giggle, "ahoj", "ach jo", an excited "ooh", a little squeak of fright - played a little higher or lower each time.
  origin: inspired
  refs: ['world:characters[krtek].sound_signature']
- text: The cricket fiddles at dusk, and his tune is the day's lullaby.
  origin: inspired
  refs: ['world:characters[krtek].moves[lies-listening].claim']
- text: The meadow has one theme of its own, recorded (generated, picked by Adam's ear), which turns with what happens, as the films' music does. It plays as the mole comes up in the morning; curious as something arrives; sad at its trouble (a lost egg, the poles marching at his flowers); happy as it comes right. When the fox comes it steps back and the sounds lead. Between the takes a quiet bed plays, in their key and pulse, made from instrument samples - a harp with birdsong in the morning, a little flute now and then, the harp strolling while the child plays, soft violins in the afternoon - and steps back under each take. From dusk the cricket's fiddle plays, quick, rough and a little out of tune, until the circle closes. What it should be and what Adam said of it is in worlds/krtek/MUSIC_DIRECTION.md.
  origin: inspired
  refs: [world:sound.music_role, world:sound.overview]
- text: Small sounds made in the browser for digging, popping up and water, quiet and short.
  origin: invented

scenes:
- id: wake
  action:
    text: Nothing; the play starts.
    origin: invented
  result:
    text: The mole is asleep on his pillow in the den under the molehill. He sits up and stretches both arms, and the view rises to the meadow as he comes up through the top of the molehill and looks about.
    origin: inspired
    refs: ['world:characters[krtek].moves[asleep-in-den].claim', 'world:characters[krtek].moves[pops-up-from-molehill].claim']
  sound:
    text: A yawn, then "ahoj!".
    origin: invented
- id: walk
  action:
    text: Tap the meadow somewhere.
    origin: invented
  result:
    text: He climbs out of his molehill if he is in it and waddles there, getting into his stride on a long trip; the view follows him.
    origin: invented
  sound:
    text: None yet (footsteps to come).
    origin: invented
- id: tap-mole
  action:
    text: Tap the mole.
    origin: invented
  result:
    text: An answer with a word, each in turn and never the same twice running - a jump of joy with his arms flung up, a wave hello, peekaboo (hands over his face, then open wide, laughing), a think with a hand to his chin, a laugh behind his hands.
    origin: inspired
    refs: ['world:characters[krtek].moves[arms-up-cheer].claim']
  sound:
    text: One of his kept voice takes.
    origin: invented
- id: flower-bed
  action:
    text: Tap the flower bed, or the spring.
    origin: invented
  result:
    text: His flower bed stands behind his molehill, low enough that nothing hides behind it (Adam, 2026-10-25). Tapped, he goes over and sniffs a flower, and giggles. Tapped, the spring has him paddle in its pool, splashing.
    origin: invented
  sound:
    text: A giggle; splashes.
    origin: invented
- id: spring
  action:
    text: Nothing, or tap the frog.
    origin: invented
  result:
    text: The spring pours over a little cliff of mossy boulders into a pool with lily pads and reeds (after the spring in Krtek a buldozer's opening, made bigger). Its life is chosen fresh each play and comes and goes - a frog on a lily pad that croaks and plops in, dragonflies that dart in and hover, a fish that leaps, a bullfinch that comes down to drink - with rings spreading on the water. They answer to what goes on round them - the bullfinch comes down because the pool's edge offers a drink, and is off at the church bell, a splash or the car; the dragonflies dart off at a splash; the frog plops in at a splash near it (the fish leaping, the mole paddling) or the car going by. Tapped, the frog plops in, and later climbs back on its pad.
    origin: inspired
    refs: ['world:places[molehill].description']
  sound:
    text: The frog's croak, splashes.
    origin: invented
- id: rain
  action:
    text: Tap the cloud or the drooping flowers, or leave him be.
    origin: invented
  result:
    text: A patch of wild flowers stands in the middle of the meadow; when this encounter's hour comes the sun beats down and they droop, and a small cloud drifts in. He sighs and looks up at it. He blows at it, and it drifts the wrong way, over him, and rains on him. He tries from the other side just as the hare hops by, and it rains on the hare, who shakes the drops all over him. Then he gets right under it and pushes it with both hands over the flowers, and it rains on them - up they stand, one after another - and a rainbow arches over the meadow. The meadow's watering, now and then (Adam's pick of three, 2026-10-25). He helps someone.
    origin: invented
  sound:
    text: His sigh, a whoosh of breath, rain, a splash, his giggle.
    origin: invented
- id: egg
  action:
    text: An egg rolls into the meadow and stops in the grass; the hare hops in and sits nearby, and the hen comes pecking her way in further along. Tap the egg, or leave him be. Then the child chooses whom he shows it to, by tapping the mouse's hole, the hare or the hen.
    origin: invented
  result:
    text: He knocks on it, puts his ear to it, and holds it up over his head, puzzled - whose is it? The mouse pops out of her hole, sniffs, and sneezes so hard the egg wobbles in his hands - not hers. The hare looks, his ears sink, he shakes his head - not his. The hen sees it and comes running, clucking; it hatches in his hands, a chick, and the top of the shell lands on his head like a hat; the chick runs to her and they go off together, and the hare hops home. Each wrong guess can be had again. Left alone, he asks them himself, the mouse, the hare, then the hen. In the film he shows it to a mouse family, a hare family and a hound with puppies before the factory and the hen; the choosing, the sneeze and the hat are ours. He helps someone.
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[carries-overhead].claim', 'world:characters[myska].description', 'world:characters[zajic].description']
  sound:
    text: The egg rolling, a knock knock, his "ooh", the mouse's squeak and sneeze, peeps, the crack and his squeak of fright, a giggle, the hen's bok bok.
    origin: invented
- id: poles
  action:
    text: Far off on the hill a little bulldozer comes puffing, and bullfinches fly in one after another, each with a red-and-white pole in its feet, and drop it so it plants itself, in a line running straight at his flowers; then off they fly. Tap a pole, or leave him be.
    origin: inspired
    refs: [world:episode_formula, 'world:places[molehill].description']
  result:
    text: He knocks on the pole by his flowers and sighs "ach jo". Then he tugs it out and throws it like a javelin - it sails off and plants itself far away up the hill, and the line bends away from his flowers. The next one too. The last is stuck - he tugs and tugs, it pops, he tumbles over backwards, and the pole flies off by itself and lands just where it should. The bulldozer follows the bent line away into the distance, and he cheers. The poles stay out for the rest of the day. In the film he digs a pit for the bulldozer and moves the poles by hand; the throwing and the stuck pole are ours. Something to discover - Eliot's favourite, the "cones".
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[carries-overhead].claim', 'world:characters[krtek].moves[arms-up-cheer].claim']
  sound:
    text: A far rumble, a wooden tok as each pole goes in, a knock knock, his sigh, a tug, a whoosh, his squeak and giggle.
    origin: invented
- id: paint
  action:
    text: The hare and the mouse carry three paint tins in, set them down in the grass between his flowers and the spring, and go off. Tap one, or leave him be.
    origin: inspired
    refs: [world:humour]
  result:
    text: He peers into the red tin and falls in head first, and comes out all red. A grinning fox comes sneaking in past the spring, and he claps his hands to his cheeks. Along come the hare and the mouse with brushes; they paint each other, tiger stripes and spots, and dab spots on him too. Then the three of them climb onto each other's shoulders - a big striped spotted monster with its arms up - and the fox yelps and runs. His friends wave and go, he jumps in the spring to wash the paint off, and the hare and the mouse come back for the tins and carry them off. In the film he paints the whole forest and the fox runs from it; the stacked scary creature is there (Krtek malířem, 3:20), the wash in the spring is ours. Someone helps him.
    origin: inspired
    refs: [world:humour, 'world:characters[myska].description', 'world:characters[zajic].description', 'world:themes_and_values[0]']
  sound:
    text: Tins set down, a splash and his squeak of fright, his "ooh", brushes swished, a giggle, a low cartoon "boo", the fox's yelp, the spring's splash.
    origin: invented
- id: car
  action:
    text: A clockwork toy car comes rolling in backwards from the far end of the meadow, bumps, loses one wheel and then the other, and comes to rest broken in the grass beyond the spring, its wheels beside it. Tap it or a wheel, or leave him be.
    origin: inspired
    refs: [world:episode_formula]
  result:
    text: He knocks on it and goes "ooh". He fetches a wheel and pops it on; the second slips out of his hands and rolls off towards his flowers, and he chases it back. He winds the key on its back, climbs in, and it shoots off backwards, then zooms across the meadow to the spring, turns, and brings him back to park by his molehill, where it stays all day. Once it is mended, a tap on it gives him another ride. In the film a boy smashes the car and the mole has it mended at a car service; mending it himself, the runaway wheel and the backwards start are ours. Something to discover.
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[bounces-on-seat].claim', 'world:characters[krtek].moves[asleep-in-den].claim']
  sound:
    text: A knock knock, his "ooh", a wheel rolling away and his squeak, a pop as each goes on, the key's ratchet, "ahoj", the clockwork whirr, a giggle.
    origin: invented
- id: butterflies
  action:
    text: Nothing, or tap a butterfly.
    origin: invented
  result:
    text: Now and then through the day, one or two butterflies flutter in, wander over the meadow, settle on a flower near them a moment and flutter on - the tulips only while they are open, the wild patch only while it isn't drooping. They keep out of the rain cloud's rain and leave when it drifts over them, fly off from the toy car going by and from a splash near them, and go at sunset. Tapped, one flutters up and away, and the mole looks up after it, hairs springing up - ooh.
    origin: invented
  sound:
    text: His "ooh", now and then.
    origin: invented
- id: snail
  action:
    text: Nothing, or tap the snail.
    origin: invented
  result:
    text: After the rain cloud has rained on the wild flowers, a snail comes up out of the wet grass under their leaves, crawls about near them while the grass stays wet, and goes back down into it as it dries. Tapped, or at the car or a splash, it pulls into its shell a moment and comes out again; tapped, the mole looks at it - ooh.
    origin: invented
  sound:
    text: His "ooh".
    origin: invented
- id: church-bell
  action:
    text: Nothing; the hours pass.
    origin: invented
  result:
    text: Far off on a hill behind the meadow stands a white village church with a red roof, so far away that it hardly moves as he walks, so it is always in sight. On each hour from 09:00 its bell swings in the open belfry and rings twice, ding... dong, rings of sound spreading from it, and the mole, if he is free, looks up at it, hairs springing up. At sunset it rings longer, the evening bell, before the cricket comes out. It is the meadow's sign that the day goes on, as the cuckoo clock is the yard's (Adam, 2026-10-25).
    origin: invented
  sound:
    text: A deep far-off bell, made in the browser, in the meadow music's key.
    origin: invented
- id: dusk
  action:
    text: Nothing; the sun goes down at 19:00.
    origin: invented
  result:
    text: The sky warms to orange, the tulips close, and the cricket comes out by the molehill with his fiddle and plays. Left alone a moment, the mole goes home and settles in his molehill to listen, eyes half shut (in the film he lies on his belly, chin on his hands; a later drawing). Taps still answer.
    origin: inspired
    refs: ['world:characters[krtek].moves[lies-listening].claim']
  sound:
    text: The cricket's tune.
    origin: invented
- id: bedtime
  action:
    text: Nothing; the last hour runs out at 20:00.
    origin: invented
  result:
    text: Through the last hour the picture closes slowly in a circle around the molehill. At 20:00 he yawns, goes down into the molehill, the circle closes, and opens again on him asleep in his den. After that a tap does nothing.
    origin: inspired
    refs: [world:episode_formula, 'world:design_notes[0]']
  sound:
    text: The end of the cricket's tune, a little yawn.
    origin: invented

ending:
  text: He sleeps in his den, as Krtek a autíčko begins and ends. A new play only when a grown-up chooses it.
  origin: inspired
  refs: ['world:characters[krtek].moves[asleep-in-den].claim']

parent_card:
  text: Not written yet. Will say who the mole is, which films the meadow comes from (Buldozer's flower bed, Autíčko's den, the iris ending), and that his voice is ours, not the original.
  origin: invented

open_questions:
- Which encounters come first, and do they follow the yard's rule (each play offers something to discover, someone to help, and a moment when someone helps him)? Eliot's favourites (Adam, 2026-10-15) - traffic cones (the survey poles of Krtek a buldozer), eggs on the factory's conveyor belt (Vejce), the animals painting themselves to scare off the fox (Malířem), and a lot of Krtek a autíčko. Also the cuckoo clock he mends (Hodinářem). Built - the egg, the poles (Eliot's cones are the survey poles), the paint and the car.
- Does a slow-closing circle over the last hour read as "bedtime is coming", or as the game going away?
- Should the molehills he leaves sink by evening, or stay all day as a map of where he has been?
- Which friends visit the meadow - the mouse first?
