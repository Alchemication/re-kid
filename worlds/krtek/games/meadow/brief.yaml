id: meadow
title: Krtek's meadow (working title)
status: draft
audience: Eliot, about 3, playing with a parent; Adam first, for a rough feel of the day.
length: One day, 08:00 to 20:00 on the meadow's sun, in five minutes of play, as long as a day in Reksio's yard; it ends when the mole goes down to sleep.

pitch:
  text: The child is the little mole in his meadow. He wakes in his den under the molehill and comes up into the morning. Tap the meadow and he waddles there, the view following him along a meadow about two and a half screens wide; tap him and he giggles or says hello. Behind his molehill is his flower bed; further along, a spring pours over a little rock cliff into a pool, with its own life (a frog, dragonflies, a fish, birds coming to drink). Now and then a little rain cloud comes, and he gets it to water a patch of wild flowers. The day passes on its own, the sun crossing the sky whatever he does. At dusk the tulips close, the cricket comes out and fiddles, and the mole settles in his molehill to listen; then he goes down into his molehill, the picture closes in a circle around it, and we see him asleep in his den.
  origin: inspired
  refs: ['world:places[molehill].description', 'world:characters[krtek].moves[pops-up-from-molehill].claim', 'world:characters[krtek].moves[asleep-in-den].claim', 'world:design_notes[0]']

principles:
- text: No text anywhere. The mole talks in little exclamations, never words to read.
  origin: inspired
  refs: [world:sound.dialogue]
- text: The child is the mole, and every tap gets an answer. Nothing to get wrong, no score, no timer.
  origin: invented
- text: Nothing is a goal, and the end never comes as a surprise. The day is the same length whatever the child does. It runs on things that are always in the meadow, never on a thing that may not be out this play (a prop such as the cuckoo clock), so no encounter is ever needed to reach the ending.
  origin: invented
- text: The meadow is wider than the screen, and the view follows him, so going somewhere is part of the fun and there is something to come across on the way. He waddles on the grass; tunnelling is a gag of its own, not his way of getting about (Adam, 2026-10-16) - a tap on a molehill will send him down it and up another, far along.
  origin: inspired
  refs: ['world:characters[krtek].moves[pops-up-from-molehill].claim', 'world:design_notes[2]']
- text: Encounters are chains of tries, longer than the yard's (Eliot found those too short), as in the films. He finds a thing, tries it wrong once or twice, then uses it right to help someone; each tap moves the chain on a step, and any tap still cuts it short cleanly. Built one at a time with new-gag, after the day feels right.
  origin: inspired
  refs: [world:episode_formula, 'world:design_notes[1]']

- text: The meadow is one screen, so its encounters don't stand about from the start. Each arrives at its own hour (about 09:00, 11:00, 13:00 and 15:00), or once the one before is done if that is later, one at a time, and waits; a tap on it sets him going, and left alone a while he goes by himself. Each play brings first one where he helps someone, one where someone helps him and one to discover, as in the yard, then the rest, so every encounter comes in a day (the yard's lesson. children wanted more to happen in five minutes). Left alone, a chain plays on like a little cartoon; a tap on the thing hurries it to its next step, and a tap anywhere else waits for the step he is in (he glances that way), then cuts it short, to be picked up later where it stopped.
  origin: invented

controls:
  text: 'Tap or click: on the meadow, he waddles there; on the mole, an answer with a word (a jump of joy, a wave, peekaboo, a think, a laugh behind his hands); on a butterfly, it flutters off and he looks up after it; on the flower bed, he goes and sniffs a flower; on the spring, he paddles in its pool; on the frog, it plops into the water; on a thing that has come, he goes to it. Keyboard for the grown-up: arrows walk a little way left or right, space does whatever is nearest, any other key gets a word from him.'
  origin: invented

look:
- text: The mole is small in the meadow, drawn in code and never traced, as the 1970s films draw him - slim, about twice as tall as wide, black, a short snout with a round red nose, big white eyes, a grey-green oval on his front, pink human hands with a thumb, pink feet, three hairs on his head. His face acts with his words. an "o" for ooh and a fright, a frown and heavy lids for ach jo, and his hairs spring up when he notices something.
  origin: inspired
  refs: ['world:characters[krtek].visual_signature']
- text: Flat outlined characters over a meadow painted in code in the manner of the films' backgrounds (Krtek a buldozer, a vejce) - a pale blue sky with a wash of cloud; far off, a misty band of pines and sponged round trees; nearer, bushes and trees made of little stars of leaves, fans of long leaves, fern fronds by the spring, bluebells and a tall yellow flower spike behind his molehill; grass in fine strokes with daisies along the front; the flower bed a dense mass of daisies and cornflowers round the tulips. The sky goes from morning blue to dusk orange and night blue, and the night darkens the whole meadow. A round orange sun and a pale crescent moon.
  origin: inspired
  refs: [world:aesthetics.backgrounds, world:aesthetics.palette]
- text: His home is the molehill, with the den under it, his flower bed in front of it and a little spring with a pool beside.
  origin: inspired
  refs: ['world:places[molehill].description']

sound:
- text: The mole's voice is generated, picked by Adam's ear - a giggle, "ahoj", "ach jo", an excited "ooh", a little squeak of fright, a gasp, a questioning "hm?" or "co?", and "tam!" - played a little higher or lower each time. When something arrives and he is free, he points at it, "tam!". At a sudden surprise he gasps or squeaks, one or the other; wondering, he asks "hm?". Just after his morning "ahoj!" a tap on him never brings a second hello (Adam, 2026-10-31).
  origin: inspired
  refs: ['world:characters[krtek].sound_signature']
- text: The cricket fiddles at dusk, and his tune is the day's lullaby.
  origin: inspired
  refs: ['world:characters[krtek].moves[lies-listening].claim']
- text: The meadow has one theme of its own, recorded (generated, picked by Adam's ear), which turns with what happens, as the films' music does. It plays as the mole comes up in the morning; curious as something arrives; sad at its trouble (a lost egg, the poles marching at his flowers); happy as it comes right. When the fox comes it steps back and the sounds lead. Between the takes a quiet bed plays, in their key and pulse, made from instrument samples - a harp with birdsong in the morning, a little flute now and then, the harp strolling while the child plays, soft violins in the afternoon - and steps back under each take. From dusk the cricket's fiddle plays, quick, rough and a little out of tune, until the circle closes. What it should be and what Adam said of it is in worlds/krtek/MUSIC_DIRECTION.md.
  origin: inspired
  refs: [world:sound.music_role, world:sound.overview]
- text: Small sounds made in the browser for digging, popping up and water, quiet and short.
  origin: invented

scenes:
- id: wake
  action:
    text: Nothing; the play starts.
    origin: invented
  result:
    text: The mole is asleep on his pillow in the den under the molehill. He sits up and stretches both arms, and the view rises to the meadow as he comes up through the top of the molehill and looks about.
    origin: inspired
    refs: ['world:characters[krtek].moves[asleep-in-den].claim', 'world:characters[krtek].moves[pops-up-from-molehill].claim']
  sound:
    text: A yawn, then "ahoj!".
    origin: invented
- id: walk
  action:
    text: Tap the meadow somewhere.
    origin: invented
  result:
    text: He climbs out of his molehill if he is in it and waddles there, getting into his stride on a long trip; the view follows him.
    origin: invented
  sound:
    text: None yet (footsteps to come).
    origin: invented
- id: tap-mole
  action:
    text: Tap the mole.
    origin: invented
  result:
    text: An answer with a word, each in turn and never the same twice running - a jump of joy with his arms flung up, a wave hello, peekaboo (hands over his face, then open wide, laughing), a think with a hand to his chin, a laugh behind his hands.
    origin: inspired
    refs: ['world:characters[krtek].moves[arms-up-cheer].claim']
  sound:
    text: One of his kept voice takes.
    origin: invented
- id: flower-bed
  action:
    text: Tap the flower bed, or the spring.
    origin: invented
  result:
    text: His flower bed stands behind his molehill, low enough that nothing hides behind it (Adam, 2026-10-25). Tapped, he goes over and sniffs a tulip, a different way each time, all of them before any comes again (the yard's lesson, that repeats need variety, 2026-10-30). A sniff, a giggle and a jump of joy. Or a long sniff, and he turns to us with his eyes shut, swaying with the scent, and an ooh. Or he goes along the bed, a quick sniff at one tulip after another, and a jump of joy at the last. Tapped, the spring has him paddle in its pool, splashing, also a different way each time. A splash and a giggle. Or one splash too big, all over his face; eyes screwed shut, a shake, and a laugh behind his hands. And while the frog sits on its lily pad, he goes in gently so as not to scare it; it plops in anyway, right beside him, and splashes him, and after a start he jumps for joy.
    origin: invented
  sound:
    text: A giggle; splashes.
    origin: invented
- id: spring
  action:
    text: Nothing, or tap the frog.
    origin: invented
  result:
    text: The spring pours over a little cliff of mossy boulders into a pool with lily pads and reeds (after the spring in Krtek a buldozer's opening, made bigger). Its life is chosen fresh each play and comes and goes - a frog on a lily pad that croaks and plops in, dragonflies that dart in and hover, a fish that leaps, a bullfinch that comes down to drink - with rings spreading on the water. They answer to what goes on round them - the bullfinch comes down because the pool's edge offers a drink, and is off at the church bell, a splash or the car; the dragonflies dart off at a splash; the frog plops in at a splash near it (the fish leaping, the mole paddling) or the car going by. Tapped, the frog plops in, and later climbs back on its pad.
    origin: inspired
    refs: ['world:places[molehill].description']
  sound:
    text: The frog's croak, splashes.
    origin: invented
- id: rain
  action:
    text: Tap the cloud or the drooping flowers, or leave him be.
    origin: invented
  result:
    text: A patch of wild flowers stands in the middle of the meadow; when this encounter's hour comes the sun beats down and they droop, and a small cloud drifts in. He sighs and looks up at it. He blows at it, and it drifts the wrong way, over him, and rains on him. He tries from the other side just as the hare hops by, and it rains on the hare, who shakes the drops all over him. Then he gets right under it and pushes it with both hands over the flowers, and it rains on them - up they stand, one after another - and a rainbow arches over the meadow. The meadow's watering, now and then (Adam's pick of three, 2026-10-25). He helps someone.
    origin: invented
  sound:
    text: His sigh, a whoosh of breath, rain, a splash, his giggle.
    origin: invented
- id: egg
  action:
    text: An egg rolls into the meadow and stops in the grass; the hare hops in and sits nearby, and the hen comes pecking her way in further along. Tap the egg, or leave him be. Then the child chooses whom he shows it to, by tapping the mouse's hole, the hare or the hen.
    origin: invented
  result:
    text: He knocks on it, puts his ear to it, and holds it up over his head, puzzled - whose is it? The mouse pops out of her hole, sniffs, and sneezes so hard the egg wobbles in his hands - not hers. The hare looks, his ears sink, he shakes his head - not his. The hen sees it and comes running, clucking; it hatches in his hands, a chick, and the top of the shell lands on his head like a hat; the chick runs to her and they go off together, and the hare hops home. Each wrong guess can be had again. Left alone, he asks them himself, the mouse, the hare, then the hen. In the film he shows it to a mouse family, a hare family and a hound with puppies before the factory and the hen; the choosing, the sneeze and the hat are ours. He helps someone.
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[carries-overhead].claim', 'world:characters[myska].description', 'world:characters[zajic].description']
  sound:
    text: The egg rolling, a knock knock, his "ooh", the mouse's squeak and sneeze, peeps, the crack and his squeak of fright, a giggle, the hen's bok bok.
    origin: invented
- id: poles
  action:
    text: A rumble - far off, a tiny bulldozer comes out from behind the church on its hill and winds down the slope, tearing a road in switchbacks, into the far trees. Then, small at the meadow's far edge, it comes over it and down its own winding road towards us, the road torn up behind it with sand heaped along its edges, growing until it stands half as tall again as him, puffing, its lilac blade shoving a heap of earth, and turns round to face his flowers. Each play's road winds its own way. From a rack on its back it shoots red-and-white poles, one by one, that arc over and stick in the ground in a line running straight at his flowers. It won't wait for a tap - he drops what he is doing and hurries over to see (Adam, 2026-11-01. The tiny bulldozer far off could not be spotted and did no harm, birds carrying the poles in looked ridiculous, and at twice his height it filled the screen).
    origin: inspired
    refs: [world:episode_formula, 'world:places[molehill].description']
  result:
    text: He knocks on the pole by his flowers - hm? Then he looks up at the bulldozer, puffing at the end of the line, and claps his hands to his face. He tugs out the pole nearest the bulldozer and throws it like a javelin - it sails off and plants itself far away up the hill, and the line bends away from his flowers - and the bulldozer lurches on. The next one too. Then it rolls at the last pole, the one by his flowers - he dives into the ground in its path and digs a pit, and it nose-dives in, stuck, tracks shuddering and puffing hard. While it is stuck he tugs at the last pole - it is stuck too, it pops, he tumbles over backwards, and the pole flies off by itself and lands just where it should. The bulldozer backs out and goes back up its road, smaller and smaller, and over the far edge, and he cheers. Its track, the pit and its heap of earth green over in about a minute; the poles stay out for the rest of the day. As in the film - the bulldozer pushing earth, the pit it falls into, the poles moved to bend the road (Krtek a buldozer 4:03-4:37); the throwing and the stuck pole are ours. Something to discover - Eliot's favourite, the "cones".
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[carries-overhead].claim', 'world:characters[krtek].moves[arms-up-cheer].claim']
  sound:
    text: A wooden tok as each pole goes in, a knock knock, his "hm", the bulldozer's rumble, his gasp and sigh, a tug, a whoosh, digging, a crack as it nose-dives, his giggle and squeak.
    origin: invented
- id: paint
  action:
    text: The hare and the mouse carry three paint tins in, set them down in the grass between his flowers and the spring, and go off. Tap one, or leave him be.
    origin: inspired
    refs: [world:humour]
  result:
    text: A story, told as in the film - the fox first, the paint by accident (Adam, 2026-11-01. It must read as a story, with progression and variety). He comes to the tins, curious, and knocks on the red one. The fox's long shadow slides over the grass, then the fox sneaks in for the bullfinch's nest on the spring's rocks - big, up on his hind legs, on tiptoe or creeping low (each play draws which), snickering and rubbing his paws, licking his lips - while the chicks huddle in the nest, trembling and peeping the alarm. The mole points at him (tam!); the fox rears up bigger still over the nest, paws up and teeth bared, and growls, and the mole claps his hands to his face. Backing away, he tumbles into the red tin and comes out all red. All red, he plays a ghost at the fox, arms out, "uuuu!" - the fox jumps, peers closer and laughs. Along come the hare and the mouse with brushes; they paint each other, tiger stripes and spots, and dab spots on him too, and the three of them climb onto each other's shoulders - a big striped spotted monster with its arms up. The fox, shocked, shrinks small and hunched, his ruff on end, yelps and runs. His friends wave and go, and he jumps in the spring to wash the paint off. The tins stay. Tapped again, the story comes again, quicker - the fox back, the mole red again, and this time the hare and the mouse come painted and play ghost with him, and that does it. Then the fox runs, or, about half the time, small and found out, he is sorry - eyes down, a bow - the mouse dabs spots on him, he laughs, and he goes off with them, a friend (Adam's idea, the film's ending turned round). Then the hare and the mouse carry the tins off. His face acts after the film's - sly, laughing with his eyes squeezed shut, snarling, shocked, scared (Krtek malířem 1:01-1:53) - and ours, sorry. In the film he falls in the paint by accident and the red blob frightens the fox; he paints the whole forest and the fox runs from it, and the stacked scary creature is there (Krtek malířem, 3:20). The ghost, the wash in the spring and the fox made a friend are ours. Someone helps him.
    origin: inspired
    refs: [world:humour, 'world:characters[myska].description', 'world:characters[zajic].description', 'world:themes_and_values[0]']
  sound:
    text: Tins set down and knocked on, the fox's sly snicker, the chicks' alarm peeps, his "tam!", the fox's low growl, his squeak of fright, a splash, his "ooh", his pretend-ghost "uuuu", brushes swished, a giggle, a low cartoon "boo", the fox's yelp, the spring's splash.
    origin: invented
- id: nest
  action:
    text: Nothing. The bullfinch's nest sits on the spring's top boulder all day.
    origin: invented
  result:
    text: Three chicks bob up and peep now and then by day, quietly, never in an eclipse. When the fox comes for them (the paint) they huddle up, trembling and peeping the alarm, and settle once he has run. In Krtek malířem the fox raids a birds' nest in a tree; the nest on the spring's rocks, with the spring's bullfinch as its mother, is ours.
    origin: invented
    refs: ['world:themes_and_values[0]']
  sound:
    text: The chicks' soft peeps, made in the browser.
    origin: invented
- id: car
  action:
    text: A clockwork toy car comes rolling in backwards from the far end of the meadow, bumps, loses one wheel and then the other, and comes to rest broken in the grass beyond the spring, its wheels beside it. Tap it or a wheel, or leave him be.
    origin: inspired
    refs: [world:episode_formula]
  result:
    text: He knocks on it and goes "ooh". He fetches a wheel and pops it on; the second slips out of his hands and rolls off towards his flowers, and he chases it back. He winds the key on its back, climbs in, and it shoots off backwards, then zooms across the meadow to the spring, turns, and brings him back to park by his molehill, where it stays all day. Once it is mended, a tap on it gives him another ride. In the film a boy smashes the car and the mole has it mended at a car service; mending it himself, the runaway wheel and the backwards start are ours. Something to discover.
    origin: inspired
    refs: [world:episode_formula, 'world:characters[krtek].moves[bounces-on-seat].claim', 'world:characters[krtek].moves[asleep-in-den].claim']
  sound:
    text: A knock knock, his "ooh", a wheel rolling away and his squeak, a pop as each goes on, the key's ratchet, "ahoj", the clockwork whirr, a giggle.
    origin: invented
- id: butterflies
  action:
    text: Nothing, or tap a butterfly.
    origin: invented
  result:
    text: Now and then through the day, one or two butterflies flutter in, wander over the meadow, settle on a flower near them a moment and flutter on - the tulips only while they are open, the wild patch only while it isn't drooping. They keep out of the rain cloud's rain and leave when it drifts over them, fly off from the toy car going by and from a splash near them, and go at sunset. Tapped, one flutters up and away, and the mole looks up after it, hairs springing up - ooh. Now and then one comes over to look at him while he stands free, flutters about his head, and he follows it with his eyes, his face lighting up; it never lands on him.
    origin: invented
  sound:
    text: His "ooh", now and then.
    origin: invented
- id: fireflies
  action:
    text: Nothing, or tap a firefly.
    origin: invented
  result:
    text: As the light goes, at dusk while he lies listening to the cricket, or in an eclipse's dim, a few fireflies rise out of the grass about him and drift slowly low over the meadow, each glowing and fading in its own time. As the light comes back, or at bedtime as the circle closes, each settles back into the grass and goes out. Tapped, one glows bright and drifts off a little way, and he looks at it - ooh. Added to keep the end of the day the calmest part of it (Adam, 2026-10-31, that the games calm and soothe); not from the films.
    origin: invented
  sound:
    text: None of their own.
    origin: invented
- id: wildlife
  action:
    text: Nothing, or tap the animals far off.
    origin: invented
  result:
    text: Far off along the meadow's far edge, small, so they never take the eye from what happens in front (Adam, 2026-11-01), one kind of animal a play comes out now and then at its own hours, walks along, stops to graze and goes - roe deer in the morning and evening (a doe with a fawn or two, or a few with a buck; the fawns hop about their mother; they stop to drink at the far pond), wild boar from the afternoon (a sow with a line of striped piglets that pair off to wrestle, or a male alone), the żubr about midday (a bull alone, or a cow with her calf). Now and then they wander a little nearer. Heads go down to graze and up to look about; the church bell has them all look up. Tapped, deer and boar look up, then make off; the żubr only turns and looks, chewing. The bulldozer's rumble, the car and thunder send them off (the żubr only for the big ones). Adam asked for them to make the world truly alive; none of them is from the films.
    origin: invented
  sound:
    text: None of their own yet.
    origin: invented
- id: far-birds
  action:
    text: Nothing, or tap a bird.
    origin: invented
  result:
    text: A few small red-breasted finches live in the trees along the meadow's far edge all day, sitting a while in one crown, then flitting to another. The bulldozer's rumble, the car and thunder send them all up and away; once it has been quiet a while they come back by ones and twos, so the child sees the meadow is all right again. Tapped, one flies off, and comes back later with the others.
    origin: invented
  sound:
    text: None of their own yet.
    origin: invented
- id: heron
  action:
    text: Nothing, or tap the heron.
    origin: invented
  result:
    text: A little pond with reeds lies at the meadow's far edge behind his home. Now and then a grey heron flies in on slow wingbeats and stands at its edge, still as a post; every so often it leans and stabs at the water, sometimes coming up with a little silver fish, gone in a gulp. It flies off after a while, or at a tap, the bulldozer, the car or thunder. Adam's idea (2026-11-01, "a distant bird might be a heron").
    origin: invented
  sound:
    text: None of its own yet.
    origin: invented
- id: storm
  action:
    text: Nothing; then tap a friend, or the umbrella, or leave him be.
    origin: invented
  result:
    text: One play in four, instead of the little rain cloud and never on an eclipse's day, big grey clouds roll in, the wind gets up and the light dims a little. Whatever he is doing, he stops at once (weather will not wait for a tap. Adam, 2026-10-31), gasps with his hands to his cheeks, then - ach jo - hurries down into his den and comes up with his umbrella, takes it out to the open grass past his flowers, plants it and up it pops. The rain comes over the whole meadow, with thunder far off behind the hill, soft. The mouse, the hare and the hen come running through it and stand near, dripping and glum. The child picks whom he waves in (ahoj!), and in each one runs under the umbrella; left alone he waves them in himself. The hen squeezes in last, they shuffle, and he is squeezed out into the rain (ach jo); down he goes and pops up in a new molehill right in the middle, under the umbrella. The rain stops, they shake off the drops, a rainbow, they nod and go home, and he closes the umbrella, which stays planted there all day. No rain falls under it. In the film the mole and the animals shelter under his umbrella when it rains at the end; the storm, the squeeze and the molehill are ours. He helps someone.
    origin: inspired
    refs: ['episode:krtek-a-paraplicko', 'world:characters[krtek].moves[pops-up-from-molehill].claim', 'world:characters[myska].description', 'world:characters[zajic].description']
  sound:
    text: His "ach jo", "ooh", "ahoj" and giggle; the rain's patter; a far, soft rumble after each faint flash; the umbrella's pop; a squeak as they shuffle; drops shaken off.
    origin: invented
- id: wind
  action:
    text: Nothing; the wind blows.
    origin: invented
  result:
    text: A light breeze comes and goes all day, now and then a gust, and drops at sunset. The tulips, the wild flowers, the reeds at the pool and tufts of long grass along the front lean further in a gust, and his three hairs flutter. Butterflies are blown off their way. Now and then a strong gust carries a few leaves or dandelion seeds across the meadow, in from out of sight and off out of sight, and the mole, if he is free, turns to watch them go by. Not checked against the films (Adam's pick, 2026-10-26).
    origin: invented
  sound:
    text: The wind, very quiet, louder and a little higher in a gust.
    origin: invented
- id: eclipse
  action:
    text: Nothing, or tap the sun.
    origin: invented
  result:
    text: Some plays, once, around midday, the moon slides over the sun. The light falls to about dusk for a while, never to night, while the hour goes on as ever, and everything that answers to the light behaves as at dusk - the tulips close, the butterflies and the birds go home, the wind eases, and the cricket comes out and fiddles. The mole looks up at it - ooh. A tap on the sun has him call up to it and wave (ahoj!); it comes back in its own time. Then the sun comes out, the tulips open, the cricket goes in and the meadow's life comes back. Not from the films (Adam's pick, 2026-10-26).
    origin: invented
  sound:
    text: The music steps back; one take of the cricket's fiddle; his "ooh" and "ahoj".
    origin: invented
- id: snail
  action:
    text: Nothing, or tap the snail.
    origin: invented
  result:
    text: After the rain cloud has rained on the wild flowers, a snail comes up out of the wet grass under their leaves, crawls about near them while the grass stays wet, and goes back down into it as it dries. Tapped, or at the car or a splash, it pulls into its shell a moment and comes out again; tapped, the mole looks at it - ooh.
    origin: invented
  sound:
    text: His "ooh".
    origin: invented
- id: church-bell
  action:
    text: Nothing; the hours pass.
    origin: invented
  result:
    text: Far off on a hill behind the meadow stands a white village church with a red roof, so far away that it hardly moves as he walks, so it is always in sight, standing on the hill's level top among a few bushes, a path winding down from its door. An old clock on its tower, its face yellowed with age, tells the play's own hour (a small player asked for one, 2026-11-02). On each hour from 09:00 its bell swings in the open belfry and rings twice, ding... dong, rings of sound spreading from it, and the mole, if he is free, looks up at it, hairs springing up. At sunset it rings longer, the evening bell, before the cricket comes out. It is the meadow's sign that the day goes on, as the cuckoo clock is the yard's (Adam, 2026-10-25).
    origin: invented
  sound:
    text: A light little bell far off, two recorded takes picked by Adam (2026-10-31) rung in turn, the brighter first, ding... dong, each fading quickly into the next. Quiet, there and gently gone, never ominous.
    origin: invented
- id: dusk
  action:
    text: Nothing; the sun goes down at 19:00.
    origin: invented
  result:
    text: The sky warms to orange, the tulips close, and the cricket comes out by the molehill with his fiddle and plays. Left alone a moment, the mole goes home and settles in his molehill to listen, eyes half shut (in the film he lies on his belly, chin on his hands; a later drawing). Taps still answer.
    origin: inspired
    refs: ['world:characters[krtek].moves[lies-listening].claim']
  sound:
    text: The cricket's tune.
    origin: invented
- id: bedtime
  action:
    text: Nothing; the last hour runs out at 20:00.
    origin: invented
  result:
    text: Through the last hour the picture closes slowly in a circle around the molehill. At 20:00 he yawns, goes down into the molehill, the circle closes, and opens again on him asleep in his den. After that a tap, a held press or a key does nothing; a small sun in the corner, held for two seconds, starts a new day, for the grown-up (as in Reksio's yard; a tester found a held press anywhere woke him, 2026-10-30).
    origin: inspired
    refs: [world:episode_formula, 'world:design_notes[0]']
  sound:
    text: The end of the cricket's tune, a little yawn.
    origin: invented

ending:
  text: He sleeps in his den, as Krtek a autíčko begins and ends. A new play only when a grown-up chooses it.
  origin: inspired
