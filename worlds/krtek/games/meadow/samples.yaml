instruments:
# Harp: the meadow bed's plucked notes, soft and pastoral (worlds/krtek/MUSIC_DIRECTION.md: calm, close to nature).
- id: harp
  library: vsco2ce
  max_seconds: 2.4
  files:
  - Strings/Harp/KSHarp_B1_mf.wav
  - Strings/Harp/KSHarp_E3_mf.wav
  - Strings/Harp/KSHarp_B3_mf.wav
  - Strings/Harp/KSHarp_E5_mf.wav
  - Strings/Harp/KSHarp_B5_mf.wav
# Flute, held with vibrato: the bed's little melodic turns (the films' flute over strings).
- id: flute
  library: vsco2ce
  max_seconds: 1.6
  gain: 0.8
  files:
  - Woodwinds/Flute/expvib/LDFlute_expvib_E4_v1_1.wav
