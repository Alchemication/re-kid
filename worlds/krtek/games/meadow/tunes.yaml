# Recorded music for the meadow (schema.tunes.TuneSet), packed into
# game/tunes.js by `main.py tunes`. music.js plays a random take of a part
# when it comes: the meadow's theme as he wakes, the theme's moods in an
# encounter (curious, sad, happy), the cricket's fiddle from dusk. The takes
# are in tunes/, as made; written by experiments/music/adopt.py from Adam's
# picks on the music board (worlds/krtek/MUSIC_DIRECTION.md).
source: 'Made with ElevenLabs Music (text to music, Starter plan, which allows commercial use) and picked by ear by Adam on the music board (experiments/music). Our own tunes, inspired by the era, not copied from the cartoon.'
tunes:
- id: morning
  takes:
  - file: morning/01.mp3
    prompt: 'A calm, beautiful instrumental theme for a sunny meadow morning in a 1970s Eastern European children''s animated film: a gentle flute melody over soft strings, with birdsong, warm and positive, simple and tender, as a small creature comes out to greet the day.'
    model: music_v1
    song: F6cJ73OJz2rTa7FCDdpe
- id: morning
  season: autumn
  takes:
  - file: morning-autumn/01.mp3
    prompt: 'A calm, beautiful instrumental theme for a misty golden autumn morning in a meadow in a 1970s Eastern European children''s animated film: a gentle, slightly wistful flute melody over warm soft strings and a mellow clarinet, chestnut leaves drifting down, tender and cosy, as a small creature comes out into the cool morning.'
    model: music_v1
    song: AGwdO3Sel6DBqS5lFRls
- id: curious
  takes:
  - file: curious/01.mp3
    prompt: 'Composition plan conditioned on experiments/music meadow-theme/01 (medium): the same gentle meadow theme, now curious and inquisitive: lighter, a little quicker, plucked strings and a questioning flute, as a small creature finds something new'
