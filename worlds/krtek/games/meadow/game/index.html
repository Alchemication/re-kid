<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Krtek</title>
  <link rel="icon" href="data:,"><!-- no icon: keeps the browser from asking for one -->
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <!-- The meadow is 4000 by 900 scene units; a screen shows 1600 of it (a
       wider or narrower screen a little less sky, or less at the sides), and
       the view follows the mole (view.js): the sky stays, the far trees
       (#far-view) scroll at half speed, everything on the ground (#cam) with
       the view. Everything but the den is inside the circle (#iris) that
       closes round the molehill at the end of the day. -->
  <svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Krtek in his meadow">
    <defs>
      <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c9dcf2" />
        <stop offset="1" stop-color="#f4e3c2" />
      </linearGradient>
      <mask id="iris" maskUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1300">
        <rect x="-200" y="-200" width="2000" height="1300" fill="#000" />
        <circle id="iris-circle" cx="800" cy="630" r="10000" fill="#fff" />
      </mask>
    </defs>

    <g mask="url(#iris)">
      <g id="sky">
        <rect x="-200" y="-200" width="2000" height="1000" fill="url(#sky-grad)" />
        <g id="sun"><circle r="58" fill="#f08a2c" /><circle r="58" fill="none" stroke="#f6b25a" stroke-width="6" opacity="0.6" /><clipPath id="sun-disc"><circle r="58" /></clipPath><circle id="eclipse-moon" r="58" fill="#2e3150" clip-path="url(#sun-disc)" visibility="hidden" /></g><!-- the moon slides over it in an eclipse (eclipse.js) -->
        <g id="moon"><path d="M0 -42 A42 42 0 1 0 0 42 A32 32 0 1 1 0 -42 Z" fill="#f4f1d8" /></g>
      </g>
      <g id="distant-view"><g id="distant"></g></g>
      <g id="far-view"><g id="far"></g></g>
      <g id="cam">
      <g id="back">
        <g id="beyond"></g><!-- over the meadow's far edge: what comes up over it, or goes away behind it (poles.js) -->
        <g id="back-ground"><path d="M-200 640 C200 600 500 630 800 612 S1300 600 1800 630 S2600 612 3000 626 S3800 604 4200 630 V900 H-200 Z" fill="#a3cc82" /></g>
        <g id="far-things"></g>
        <g id="oak"></g><!-- the old oak at the left end, its hollow and the acorns kept in it (oak.js) -->
        <g id="rocks"></g>
        <g id="spring"></g><!-- the spring, its waterfall and pool, and their life: spring.js -->
        <g id="bed"></g>
        <g id="garden"></g><!-- the painter's cottage and garden, painted (painting.js), at the right end -->
        <g id="garden-life" transform="translate(0 -28)"></g><!-- who is about in the garden, behind the fence: the hen, the hare (fence.js); up at the fence's foot, so it hides their feet -->
        <g id="fence"></g><!-- the paling fence along the back, and the twig (fence.js) -->
        <g id="low-critters"></g><!-- behind the front grass: the snail comes up out of it (critters.js) -->
      </g>
      <g id="mole"></g>
      <g id="front">
        <g id="front-ground"><path d="M-200 718 C300 712 700 724 1000 716 S1500 712 1800 720 S2700 726 3100 716 S3800 714 4200 720 V900 H-200 Z" fill="#86bb60" /></g>
      </g>
      <g id="top">
        <g id="tunnels"></g>
        <g id="things"></g>
        <g id="oak-ground"></g><!-- the oak leaves shaken off his head, lying where they fell (oak.js) -->
        <g id="mole-out"></g>
        <g id="oak-front"></g><!-- in front of him: the hollow's dark as he goes in, falling acorns (oak.js) -->
        <g id="friends"></g>
        <g id="fence-near"></g><!-- the fence's corner coming towards us: in front of visitors coming in from the right (fence.js) -->
        <g id="critters"></g>
        <g id="drops"></g>
        <g id="crickets"></g><!-- the cricket and his burrow (cricket.js) -->
      </g>
      </g>
      <!-- night falling over the whole meadow, deepening as the sky darkens (meadow.js drawSky), as the films' night goes deep blue -->
      <rect id="night" x="-200" y="-200" width="2000" height="1300" fill="#1c2766" opacity="0" style="mix-blend-mode: multiply; pointer-events: none" />
      <g id="glow-view"><g id="glows"></g></g><!-- the fireflies (critters.js): over the night, so they shine in it; it scrolls with the ground (view.js) -->
    </g>

    <!-- His den under the molehill, where the day begins and ends, as Krtek a autíčko opens and closes -->
    <g id="den"></g><!-- drawn by den.js -->
  </svg>
  <canvas id="rain" aria-hidden="true"></canvas><!-- a storm's rain, over the picture (storm.js) -->

  <!-- A phone held upright shows the meadow too small to play: instead, a
       picture asks (without words) to turn it on its side, and the game
       waits (turn.js). The little meadow in the phone is upright once the
       phone is turned. -->
  <div id="turn" class="turn" hidden>
    <svg viewBox="30 20 140 150" role="img" aria-label="Turn the phone on its side">
      <path class="turn-arrow" d="M150 58 A62 62 0 0 0 58 46" />
      <path class="turn-arrow-head" d="M66 34 L54 47 L71 54 Z" />
      <g class="turn-phone">
        <rect class="turn-body" x="68" y="48" width="64" height="112" rx="10" />
        <g transform="rotate(90 100 104)">
          <rect class="turn-sky" x="54" y="80" width="92" height="34" />
          <rect class="turn-ground" x="54" y="114" width="92" height="14" />
          <path class="turn-hill" d="M88 118 Q100 104 112 118 Z" />
          <circle class="turn-mole" cx="100" cy="104" r="7" />
          <circle class="turn-eye" cx="97.5" cy="102" r="2" />
          <circle class="turn-eye" cx="102.5" cy="102" r="2" />
          <circle class="turn-nose" cx="100" cy="106.5" r="1.6" />
        </g>
      </g>
    </svg>
  </div>

  <!-- after the end, for the grown-up: held, a new day (again.js); a tap does nothing -->
  <button id="again" class="again" type="button" hidden title="A new day: hold (for the grown-up)" aria-label="A new day: hold">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle class="again-sun" cx="24" cy="24" r="8" />
      <path class="again-rays" d="M24 9 V13 M24 35 V39 M9 24 H13 M35 24 H39 M13.4 13.4 L16.2 16.2 M31.8 31.8 L34.6 34.6 M13.4 34.6 L16.2 31.8 M31.8 16.2 L34.6 13.4" />
      <circle class="again-ring" cx="24" cy="24" r="21" />
    </svg>
  </button>

  <script src="debug.js"></script>
  <script src="turn.js"></script>
  <script src="filmlook.js"></script>
  <script src="effects.js"></script>
  <script src="layout.js"></script>
  <script src="autumn.js"></script>
  <script src="painting.js"></script>
  <script src="day.js"></script>
  <script src="eclipse.js"></script>
  <script src="world.js"></script>
  <script src="creature.js"></script>
  <script src="ambient.js"></script>
  <script src="wind.js"></script>
  <script src="sound.js"></script>
  <script src="tunes.js"></script>
  <script src="samples.js"></script>
  <script src="bed.js"></script>
  <script src="beds.js"></script>
  <script src="ensemble.js"></script>
  <script src="takes.js"></script>
  <script src="music.js"></script>
  <script src="view.js"></script>
  <script src="church.js"></script>
  <script src="spring.js"></script>
  <script src="nest.js"></script>
  <script src="owl.js"></script>
  <script src="oak.js"></script>
  <script src="fence.js"></script>
  <script src="storm.js"></script>
  <script src="weather.js"></script>
  <script src="critters.js"></script>
  <script src="cricket.js"></script>
  <script src="wildart.js"></script>
  <script src="wildlife.js"></script>
  <script src="flock.js"></script>
  <script src="heron.js"></script>
  <script src="moleart.js"></script>
  <script src="den.js"></script>
  <script src="mole.js"></script>
  <script src="foxart.js"></script>
  <script src="friends.js"></script>
  <script src="things.js"></script>
  <script src="egg.js"></script>
  <script src="poles.js"></script>
  <script src="paint.js"></script>
  <script src="car.js"></script>
  <script src="afterrain.js"></script>
  <script src="rain.js"></script>
  <script src="umbrella.js"></script>
  <script src="again.js"></script>
  <script src="meadow.js"></script>
</body>
</html>
