[project]
name = "re-kid"
version = "0.1.0"
description = "Small, faithful games from nostalgic childhood cartoons."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa==1.0.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The browser tests play the game in real time (minutes); run them with -m browser.
addopts = "-m 'not browser and not perf'"
markers = [
  "browser: drives a game in the installed Chrome (slow: uv run pytest -m browser -n 8)",
  "perf: performance budgets, one at a time on an idle machine (uv run pytest -m perf)",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
