[project]
name = "re-kid"
version = "0.1.0"
description = "Small, faithful games from nostalgic childhood cartoons."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
