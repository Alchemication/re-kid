name: Public Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "worlds/*/games/*/game/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build site
        # The games are plain static pages, so "building" is copying each
        # worlds/<world>/games/<game>/game/ to _site/<world>/<game>/ (main.py
        # replay maps a report saved on the site back to that folder), and
        # site/ (the front page, where a child picks a scene) to the top.
        # Only those go out: no research or media. The one original
        # recording is the bark (game/barks.js), Adam's call for the POC.
        run: |
          mkdir -p _site
          for game in worlds/*/games/*/game; do
            world=$(echo "$game" | cut -d/ -f2)
            name=$(echo "$game" | cut -d/ -f4)
            mkdir -p "_site/$world"
            cp -R "$game" "_site/$world/$name"
          done
          cp -R site/. _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
