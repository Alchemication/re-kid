name: Public Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "worlds/*/games/*/game/**"
      - "site/**"
      - "src/website.py"
      - "src/config.py"
      - "docs/DESIGN_PRINCIPLES.md"
      - "worlds/*/world.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Build site
        # main.py site (src/website.py) copies each
        # worlds/<world>/games/<game>/game/ to _site/<world>/<game>/ (main.py
        # replay maps a report saved on the site back to that folder) and
        # site/ to the top, filling the pages' facts from the games' code and
        # the worlds' dossiers; it fails, publishing nothing, on a fact it
        # can't fill. Only those go out: no research files or media. The one
        # original recording is the bark (game/barks.js), Adam's call for the
        # POC.
        run: |
          uv run --no-dev python main.py site --out _site
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
