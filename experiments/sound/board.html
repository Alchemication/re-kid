<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound board</title>
<link rel="stylesheet" href="../board/board.css">
</head>
<body>
<script src="../../worlds/reksio/games/yard/game/debug.js"></script>
<script src="../../worlds/reksio/games/yard/game/sound.js"></script>
<script src="out/manifest.js"></script>
<script src="../board/board.js"></script>
<script>
  // Each sound with what the game plays today (the yard's synth, for Reksio's
  // sounds) and the takes a model made. Picks keep the shape adopt.py reads.
  const items = Object.entries(window.CANDIDATES || {}).map(([name, s]) => {
    const world = s.world || 'reksio'
    const synth = () => { Sound.ensure(); Sound[name]() }
    const silent = (s.for || '').includes('Silent')
    const yard = world === 'reksio' && typeof Sound !== 'undefined' && typeof Sound[name] === 'function'
    return {
      name, world, for: s.for, candidates: s.candidates,
      now: yard ? [
        { label: '▶ Now (synth)', run: synth, disabled: silent },
        { label: '▶ Now ×3', run: () => { synth(); setTimeout(synth, 900); setTimeout(synth, 1800) }, disabled: silent }, // a page of its own: plain timers are fine here
      ] : [],
      nowNote: silent ? 'silent in the game now' : yard ? 'what the game plays today' : 'not in a game yet',
    }
  })
  Board.mount({
    title: 'Sound board',
    lead: 'Each sound, and takes made by a model. Play one, then mark it <b>keep</b>, <b>maybe</b> or <b>no</b>, with a note if something is right or wrong. Marks stay in this browser; <b>Save picks</b> downloads them for Claude.',
    storageKey: 'sound-board-picks',
    saveName: 'picks.json',
    nameKey: 'sound',
    volumeLabel: 'Volume',
    empty: 'No takes yet: run generate_eleven.py.',
    items,
    group: (c) => ({ key: `${c.source}|${c.wording}|${c.prompt}`, label: `${c.source} · wording ${c.wording}`, prompt: c.prompt }),
    takeLabel: (c) => ({ title: `Take ${c.seed}`, sub: '' }),
    plays: (c) => [{ label: '▶', title: 'Play (space)', src: `out/${c.file}` }],
  })
</script>
</body>
</html>
