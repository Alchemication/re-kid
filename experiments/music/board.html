<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music board</title>
<link rel="stylesheet" href="../board/board.css">
</head>
<body>
<script src="../../worlds/reksio/games/yard/game/debug.js"></script>
<script src="../../worlds/reksio/games/yard/game/sound.js"></script>
<script src="../../worlds/reksio/games/yard/game/samples.js"></script>
<script src="../../worlds/reksio/games/yard/game/tunes.js"></script>
<script src="../../worlds/reksio/games/yard/game/music.js"></script>
<script src="out/manifest.js"></script>
<script src="../board/board.js"></script>
<script>
  // Each piece with what the game plays today (a random take of that part, as
  // packed, through the yard's music.js) and takes made by ElevenLabs Music,
  // all levelled to the same loudness. Picks keep the shape adopt.py reads.
  const codevol = Object.assign(document.createElement('input'), { type: 'range', min: 0, max: 2, step: 0.05, value: 1 })
  const codeLabel = document.createElement('label')
  codeLabel.append("Today's code ", codevol)
  const code = (part) => {
    const { master } = Sound.bus()
    master.gain.value = Number(codevol.value)
    Music.audition(part)
  }
  const NAMES = { morning: 'a morning take', phrase: 'a phrase', lullaby: 'a lullaby take' }
  const items = Object.entries(window.PIECES || {}).map(([name, p]) => ({
    name, world: p.world || 'reksio', for: p.for, candidates: p.candidates,
    now: (p.now || []).map((part) => ({ label: `▶ Today: ${NAMES[part] || part}`, run: () => code(part) })),
  }))
  Board.mount({
    title: 'Music board',
    lead: 'What the game plays today, and takes made by ElevenLabs Music, levelled to the same loudness. <b>▶</b> plays a take as made, <b>R</b> through the retro recipe the sound effects use (mono, narrower, a little saturated). Mark each <b>keep</b>, <b>maybe</b> or <b>no</b>, with a note on what is right or wrong. Marks stay in this browser; <b>Save picks</b> downloads them for Claude.',
    storageKey: 'music-board-picks',
    saveName: 'music-picks.json',
    nameKey: 'piece',
    volumeLabel: 'Takes',
    extra: [codeLabel],
    empty: 'No takes yet: run generate.py, then level.py.',
    items,
    group: (c) => {
      const from = c.from ? ` · from ${c.from}, ${c.strength}` : ''
      return { key: `${c.model || c.source}|${c.from}|${c.strength}|${c.prompt}`, label: `${c.model || c.source}${from} · wording ${c.wording}`, prompt: c.prompt }
    },
    takeLabel: (c) => ({ title: `Take ${c.file.split('/').pop().replace('.mp3', '')}`, sub: '' }),
    plays: (c) => [
      { label: '▶', title: 'Play as made (space)', src: `out/${c.level || c.file}` },
      { label: 'R', title: 'Play retro', src: `out/${c.retro || c.file}`, alt: true },
    ],
  })
</script>
</body>
</html>
