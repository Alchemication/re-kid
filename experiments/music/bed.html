<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background music</title>
<link rel="stylesheet" href="../board/board.css">
<style>
  /* the bed board's own parts, on the shared boards' look (board.css) */
  .hero { display: flex; gap: 14px; align-items: center; flex: 1; min-width: 260px; }
  .hero .big { font-size: 28px; width: 38px; text-align: center; }
  .hero .scene-now { font-weight: 700; }
  .hero .ask { font-size: 13px; color: #f3ead6; }
  .hero .timeline { display: flex; gap: 3px; margin-top: 5px; }
  .hero .timeline span { height: 5px; flex: 1; border-radius: 3px; background: #ffffff33; }
  .hero .timeline span.done { background: var(--sun); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); padding: 20px 24px 20px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card.hidden { display: none; }
  .card.playing { border-color: var(--ink); box-shadow: 0 0 0 4px var(--paper), 0 0 0 7px var(--sun); }
  .card.keep { border-color: var(--keep); background: #f3faea; }
  .card.maybe { border-color: var(--maybe); background: #fff7e6; }
  .card.no { border-color: var(--no); opacity: 0.6; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .em { font-size: 26px; }
  .card h2 { margin: 0; font: 700 20px/1.2 var(--hand); }
  .card .what { color: var(--soft); margin: 0; }
  .card .listen { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; border: 0; border-radius: 999px; background: var(--mole); color: #fff; font-weight: 700; padding: 8px 16px 8px 10px; }
  .card .listen svg { width: 16px; height: 16px; }
  .card .listen::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--nose); }
  .card .verdict button { padding: 5px 0; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .card .chip, .manual .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; }
  .card .chip.on, .manual .chip.on { background: var(--ochre); border-color: var(--wood-dk); }
  .card textarea { width: 100%; font-size: 13px; border: 2px solid var(--line); border-radius: 8px; padding: 4px 6px; min-height: 44px; resize: vertical; }
  .q { font-size: 13px; color: var(--soft); }
  .footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 0 24px; color: var(--soft); }
  details.manual { margin: 18px 24px 60px; color: var(--soft); }
  details.manual summary { cursor: pointer; }
  @media (max-width: 760px) { .grid { padding: 16px; } .footer { padding: 0 16px; } details.manual { margin: 18px 16px 60px; } }
</style>
</head>
<body>

<script src="../../worlds/reksio/games/yard/game/samples.js"></script>
<script src="../../worlds/reksio/games/yard/game/bed.js"></script>
<script src="../../worlds/reksio/games/yard/game/beds.js"></script>

<script>
// The page, on the boards' shared frame (board.js): the scene, a bar with
// what plays now, the folders, then a card for each bed.
const frame = Board.frame({
  title: 'Bed board',
  lead: 'Quiet music that is always there underneath, changing with what happens. Press <b>▶ Listen</b> on a card: 45 seconds of a pretend day, with what happens shown in the bar. Pick a <b>folder</b> to see only the new beds. Ask yourself: <b>does it belong to Reksio\'s yard</b> (<code>worlds/reksio/MUSIC_DIRECTION.md</code>), or could it be any cartoon\'s?',
})
frame.bar.innerHTML = `
  <div class="hero"><div class="big" id="heroEmoji">🎧</div>
    <div style="flex:1"><div class="scene-now" id="heroScene">Press ▶ on any card below</div>
      <div class="ask" id="heroAsk">Each one plays a short pretend day: morning, playing, quiet, rain, evening, a nap.</div>
      <div class="timeline" id="timeline"></div></div></div>
  <label title="As the game plays it: the yard's old-film sound (beds.js SOUND), notes a little loose"><input id="old" type="checkbox" checked> 🎞 Old film sound</label>
  <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.4"></label>
  <button class="btn" id="stop" title="Stop (Esc)">■ Stop</button>
  <span class="progress" id="count"></span>
  <button class="btn primary" id="save" title="Download the picks for Claude">Save picks</button>`
frame.main.innerHTML = `<div class="grid" id="cards"></div>
  <div class="footer">Saving downloads <b>bed-picks.json</b>: put it in <code>experiments/music/</code>, or just tell Claude.</div>
  <details class="manual"><summary>Try it by hand (optional)</summary>
    <p>While one plays, pick what's happening in the yard, and hear it change.</p>
    <div class="chips" id="manual"></div>
    <p><button class="btn" id="touch">✨ He does something new</button> <button class="btn" id="take">🎵 A recorded clip comes in</button></p>
    <p>The recorded clips are in their own keys, so a jump between this music and a clip is expected for now.</p></details>`

const TONIC = 58 // B-flat3, the touches' key
const SCALE = [0, 2, 4, 5, 7, 9, 11]
const deg = (s) => TONIC + 12 * Math.floor(s / 7) + SCALE[((s % 7) + 7) % 7]
const triad = (d) => [deg(d), deg(d + 2), deg(d + 4)]
const MOODS = {
  morning: { chords: [0, 3, 0, 4], lift: 12, dens: [2, 5] },
  day: { chords: [0, 5, 3, 4], lift: 0, dens: [2, 5] },
  afternoon: { chords: [0, 2, 3, 0], lift: 0, dens: [1, 4] },
  dusk: { chords: [5, 3, 0, 4], lift: 0, dens: [1, 3] },
  rain: { chords: [0, 3], lift: 12, dens: [1, 3] },
  rest: { chords: [0, 3], lift: 0, dens: [0, 1] },
}
const density = (m, e) => Math.round(m.dens[0] + (m.dens[1] - m.dens[0]) * e)
function slots(n, beats, rnd) {
  const out = new Set()
  for (let i = 0; i < n * 3 && out.size < n; i++) out.add(1 + Math.floor(rnd() * (beats * 2 - 1)))
  return [...out]
}

// The pretend day each ▶ plays: when (seconds), what's happening, and what to listen for.
const TOUR = [
  { t: 0, mood: 'morning', energy: 0.5, emoji: '🌅', scene: 'Morning: Reksio has just woken up', ask: 'Bright and fresh?' },
  { t: 7, mood: 'day', energy: 1, emoji: '👆', scene: 'Daytime: the child is tapping lots of things', ask: 'Lively enough to feel like play, not too busy?' },
  { t: 11, mood: 'day', energy: 1, emoji: '✨', scene: 'He does something new: a sparkle plays', ask: 'Does the sparkle fit with the music, or clash?', touch: true },
  { t: 16, mood: 'day', energy: 0, emoji: '👀', scene: 'The child stops and just watches', ask: 'Does it calm down, but not go silent?' },
  { t: 23, mood: 'rain', energy: 0.4, emoji: '🌧', scene: 'It starts to rain', ask: 'Does it feel like rain, softer?' },
  { t: 30, mood: 'dusk', energy: 0.3, emoji: '🌇', scene: 'Evening: the sun goes down', ask: 'Winding down, a little sleepy?' },
  { t: 37, mood: 'rest', energy: 0, emoji: '💤', scene: 'Reksio lies down for a nap', ask: 'Nearly nothing, but still there?' },
  { t: 45, end: true },
]
const SCENES = [['morning', '🌅 Morning'], ['day', '🐕 Playing'], ['afternoon', '☀️ Lazy afternoon'], ['dusk', '🌇 Evening'], ['rain', '🌧 Rain'], ['rest', '💤 Napping']]

const BEDS = [
  {
    id: 'musicbox', name: 'Music box', emoji: '🎁', bpm: 72,
    what: 'Plucked strings and a little bell, like a music box.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = [{ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.32 }]
      for (const s of slots(density(m, e), 4, rnd)) {
        const glock = rnd() < 0.25
        out.push({ i: glock ? 'glock' : 'pizz', midi: c[Math.floor(rnd() * 3)] + m.lift + (glock ? 12 : 0), at: s / 2, v: glock ? 0.16 : 0.24 })
      }
      return out
    },
  },
  {
    id: 'tiptoe', name: 'Tiptoe walk', emoji: '🐾', bpm: 96,
    what: 'A plucked bass walking on every beat: the cartoon "sneaking about" feel.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      const walk = [c[0] - 12, c[1] - 12, c[2] - 12, c[1] - 12]
      walk.forEach((midi, k) => { if (k === 0 || e > 0.25 || k === 2) out.push({ i: 'pizz', midi, at: k, v: 0.26 }) })
      for (const s of slots(Math.max(0, density(m, e) - 1), 4, rnd)) out.push({ i: rnd() < 0.5 ? 'xylo' : 'pizz', midi: c[Math.floor(rnd() * 3)] + 12 + m.lift, at: s / 2, v: 0.14 })
      return out
    },
  },
  {
    id: 'lightoompah', name: 'Soft oom-pah', emoji: '🎺', bpm: 88,
    what: 'The old music\'s idea (bassoon, plucked chords), much quieter and with no tune.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      out.push({ i: 'bassoon', midi: c[0] - 12, at: 0, v: 0.22 })
      if (e > 0.2) out.push({ i: 'bassoon', midi: c[2] - 24, at: 2, v: 0.18 })
      for (const b of [1, 3]) for (const midi of [c[1], c[2]]) out.push({ i: 'pizz', midi: midi + m.lift, at: b, v: 0.13 })
      return out
    },
  },
  {
    id: 'air', name: 'Air', emoji: '🎐', bpm: 64,
    what: 'High and sparse: a bell here and there, a little flute now and then.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      for (const s of slots(Math.max(1, density(m, e) - 1), 4, rnd)) out.push({ i: 'glock', midi: c[Math.floor(rnd() * 3)] + 12 + m.lift, at: s / 2, v: 0.15 })
      if (rnd() < 0.25 + 0.3 * e) [c[2] + 14, c[2] + 12, c[1] + 12].forEach((midi, k) => out.push({ i: 'flute', midi: midi + m.lift, at: 2 + k * 0.5, v: 0.17 }))
      return out
    },
  },
  {
    id: 'patter', name: 'Xylophone patter', emoji: '🪵', bpm: 84,
    what: 'Soft xylophone notes rolling up and down.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      if (n % 2 === 0) out.push({ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.3 })
      const run = [c[0], c[1], c[2], c[0] + 12, c[2], c[1]]
      const len = Math.max(1, Math.round(1 + 5 * e * (m.dens[1] / 5)))
      const from = Math.floor(rnd() * 3)
      for (let k = 0; k < len; k++) out.push({ i: 'xylo', midi: run[(from + k) % run.length] + 12 + m.lift, at: 1 + k * 0.5, v: 0.12 })
      return out
    },
  },
  {
    id: 'conversation', name: 'Flute and bassoon chatting', emoji: '💬', bpm: 76,
    what: 'A low bassoon asks, a high flute answers, over and over.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = [{ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.26 }]
      if (n % 2 === 0) {
        const q = [c[0] - 12, c[1] - 12, c[2] - 12]
        q.forEach((midi, k) => out.push({ i: 'bassoon', midi, at: 1 + k * 0.5, v: 0.2 }))
      } else if (rnd() < 0.5 + 0.5 * e) {
        const a = [c[2] + 12, c[1] + 12, c[0] + 12]
        a.forEach((midi, k) => out.push({ i: 'flute', midi: midi + m.lift, at: 1 + k * 0.5, v: 0.16 }))
      }
      return out
    },
  },
  {
    id: 'floor', name: 'Almost nothing', emoji: '🤫', bpm: 60,
    what: 'Just a low note now and then and a rare bell: the least it can be.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      if (n % 2 === 0) out.push({ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.28 })
      if (n % 3 === 1 || rnd() < 0.3 * e) out.push({ i: 'glock', midi: c[Math.floor(rnd() * 3)] + 12 + m.lift, at: 2, v: 0.14 })
      return out
    },
  },
  {
    id: 'drips', name: 'Drips', emoji: '💧', bpm: 80,
    what: 'High notes at odd moments, like drops off a roof. Meant for rain.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      if (n % 2 === 0) out.push({ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.24 })
      const k = 2 + Math.round(4 * e)
      for (let j = 0; j < k; j++) out.push({ i: rnd() < 0.5 ? 'glock' : 'pizz', midi: c[Math.floor(rnd() * 3)] + 24, at: 0.25 + rnd() * 3.6, v: 0.12 })
      return out
    },
  },
  // winter candidates (2026-10-27, made while Adam slept): a season's own bed
  {
    id: 'snowfall', name: 'Snowfall (winter)', emoji: '❄️', bpm: 66, folder: '27 Oct: winter beds', made: '2026-10-27',
    what: 'Winter: high bell notes drifting down a chord at odd moments, over a soft plucked root. Slow and sparse, like snow coming down.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      if (n % 2 === 0) out.push({ i: 'pizz', midi: c[0] - 12, at: 0, v: 0.26 })
      const down = [c[2] + 24, c[1] + 24, c[0] + 24, c[2] + 12]
      const k = 1 + Math.round((2 + 2 * e) * (m.dens[1] / 5))
      const from = 0.5 + rnd() * 1.2
      for (let j = 0; j < Math.min(k, down.length); j++) out.push({ i: 'glock', midi: down[j], at: from + j * (0.6 + rnd() * 0.3), v: 0.11 - j * 0.015 })
      return out
    },
  },
  {
    id: 'snowplay', name: 'Snow play (winter)', emoji: '⛄', bpm: 92, folder: '27 Oct: winter beds', made: '2026-10-27',
    what: 'Winter, while the child plays: a light plucked bounce on the beat, bells skittering on top now and then.',
    bar(m, e, n, rnd) {
      const c = triad(m.chords[n % m.chords.length]), out = []
      ;[c[0], c[2], c[1], c[2]].forEach((midi, k) => {
        if (k % 2 === 0 || e > 0.3) out.push({ i: 'pizz', midi: midi - 12, at: k, v: k === 0 ? 0.26 : 0.18 })
      })
      if (rnd() < 0.35 + 0.5 * e) {
        const at = 2 + Math.floor(rnd() * 3) / 2
        ;[c[0], c[1], c[2]].forEach((midi, k) => out.push({ i: 'glock', midi: midi + 24 + m.lift, at: at + k * 0.25, v: 0.1 }))
      }
      return out
    },
  },
]


// The one the game plays (bed.js): each moment its own bed from those above.
BEDS.unshift({
  id: 'yard', name: 'The yard\'s day, as the game plays it', emoji: '🏡', game: true,
  what: 'Each moment its own: music box in the morning and while watching, tiptoe while playing, patter in the afternoon, chatting at evening, drips in the rain, almost nothing for a nap.',
})

// ---------------------------------------------------------------- engine

let ctx, master, ready = null
const buffers = {}
const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer
function prepare() {
  if (ready) return ready
  ctx = new AudioContext()
  master = ctx.createGain()
  master.gain.value = Number($('volume').value)
  master.connect(ctx.destination)
  chain()
  ready = Promise.all(Object.entries(SAMPLES).map(async ([inst, notes]) => {
    buffers[inst] = await Promise.all(notes.map(async (n) => ({ midi: n.midi, buffer: await ctx.decodeAudioData(bytes(n.data)) })))
    buffers[inst].sort((a, b) => (a.midi ?? 0) - (b.midi ?? 0))
  }))
  return ready
}
function play(inst, midi, t, vol, out) {
  const list = buffers[inst]
  if (!list?.length) return
  let pick = list[0], rate = 1
  if (midi != null) {
    pick = list.reduce((b, s) => (Math.abs(s.midi - midi) < Math.abs(b.midi - midi) ? s : b))
    rate = 2 ** ((midi - pick.midi) / 12)
  }
  const src = ctx.createBufferSource()
  src.buffer = pick.buffer
  src.playbackRate.value = rate
  const g = ctx.createGain()
  g.gain.value = vol
  src.connect(g).connect(out)
  src.start(Math.max(t, ctx.currentTime))
}
// the old-film sound, as the game's bed has it (beds.js SOUND, played by ensemble.js)
let bedOut = null, retroIn = null
function chain() {
  const s = YardBeds.SOUND
  bedOut = ctx.createGain()
  const vol = ctx.createGain(); vol.gain.value = s.volume / 0.9 // as quiet against the other beds as in the game
  const low = ctx.createBiquadFilter(); low.type = 'highpass'; low.frequency.value = s.highpass
  const high = ctx.createBiquadFilter(); high.type = 'lowpass'; high.frequency.value = s.lowpass
  const shaper = ctx.createWaveShaper(), curve = new Float32Array(1024)
  for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh((i / 511.5 - 1) * (1 + s.saturation)) / Math.tanh(1 + s.saturation)
  shaper.curve = curve
  const wow = ctx.createDelay(0.05); wow.delayTime.value = 0.012
  const lfo = ctx.createOscillator(); lfo.frequency.value = s.wow.hz
  const depth = ctx.createGain(); depth.gain.value = s.wow.depth
  lfo.connect(depth).connect(wow.delayTime); lfo.start()
  if (s.hiss) {
    const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = noise.getChannelData(0)
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * s.hiss
    const h = ctx.createBufferSource(); h.buffer = noise; h.loop = true; h.connect(low); h.start()
  }
  vol.connect(low).connect(high).connect(shaper).connect(wow).connect(master)
  retroIn = vol
  route()
}
const old = () => $('old').checked
function route() {
  bedOut.disconnect()
  bedOut.connect(old() ? retroIn : master)
}

function stream(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32) }

const now = { mood: 'day', energy: 0.5 } // what's happening in the pretend yard
let playing = null // { bed, card, gain, timer, tour: [timeouts] }

// one thing plays at a time, on this board and the others (Board.claim)
function stopBed() {
  if (!playing) return
  Board.release(stopBed)
  clearInterval(playing.timer)
  playing.tour.forEach(clearTimeout)
  playing.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15)
  playing.card.classList.remove('playing')
  playing.card.querySelector('.listen').innerHTML = LISTEN
  playing = null
  showScene({ emoji: '🎧', scene: 'Stopped', ask: 'Press ▶ on any card to listen.' }, -1)
}

function startBed(bed, card, tour = true) {
  stopBed()
  Board.claim(stopBed)
  const gain = ctx.createGain()
  gain.connect(bedOut)
  const rnd = stream(7)
  let n = 0, next = ctx.currentTime + 0.1, style = null, wasPlaying = false
  const tick = () => {
    while (next < ctx.currentTime + 0.6) {
      if (bed.game) {
        // the game's own: bed.js picks the bed for the moment, and plays it
        const pick = YardBeds.style(now.mood, now.energy, wasPlaying)
        if (pick.style !== style) n = 0
        style = pick.style
        wasPlaying = pick.playing
        const bar = YardBeds.bar(style, now.mood, now.energy, n, rnd)
        for (const note of bar.notes) play(note.inst, note.midi, next + note.at, note.vol, gain)
        next += bar.seconds
      } else {
        const beat = 60 / bed.bpm
        for (const note of bed.bar(MOODS[now.mood], now.energy, n, rnd)) {
          const loose = old() ? (rnd() * 2 - 1) * 0.025 : 0 // played a little loose, old-style
          play(note.i, note.midi, next + Math.max(0, note.at * beat + loose), note.v * (old() ? 1 + (rnd() * 2 - 1) * 0.15 : 1), gain)
        }
        next += 4 * beat
      }
      n += 1
    }
  }
  playing = { bed, card, gain, timer: null, tour: [] }
  if (tour) {
    TOUR.forEach((step, k) => playing.tour.push(setTimeout(() => {
      if (step.end) return finish()
      now.mood = step.mood
      now.energy = step.energy
      showScene(step, k)
      if (step.touch) setTimeout(touch, 600)
    }, step.t * 1000)))
  }
  tick()
  playing.timer = setInterval(tick, 150)
  card.classList.add('playing')
  card.querySelector('.listen').textContent = '■ Stop'
}

function finish() {
  const card = playing?.card
  stopBed()
  showScene({ emoji: '👂', scene: 'That was the whole day', ask: 'Now rate it on its card: do you like it, and what is it good for?' }, TOUR.length)
  card?.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

const $ = (id) => document.getElementById(id)
function showScene(step, k) {
  $('heroEmoji').textContent = step.emoji
  $('heroScene').textContent = step.scene
  $('heroAsk').textContent = step.ask
  ;[...$('timeline').children].forEach((s, i) => s.classList.toggle('done', i <= k))
}
TOUR.slice(0, -1).forEach(() => $('timeline').appendChild(document.createElement('span')))

async function touch() {
  if (!ctx) return
  const t = ctx.currentTime + 0.02, e = 60 / 136 / 2
  // the game's level for these was set for silence around them: here, with the music under them, about half
  ;[74, 77, 82, 86].forEach((n, k) => play('xylo', n, t + (k * e) / 2, 0.22, master))
  play('glock', 94, t + 2 * e, 0.15, master)
}

let tunes = null, takeAt = 0
function loadTunes() {
  tunes ??= new Promise((done) => {
    const s = document.createElement('script')
    s.src = '../../worlds/reksio/games/yard/game/tunes.js'
    s.onload = async () => done(await Promise.all(TUNES.phrase.map((b64) => ctx.decodeAudioData(bytes(b64)))))
    document.body.appendChild(s)
  })
  return tunes
}
async function clip() {
  await prepare()
  const list = await loadTunes()
  const src = ctx.createBufferSource()
  src.buffer = list[takeAt++ % list.length]
  const g = ctx.createGain()
  g.gain.value = 0.3 // a little above the music under it, not over it
  src.connect(g).connect(master)
  const t = ctx.currentTime + 0.1
  if (playing) {
    playing.gain.gain.setTargetAtTime(0.0001, t, 0.4)
    playing.gain.gain.setTargetAtTime(1, t + src.buffer.duration, 1.2)
  }
  src.start(t)
}

// ---------------------------------------------------------------- cards and picks

const KEY = 'bed-board-picks'
let picks = {}
try { picks = JSON.parse(localStorage.getItem(KEY)) || {} } catch { picks = {} }
const keep = () => {
  try { localStorage.setItem(KEY, JSON.stringify(picks)) } catch { /* private window: only for this visit */ }
  $('count').textContent = `${Object.values(picks).filter((p) => p.verdict).length} of ${BEDS.length} rated`
}
const VERDICTS = [['keep', '👍 Like it'], ['maybe', '🤷 Not sure'], ['no', '👎 No']]
const LISTEN = '<svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z" fill="currentColor"/></svg> Listen'
const view = (() => { try { return JSON.parse(localStorage.getItem(`${KEY}-view`)) || { folder: '' } } catch { return { folder: '' } } })()
const cards = [] // { card, bed, p }
function folders() {
  Board.folderChips(frame.folders, cards.filter((c) => !c.bed.game).map((c) => ({ folder: c.bed.folder, made: c.bed.made, unmarked: !c.p.verdict })), view.folder, (name) => {
    view.folder = name
    try { localStorage.setItem(`${KEY}-view`, JSON.stringify(view)) } catch { /* private window: only for this visit */ }
    folders()
  })
  // the game's own bed is always there, to compare with
  for (const c of cards) c.card.classList.toggle('hidden', !c.bed.game && !!view.folder && (c.bed.folder || Board.EARLIER) !== view.folder)
}

for (const bed of BEDS) {
  const p = (picks[bed.id] ??= { verdict: null, uses: [], note: '' })
  const card = document.createElement('section')
  card.className = 'card'
  cards.push({ card, bed, p })
  card.innerHTML = `
    <div class="top"><span class="em">${bed.emoji}</span><h2>${bed.name}</h2></div>
    <p class="what">${bed.what}</p>
    <button class="listen">${LISTEN}</button>
    <div class="row verdict">${VERDICTS.map(([v, label]) => `<button class="${v}" data-v="${v}">${label}</button>`).join('')}</div>
    <div class="q">Good for:</div>
    <div class="chips">${SCENES.map(([v, label]) => `<button class="chip" data-use="${v}">${label}</button>`).join('')}</div>
    <textarea placeholder="Anything to add? (optional)"></textarea>`
  card.querySelector('.listen').onclick = async () => {
    await prepare()
    if (playing?.bed === bed) return Board.stopAll()
    startBed(bed, card)
  }
  const verdicts = card.querySelectorAll('.verdict button')
  const showVerdict = () => {
    verdicts.forEach((x) => x.classList.toggle('on', p.verdict === x.dataset.v))
    card.classList.remove('keep', 'maybe', 'no')
    if (p.verdict) card.classList.add(p.verdict)
  }
  verdicts.forEach((b) => (b.onclick = () => { p.verdict = p.verdict === b.dataset.v ? null : b.dataset.v; showVerdict(); keep(); folders() }))
  showVerdict()
  card.querySelectorAll('.chip').forEach((c) => {
    c.classList.toggle('on', p.uses.includes(c.dataset.use))
    c.onclick = () => {
      p.uses = p.uses.includes(c.dataset.use) ? p.uses.filter((u) => u !== c.dataset.use) : [...p.uses, c.dataset.use]
      c.classList.toggle('on', p.uses.includes(c.dataset.use))
      keep()
    }
  })
  const note = card.querySelector('textarea')
  note.value = p.note
  note.oninput = () => { p.note = note.value; keep() }
  $('cards').appendChild(card)
}
keep()

for (const [v, label] of SCENES) {
  const b = document.createElement('button')
  b.className = 'chip'
  b.textContent = label
  b.onclick = () => {
    if (!playing) return
    playing.tour.forEach(clearTimeout) // by hand now: the pretend day stops steering
    playing.tour = []
    now.mood = v
    document.querySelectorAll('#manual .chip').forEach((x) => x.classList.toggle('on', x === b))
    showScene({ emoji: label.split(' ')[0], scene: label.slice(label.indexOf(' ') + 1), ask: 'By hand: pick another, or try the buttons below.' }, -1)
  }
  $('manual').appendChild(b)
}
$('stop').onclick = Board.stopAll
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !e.target.matches('textarea')) Board.stopAll() })
folders()
$('old').onchange = () => bedOut && route()
$('volume').oninput = () => { if (master) master.gain.setTargetAtTime(Number($('volume').value), ctx.currentTime, 0.05) }
$('touch').onclick = touch
$('take').onclick = clip
$('save').onclick = () => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(picks, null, 2)], { type: 'application/json' }))
  a.download = 'bed-picks.json'
  a.click()
}
</script>
</body>
