<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krtek's meadow</title>
<!-- The front page's card for Krtek's meadow (index.html shows it in a frame,
     so the meadow's scripts don't meet the yard's): the meadow round his
     molehill as the game paints it (its painting.js), the molehill and the
     flower bed as the game draws them, and the mole drawn by the game's
     moleart.js, under the games' old-print look (filmlook.js). He pops up
     out of his molehill and, every few seconds, does one of a few things
     chosen at random. index.html asks him to cheer (postMessage 'cheer')
     when he is tapped. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #94b8ea; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<svg id="world" viewBox="520 330 760 570" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94b8ea" /><stop offset="1" stop-color="#e4e8f6" /></linearGradient>
  </defs>
  <g id="sky"><rect x="-200" y="-200" width="2400" height="1000" fill="url(#sky-grad)" /></g>
  <g id="far-view"><g id="far" transform="translate(-60 0)"></g></g>
  <g id="back-ground"><path d="M-200 640 C200 600 500 630 800 612 S1300 600 1800 630 S2600 612 3000 626 S3800 604 4200 630 V900 H-200 Z" fill="#a3cc82" /></g>
  <g id="mole-at"><g transform="translate(900 736) scale(1.2)"><g id="mole-fig"></g></g></g>
  <g id="hill" transform="translate(900 720)"></g>
  <g id="front-ground"><path d="M-200 718 C300 712 700 724 1000 716 S1500 712 1800 720 S2700 726 3100 716 S3800 714 4200 720 V900 H-200 Z" fill="#86bb60" /></g>
  <g id="bed"></g>
</svg>
<script>
  // The meadow's own parts: on the site, its folder; opened from disk, the repo's.
  const GAME = location.protocol === 'file:' ? '../worlds/krtek/games/meadow/game/' : 'krtek/meadow/'
  const SVG = 'http://www.w3.org/2000/svg'
  const ACTS = ['wave', 'look', 'perk', 'duck', 'wave', 'look'] // what he does now and then, one at random
  const ACT_MS = [2400, 5200] // between them
  const DOWN = 240 // down in his molehill, this far below his place up to his middle
  const between = ([a, b]) => a + Math.random() * (b - a)
  const ease = (t) => 1 - (1 - t) ** 3
  const load = (src) => new Promise((resolve, reject) => document.head.appendChild(Object.assign(document.createElement('script'), { src: GAME + src, onload: resolve, onerror: reject })))
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(SVG, tag)
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v)
    parent.appendChild(e)
    return e
  }

  /** His molehill and the flower bed, drawn as the game draws them (meadow.js hill, makeBed). */
  function scene() {
    const [w, h] = [240, 64]
    const hill = document.getElementById('hill')
    el('path', { d: `M${-w / 2} 6 C${-w * 0.42} ${-h * 0.7} ${-w * 0.22} ${-h} 0 ${-h} C${w * 0.22} ${-h} ${w * 0.42} ${-h * 0.7} ${w / 2} 6 Z`, fill: '#6e4a24', stroke: '#2b1b0b', 'stroke-width': 3 }, hill)
    for (let i = 0; i < 16; i++) el('circle', { cx: (Math.random() - 0.5) * w * 0.75, cy: -Math.random() * h * 0.8, r: 4 + Math.random() * 7, fill: Math.random() < 0.5 ? '#38250a' : '#8a5d2e' }, hill)
    const bed = document.getElementById('bed')
    const colours = ['#e0453a', '#f08fa6', '#e0453a', '#f2c94c', '#e0453a', '#f08fa6', '#e0453a', '#f2c94c', '#e0453a']
    for (let i = 0; i < 9; i++) {
      const x = 1020 + (i * 260) / 8 + (Math.random() - 0.5) * 14
      const base = 812 + (i % 2) * 22
      const top = base - 96 - Math.random() * 40
      el('path', { d: `M${x} ${base} V${top}`, stroke: '#3f7d22', 'stroke-width': 5 }, bed)
      el('path', { d: `M${x} ${base - 20} c-28 -10 -36 -36 -30 -58 c16 12 28 30 30 50`, fill: '#4d6d1f' }, bed)
      const c = colours[i]
      for (const d of [`M${x} ${top} c-20 -4 -26 -26 -18 -44 l10 10 z`, `M${x} ${top} c20 -4 26 -26 18 -44 l-10 10 z`, `M${x - 9} ${top - 2} c0 -20 4 -38 9 -44 c5 6 9 24 9 44 z`]) {
        const petal = el('path', { d, fill: c, stroke: '#7a1f17', 'stroke-width': 2 }, bed)
        petal.style.transformOrigin = `${x}px ${top}px`
      }
      const [l, r] = [...bed.querySelectorAll('path')].slice(-3)
      l.style.transform = 'rotate(-34deg)' // open, as in the day
      r.style.transform = 'rotate(34deg)'
    }
  }

  async function start() {
    scene()
    for (const s of ['debug.js', 'layout.js', 'painting.js', 'moleart.js', 'filmlook.js']) await load(s)
    const svg = document.getElementById('world')
    const ctm = svg.getScreenCTM()
    Painting.paint({
      sky: document.getElementById('sky'), far: document.getElementById('far'),
      back: document.getElementById('back-ground'), front: document.getElementById('front-ground'),
      bed: document.getElementById('bed'),
    }, (ctm ? ctm.a : 1) * (devicePixelRatio || 1))
    const bed = document.getElementById('bed')
    bed.insertBefore(bed.lastChild, bed.firstChild) // the bed's painted mass behind the tulips
    FilmLook.mount(document.body)

    const views = MoleArt.draw(document.getElementById('mole-fig'), [])
    for (const v of Object.values(views)) for (const f of v.feet) f.style.visibility = 'hidden' // in his molehill
    const at = document.getElementById('mole-at')
    const show = (name, dir = 1) => {
      for (const [k, v] of Object.entries(views)) {
        v.view.style.display = k === name ? '' : 'none'
        v.view.style.transform = name !== 'front' && dir < 0 ? 'scaleX(-1)' : ''
      }
    }
    const mouth = (m) => { for (const v of Object.values(views)) for (const k of ['smile', 'laugh', 'oh', 'frown']) v[k].style.display = k === m ? '' : 'none' }
    show('front')

    let upFrom = performance.now() + between([300, 1400]) // he pops up a moment after the page opens
    let downAt = Infinity
    let act = null // { name, from, until, dir }
    let nextAct = upFrom + between([1500, 3500])
    let blinkAt = performance.now() + between([1500, 3500])
    let cheer = 0
    addEventListener('message', (e) => { if (e.data === 'cheer') cheer = performance.now() })

    const frame = (now) => {
      // up out of his molehill (with a bounce), or ducking down and back up
      const rise = Math.max(0, Math.min(1, (now - upFrom) / 420))
      const sink = Math.max(0, Math.min(1, (now - downAt) / 260))
      let y = DOWN * (1 - (rise < 1 ? Math.min(1, ease(rise) * 1.08) : 1)) + DOWN * ease(sink) + 3 * Math.sin(now / 380)
      if (sink >= 1 && now > downAt + 900) { upFrom = now; downAt = Infinity } // and back up
      const v = views.front
      const [l, r] = v.arms
      l.style.transform = 'rotate(60deg)' // his hands on the rim
      r.style.transform = 'rotate(-60deg)'
      if (!act && now > nextAct && rise >= 1 && downAt === Infinity) {
        const name = ACTS[Math.floor(Math.random() * ACTS.length)]
        act = { name, from: now, until: now + between(name === 'look' ? [1200, 2200] : [1000, 1600]), dir: Math.random() < 0.5 ? 1 : -1 }
        if (name === 'duck') downAt = now
        if (name === 'perk' || name === 'duck') {
          for (const w of Object.values(views)) w.hair.animate([{ transform: 'none' }, { transform: 'scaleY(1.3) rotate(-8deg)', offset: 0.2 }, { transform: 'scaleY(0.94) rotate(5deg)', offset: 0.55 }, { transform: 'none' }], { duration: 650 })
          mouth('oh')
        }
      }
      if (act) {
        const t = (now - act.from) / (act.until - act.from)
        if (act.name === 'wave') r.style.transform = `rotate(${-88 + 14 * Math.sin(t * Math.PI * 6)}deg)` // beside his head, not over his eye
        show(act.name === 'look' ? 'three' : 'front', act.dir)
        if (t >= 1) { act = null; mouth('smile'); nextAct = now + between(ACT_MS) }
      }
      if (now > blinkAt) {
        const t = (now - blinkAt) / 160
        for (const w of Object.values(views)) w.lids.style.transform = `scaleY(${t < 1 ? Math.sin(t * Math.PI) : 0})`
        if (t >= 1) blinkAt = now + between([1800, 5000])
      }
      if (cheer) {
        const k = ease(Math.min(1, (now - cheer) / 180))
        show('front')
        mouth('laugh')
        l.style.transform = `rotate(${60 + 35 * k}deg)` // both arms out and up, hooray (further, they cover his face)
        r.style.transform = `rotate(${-60 - 35 * k}deg)`
        y = Math.min(y, -30 * k)
      }
      at.style.transform = `translateY(${y.toFixed(1)}px)`
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  }
  start()
</script>
</body>
</html>
